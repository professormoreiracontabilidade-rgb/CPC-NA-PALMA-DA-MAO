<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>200 Questões Comentadas | Professor Moreira</title><link rel="stylesheet" href="../assets/cpc04.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>200 Questões Comentadas</h1><p>CPC 04 (R1) — Ativo Intangível</p></div></header><nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc04-resumo.html">Resumo</a><a href="../mapas/cpc04-mapa.html">Mapa</a><a href="../casos/cpc04-casos.html">Casos</a><a href="../resumos/cpc04-flashcards.html">Flashcards</a><a href="../quizzes/cpc04-index.html">Quizzes</a><a href="../comentarios/cpc04-questoes.html">Questões</a><a href="../questoes/cpc04-banco.html">Banco</a></nav><main><section class="card"><p id="num"></p><h2 id="q"></h2><div id="opts" class="answers"></div><div id="exp" class="note hidden"></div><div class="toolbar"><button id="prev">← Voltar</button><button id="next">Avançar →</button></div></section></main><footer>Curso de Contabilidade Professor Moreira • WhatsApp 61 985323574</footer><script>const D=[{"id": 1, "tema": "Definição", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre definição.", "alternativas": ["Ativo intangível é um ativo não monetário identificável sem substância física.", "Treinamento integra sempre o custo do ativo.", "Goodwill gerado internamente deve ser reconhecido.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Marca interna deve ser reconhecida pelo valor de mercado."], "correta": 0, "comentario": "A regra correta é: Ativo intangível é um ativo não monetário identificável sem substância física. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 2, "tema": "Identificação", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre identificação.", "alternativas": ["A amortização começa na data do pagamento.", "O ativo é identificável quando é separável ou resulta de direitos contratuais ou outros direitos legais.", "Gasto reconhecido como despesa pode ser reintegrado depois.", "Vida útil indefinida deve ser amortizada em dez anos.", "Todo gasto intangível deve ser ativado."], "correta": 1, "comentario": "A regra correta é: O ativo é identificável quando é separável ou resulta de direitos contratuais ou outros direitos legais. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 3, "tema": "Controle", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre controle.", "alternativas": ["Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Todo gasto intangível deve ser ativado.", "A entidade deve controlar os benefícios econômicos futuros e restringir o acesso de terceiros.", "A amortização começa na data do pagamento.", "Goodwill gerado internamente deve ser reconhecido."], "correta": 2, "comentario": "A regra correta é: A entidade deve controlar os benefícios econômicos futuros e restringir o acesso de terceiros. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 4, "tema": "Benefícios futuros", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre benefícios futuros.", "alternativas": ["Goodwill gerado internamente deve ser reconhecido.", "Todo gasto intangível deve ser ativado.", "Treinamento integra sempre o custo do ativo.", "Podem decorrer de receitas, redução de custos ou outros benefícios resultantes do uso do ativo.", "Website promocional é sempre ativo."], "correta": 3, "comentario": "A regra correta é: Podem decorrer de receitas, redução de custos ou outros benefícios resultantes do uso do ativo. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 5, "tema": "Reconhecimento", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre reconhecimento.", "alternativas": ["Valor residual é sempre elevado.", "Marca interna deve ser reconhecida pelo valor de mercado.", "Goodwill gerado internamente deve ser reconhecido.", "A amortização começa na data do pagamento.", "Somente ocorre quando forem prováveis os benefícios econômicos futuros e o custo puder ser mensurado com confiabilidade."], "correta": 4, "comentario": "A regra correta é: Somente ocorre quando forem prováveis os benefícios econômicos futuros e o custo puder ser mensurado com confiabilidade. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 6, "tema": "Mensuração inicial", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre mensuração inicial.", "alternativas": ["O ativo intangível é reconhecido inicialmente ao custo.", "Vida útil indefinida deve ser amortizada em dez anos.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Goodwill gerado internamente deve ser reconhecido.", "Valor residual é sempre elevado."], "correta": 0, "comentario": "A regra correta é: O ativo intangível é reconhecido inicialmente ao custo. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 7, "tema": "Aquisição separada", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre aquisição separada.", "alternativas": ["Todo gasto intangível deve ser ativado.", "Inclui preço de compra, tributos não recuperáveis e custos diretamente atribuíveis à preparação do ativo.", "Goodwill gerado internamente deve ser reconhecido.", "Valor residual é sempre elevado.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso."], "correta": 1, "comentario": "A regra correta é: Inclui preço de compra, tributos não recuperáveis e custos diretamente atribuíveis à preparação do ativo. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 8, "tema": "Gastos excluídos do custo", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre gastos excluídos do custo.", "alternativas": ["Vida útil indefinida deve ser amortizada em dez anos.", "Goodwill gerado internamente deve ser reconhecido.", "Propaganda, treinamento, custos administrativos, transferência e prejuízos operacionais iniciais são despesas.", "Valor residual é sempre elevado.", "Marca interna deve ser reconhecida pelo valor de mercado."], "correta": 2, "comentario": "A regra correta é: Propaganda, treinamento, custos administrativos, transferência e prejuízos operacionais iniciais são despesas. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 9, "tema": "Pagamento a prazo", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre pagamento a prazo.", "alternativas": ["Marca interna deve ser reconhecida pelo valor de mercado.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Website promocional é sempre ativo.", "Se exceder os prazos normais de crédito, o custo é o equivalente ao preço à vista; a diferença é juros, salvo capitalização permitida.", "Gasto reconhecido como despesa pode ser reintegrado depois."], "correta": 3, "comentario": "A regra correta é: Se exceder os prazos normais de crédito, o custo é o equivalente ao preço à vista; a diferença é juros, salvo capitalização permitida. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 10, "tema": "Combinação de negócios", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre combinação de negócios.", "alternativas": ["A amortização começa na data do pagamento.", "Valor residual é sempre elevado.", "Treinamento integra sempre o custo do ativo.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Ativo intangível adquirido em combinação de negócios é reconhecido separadamente do goodwill pelo valor justo na data de aquisição."], "correta": 4, "comentario": "A regra correta é: Ativo intangível adquirido em combinação de negócios é reconhecido separadamente do goodwill pelo valor justo na data de aquisição. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 11, "tema": "Subvenção governamental", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre subvenção governamental.", "alternativas": ["Pode ser reconhecido inicialmente ao valor justo ou ao valor nominal acrescido de custos diretamente atribuíveis.", "Treinamento integra sempre o custo do ativo.", "Gasto reconhecido como despesa pode ser reintegrado depois.", "Goodwill gerado internamente deve ser reconhecido.", "Todo gasto intangível deve ser ativado."], "correta": 0, "comentario": "A regra correta é: Pode ser reconhecido inicialmente ao valor justo ou ao valor nominal acrescido de custos diretamente atribuíveis. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 12, "tema": "Permuta", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre permuta.", "alternativas": ["Valor residual é sempre elevado.", "É mensurada ao valor justo, salvo ausência de natureza comercial ou impossibilidade de mensuração confiável.", "Goodwill gerado internamente deve ser reconhecido.", "Todo gasto intangível deve ser ativado.", "Vida útil indefinida deve ser amortizada em dez anos."], "correta": 1, "comentario": "A regra correta é: É mensurada ao valor justo, salvo ausência de natureza comercial ou impossibilidade de mensuração confiável. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 13, "tema": "Goodwill interno", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre goodwill interno.", "alternativas": ["Website promocional é sempre ativo.", "Goodwill gerado internamente deve ser reconhecido.", "O goodwill gerado internamente não deve ser reconhecido como ativo.", "Treinamento integra sempre o custo do ativo.", "Gasto reconhecido como despesa pode ser reintegrado depois."], "correta": 2, "comentario": "A regra correta é: O goodwill gerado internamente não deve ser reconhecido como ativo. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 14, "tema": "Pesquisa", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre pesquisa.", "alternativas": ["A amortização começa na data do pagamento.", "Goodwill gerado internamente deve ser reconhecido.", "Website promocional é sempre ativo.", "Gastos da fase de pesquisa são reconhecidos como despesa quando incorridos.", "Treinamento integra sempre o custo do ativo."], "correta": 3, "comentario": "A regra correta é: Gastos da fase de pesquisa são reconhecidos como despesa quando incorridos. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 15, "tema": "Desenvolvimento", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre desenvolvimento.", "alternativas": ["Vida útil indefinida deve ser amortizada em dez anos.", "Treinamento integra sempre o custo do ativo.", "Goodwill gerado internamente deve ser reconhecido.", "Website promocional é sempre ativo.", "Somente é ativado quando todos os seis critérios do item 57 forem demonstrados."], "correta": 4, "comentario": "A regra correta é: Somente é ativado quando todos os seis critérios do item 57 forem demonstrados. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 16, "tema": "Seis critérios do desenvolvimento", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre seis critérios do desenvolvimento.", "alternativas": ["Viabilidade técnica; intenção; capacidade de usar ou vender; benefícios futuros; recursos disponíveis; mensuração confiável dos gastos.", "Todo gasto intangível deve ser ativado.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Website promocional é sempre ativo.", "Treinamento integra sempre o custo do ativo."], "correta": 0, "comentario": "A regra correta é: Viabilidade técnica; intenção; capacidade de usar ou vender; benefícios futuros; recursos disponíveis; mensuração confiável dos gastos. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 17, "tema": "Indistinção entre fases", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre indistinção entre fases.", "alternativas": ["Goodwill gerado internamente deve ser reconhecido.", "Se não for possível separar pesquisa de desenvolvimento, todo o gasto é tratado como pesquisa e vai para despesa.", "Valor residual é sempre elevado.", "Gasto reconhecido como despesa pode ser reintegrado depois.", "Marca interna deve ser reconhecida pelo valor de mercado."], "correta": 1, "comentario": "A regra correta é: Se não for possível separar pesquisa de desenvolvimento, todo o gasto é tratado como pesquisa e vai para despesa. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 18, "tema": "Marcas internas", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre marcas internas.", "alternativas": ["Marca interna deve ser reconhecida pelo valor de mercado.", "Vida útil indefinida deve ser amortizada em dez anos.", "Marcas, títulos de publicações, listas de clientes e itens similares gerados internamente não são reconhecidos.", "Treinamento integra sempre o custo do ativo.", "Todo gasto intangível deve ser ativado."], "correta": 2, "comentario": "A regra correta é: Marcas, títulos de publicações, listas de clientes e itens similares gerados internamente não são reconhecidos. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 19, "tema": "Início da capitalização", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre início da capitalização.", "alternativas": ["A amortização começa na data do pagamento.", "Treinamento integra sempre o custo do ativo.", "Gasto reconhecido como despesa pode ser reintegrado depois.", "O custo gerado internamente inclui apenas gastos a partir da data em que os critérios de reconhecimento passam a ser atendidos.", "Vida útil indefinida deve ser amortizada em dez anos."], "correta": 3, "comentario": "A regra correta é: O custo gerado internamente inclui apenas gastos a partir da data em que os critérios de reconhecimento passam a ser atendidos. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 20, "tema": "Despesa anterior", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre despesa anterior.", "alternativas": ["Vida útil indefinida deve ser amortizada em dez anos.", "Marca interna deve ser reconhecida pelo valor de mercado.", "A amortização começa na data do pagamento.", "Valor residual é sempre elevado.", "Gasto anteriormente reconhecido como despesa não pode ser reintegrado ao ativo posteriormente."], "correta": 4, "comentario": "A regra correta é: Gasto anteriormente reconhecido como despesa não pode ser reintegrado ao ativo posteriormente. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 21, "tema": "Método de custo", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre método de custo.", "alternativas": ["Após o reconhecimento, apresenta-se custo menos amortização acumulada e perdas por desvalorização.", "Website promocional é sempre ativo.", "Marca interna deve ser reconhecida pelo valor de mercado.", "Treinamento integra sempre o custo do ativo.", "Vida útil indefinida deve ser amortizada em dez anos."], "correta": 0, "comentario": "A regra correta é: Após o reconhecimento, apresenta-se custo menos amortização acumulada e perdas por desvalorização. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 22, "tema": "Reavaliação", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre reavaliação.", "alternativas": ["Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Somente se permitida legalmente e existir mercado ativo; no Brasil, a reavaliação é legalmente restringida.", "Todo gasto intangível deve ser ativado.", "Treinamento integra sempre o custo do ativo.", "Vida útil indefinida deve ser amortizada em dez anos."], "correta": 1, "comentario": "A regra correta é: Somente se permitida legalmente e existir mercado ativo; no Brasil, a reavaliação é legalmente restringida. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 23, "tema": "Vida útil definida", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre vida útil definida.", "alternativas": ["Website promocional é sempre ativo.", "Treinamento integra sempre o custo do ativo.", "É amortizada sistematicamente ao longo da vida útil e submetida ao teste de recuperabilidade quando houver indicação.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Vida útil indefinida deve ser amortizada em dez anos."], "correta": 2, "comentario": "A regra correta é: É amortizada sistematicamente ao longo da vida útil e submetida ao teste de recuperabilidade quando houver indicação. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 24, "tema": "Vida útil indefinida", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre vida útil indefinida.", "alternativas": ["Vida útil indefinida deve ser amortizada em dez anos.", "Goodwill gerado internamente deve ser reconhecido.", "Gasto reconhecido como despesa pode ser reintegrado depois.", "Não é amortizada; deve ser testada anualmente por impairment e sempre que houver indicação.", "Todo gasto intangível deve ser ativado."], "correta": 3, "comentario": "A regra correta é: Não é amortizada; deve ser testada anualmente por impairment e sempre que houver indicação. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 25, "tema": "Início da amortização", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre início da amortização.", "alternativas": ["Todo gasto intangível deve ser ativado.", "Marca interna deve ser reconhecida pelo valor de mercado.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Vida útil indefinida deve ser amortizada em dez anos.", "A amortização começa quando o ativo está disponível para uso."], "correta": 4, "comentario": "A regra correta é: A amortizaç
