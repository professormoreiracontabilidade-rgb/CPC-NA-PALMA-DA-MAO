<script>
const key='cpc16-check',state=JSON.parse(localStorage.getItem(key)||'{}');
document.querySelectorAll('[data-k]').forEach(c=>{c.checked=!!state[c.dataset.k];c.onchange=()=>{state[c.dataset.k]=c.checked;localStorage.setItem(key,JSON.stringify(state))}});
