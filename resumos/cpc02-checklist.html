<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checklist de Revisão | Professor Moreira</title><link rel="stylesheet" href="../assets/cpc02.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>Checklist de Revisão</h1><p>CPC 02 (R2) — Efeitos das Mudanças nas Taxas de Câmbio e Conversão de Demonstrações Contábeis</p></div></header><nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc02-resumo.html">Resumo</a><a href="../mapas/cpc02-mapa.html">Mapa</a><a href="../casos/cpc02-casos.html">Casos</a><a href="../resumos/cpc02-flashcards.html">Flashcards</a><a href="../quizzes/cpc02-index.html">Quizzes</a><a href="../comentarios/cpc02-questoes.html">Questões</a><a href="../questoes/cpc02-banco.html">Banco</a></nav><main><section class="card"><h2>Checklist</h2><div id="ck"><label style="display:block;padding:8px"><input type="checkbox" data-i="0"> Objetivo e alcance</label><label style="display:block;padding:8px"><input type="checkbox" data-i="1"> Moeda funcional</label><label style="display:block;padding:8px"><input type="checkbox" data-i="2"> Moeda estrangeira e apresentação</label><label style="display:block;padding:8px"><input type="checkbox" data-i="3"> Itens monetários e não monetários</label><label style="display:block;padding:8px"><input type="checkbox" data-i="4"> Reconhecimento inicial</label><label style="display:block;padding:8px"><input type="checkbox" data-i="5"> Taxas no fechamento</label><label style="display:block;padding:8px"><input type="checkbox" data-i="6"> Variação cambial no resultado e em ORA</label><label style="display:block;padding:8px"><input type="checkbox" data-i="7"> Operação no exterior</label><label style="display:block;padding:8px"><input type="checkbox" data-i="8"> Conversão das demonstrações</label><label style="display:block;padding:8px"><input type="checkbox" data-i="9"> Baixa
