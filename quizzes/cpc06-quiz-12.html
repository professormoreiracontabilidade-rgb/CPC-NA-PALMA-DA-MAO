<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 12 | Professor Moreira</title><link rel="stylesheet" href="../assets/cpc06.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MAO - PROFESSOR MOREIRA</div><h1>Quiz 12</h1><p>CPC 06 (R2) - Arrendamentos</p></div></header><nav><a href="../index.html">Inicio</a><a href="../resumos/cpc06-resumo.html">Resumo</a><a href="../mapas/cpc06-mapa.html">Mapa</a><a href="../casos/cpc06-casos.html">Casos</a><a href="../resumos/cpc06-flashcards.html">Flashcards</a><a href="../quizzes/cpc06-index.html">Quizzes</a><a href="../comentarios/cpc06-questoes.html">Questoes</a><a href="../questoes/cpc06-banco.html">Banco</a></nav><main><section class="card"><p id="num"></p><h2 id="q"></h2><div id="opts" class="answers"></div><div id="exp" class="note hidden"></div><div class="toolbar"><button id="prev">Voltar</button><button id="next">Avancar</button></div></section></main><footer>Curso de Contabilidade Professor Moreira - WhatsApp 61 985323574</footer><script>const D=[{"id": 111, "tema": "Balanco", "nivel": "Dificil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre balanco.", "alternativas": ["Direitos de uso e passivos sao apresentados separadamente ou com indicacao clara das rubricas.", "Todo servico contem arrendamento.", "Principal e fluxo operacional.", "Direito de uso nao deprecia.", "Variavel por vendas sempre entra no passivo."], "correta": 0, "comentario": "A regra correta e: Direitos de uso e passivos sao apresentados separadamente ou com indicacao clara das rubricas. As demais alternativas contrariam o pronunciamento."}, {"id": 112, "tema": "DFC", "nivel": "Facil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre dfc.", "alternativas": ["O passivo e o valor nominal sem desconto.", "Principal e financiamento; juros seguem CPC 03; curto prazo, baixo valor e variaveis fora do passivo sao operacionais.", "Direito de uso nao deprecia.", "Curto prazo sempre tem opcao de compra.", "Todo arrendamento e apenas despesa."], "correta": 1, "comentario": "A regra correta e: Principal e financiamento; juros seguem CPC 03; curto prazo, baixo valor e variaveis fora do passivo sao operacionais. As demais alternativas contrariam o pronunciamento."}, {"id": 113, "tema": "Arrendador financeiro", "nivel": "Medio", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre arrendador financeiro.", "alternativas": ["O passivo e o valor nominal sem desconto.", "Curto prazo sempre tem opcao de compra.", "Transfere substancialmente riscos e beneficios e reconhece investimento liquido a receber.", "Todo servico contem arrendamento.", "Principal e fluxo operacional."], "correta": 2, "comentario": "A regra correta e: Transfere substancialmente riscos e beneficios e reconhece investimento liquido a receber. As demais alternativas contrariam o pronunciamento."}, {"id": 114, "tema": "Arrendador operacional", "nivel": "Dificil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre arrendador operacional.", "alternativas": ["O passivo e o valor nominal sem desconto.", "Todo servico contem arrendamento.", "Taxa incremental e proibida.", "Nao transfere substancialmente riscos e beneficios e mantem o ativo no balanco.", "Retroarrendamento sempre e venda."], "correta": 3, "comentario": "A regra correta e: Nao transfere substancialmente riscos e beneficios e mantem o ativo no balanco. As demais alternativas contrariam o pronunciamento."}, {"id": 115, "tema": "Investimento liquido", "nivel": "Facil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre investimento liquido.", "alternativas": ["Variavel por vendas sempre entra no passivo.", "Todo servico contem arrendamento.", "Curto prazo sempre tem opcao de compra.", "Taxa incremental e proibida.", "E o investimento bruto descontado pela taxa implicita."], "correta": 4, "comentario": "A regra correta e: E o investimento bruto descontado pela taxa implicita. As demais alternativas contrariam o pronunciamento."}, {"id": 116, "tema": "Receita financeira", "nivel": "Medio", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre receita financeira.", "alternativas": ["E reconhecida com taxa de retorno periodica constante sobre o investimento liquido.", "O arrendador nao classifica arrendamentos.", "Curto prazo sempre tem opcao de compra.", "Taxa incremental e proibida.", "O passivo e o valor nominal sem desconto."], "correta": 0, "comentario": "A regra correta e: E reconhecida com taxa de retorno periodica constante sobre o investimento liquido. As demais alternativas contrariam o pronunciamento."}, {"id": 117, "tema": "Venda e retroarrendamento", "nivel": "Dificil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre venda e retroarrendamento.", "alternativas": ["Curto prazo sempre tem opcao de compra.", "A transferencia e avaliada pelo CPC 47 para determinar se e uma venda.", "Retroarrendamento sempre e venda.", "Taxa incremental e proibida.", "Direito de uso nao deprecia."], "correta": 1, "comentario": "A regra correta e: A transferencia e avaliada pelo CPC 47 para determinar se e uma venda. As demais alternativas contrariam o pronunciamento."}, {"id": 118, "tema": "Transferencia e venda", "nivel": "Facil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre transferencia e venda.", "alternativas": ["O passivo e o valor nominal sem desconto.", "Curto prazo sempre tem opcao de compra.", "Reconhece-se ganho ou perda apenas sobre direitos transferidos e direito de uso proporcional.", "Retroarrendamento sempre e venda.", "Principal e fluxo operacional."], "correta": 2, "comentario": "A regra correta e: Reconhece-se ganho ou perda apenas sobre direitos transferidos e direito de uso proporcional. As demais alternativas contrariam o pronunciamento."}, {"id": 119, "tema": "
