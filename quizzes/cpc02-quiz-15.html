iamento."}, {"id": 142, "tema": "Conversão para moeda de apresentação", "nivel": "Fácil", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre conversão para moeda de apresentação.", "alternativas": ["Itens não monetários ao custo histórico são atualizados pela taxa de fechamento.", "Ativos e passivos usam taxa de fechamento; receitas e despesas usam taxas das datas das transações; diferenças vão para ORA.", "Todo item em moeda estrangeira é convertido sempre pela taxa de fechamento.", "Operações de hedge são disciplinadas exclusivamente pelo CPC 02.", "A baixa de investimento nunca afeta diferenças acumuladas de conversão."], "correta": 1, "comentario": "A alternativa correta decorre da regra do CPC 02: Ativos e passivos usam taxa de fechamento; receitas e despesas usam taxas das datas das transações; diferenças vão para ORA. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 143, "tema": "Taxa de receitas e despesas", "nivel": "Médio", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre taxa de receitas e despesas.", "alternativas": ["Goodwill adquirido no exterior é tratado como ativo da controladora e nunca da entidade no exterior.", "A moeda de apresentação deve obrigatoriamente ser igual à moeda funcional.", "Pode-se usar taxa média quando ela se aproxima das taxas efetivas e não há flutuação significativa.", "A moeda funcional pode ser escolhida livremente pela administração.", "A baixa de investimento nunca afeta diferenças acumuladas de conversão."], "correta": 2, "comentario": "A alternativa correta decorre da regra do CPC 02: Pode-se usar taxa média quando ela se aproxima das taxas efetivas e não há flutuação significativa. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 144, "tema": "Diferenças de conversão", "nivel": "Difícil", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre diferenças de conversão.", "alternativas": ["A moeda de apresentação deve obrigatoriamente ser igual à moeda funcional.", "Operações de hedge são disciplinadas exclusivamente pelo CPC 02.", "A moeda funcional pode ser escolhida livremente pela administração.", "Ficam em componente separado do patrimônio líquido até a baixa da entidade no exterior.", "Itens não monetários ao custo histórico são atualizados pela taxa de fechamento."], "correta": 3, "comentario": "A alternativa correta decorre da regra do CPC 02: Ficam em componente separado do patrimônio líquido até a baixa da entidade no exterior. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 145, "tema": "Goodwill de entidade no exterior", "nivel": "Fácil", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre goodwill de entidade no exterior.", "alternativas": ["Todo item em moeda estrangeira é convertido sempre pela taxa de fechamento.", "A moeda funcional pode ser escolhida livremente pela administração.", "Operações de hedge são disciplinadas exclusivamente pelo CPC 02.", "Goodwill adquirido no exterior é tratado como ativo da controladora e nunca da entidade no exterior.", "É tratado como ativo da entidade no exterior e convertido pela taxa de fechamento."], "correta": 4, "comentario": "A alternativa correta decorre da regra do CPC 02: É tratado como ativo da entidade no exterior e convertido pela taxa de fechamento. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 146, "tema": "Baixa de entidade no exterior", "nivel": "Médio", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre baixa de entidade no exterior.", "alternativas": ["O acumulado de diferenças de conversão relacionado é reclassificado do patrimônio líquido para o resultado quando aplicável.", "Todo item em moeda estrangeira é convertido sempre pela taxa de fechamento.", "A taxa média é sempre obrigatória, mesmo quando há forte oscilação cambial.", "Goodwill adquirido no exterior é tratado como ativo da controladora e nunca da entidade no exterior.", "A moeda de apresentação deve obrigatoriamente ser igual à moeda funcional."], "correta": 0, "comentario": "A alternativa correta decorre da regra do CPC 02: O acumulado de diferenças de conversão relacionado é reclassificado do patrimônio líquido para o resultado quando aplicável. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 147, "tema": "Baixa parcial", "nivel": "Difícil", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre baixa parcial.", "alternativas": ["Itens não monetários ao custo histórico são atualizados pela taxa de fechamento.", "A transferência ao resultado depende da natureza da participação e da proporção baixada.", "Toda variação cambial deve ser reconhecida exclusivamente no resultado.", "Goodwill adquirido no exterior é tratado como ativo da controladora e nunca da entidade no exterior.", "A taxa média é sempre obrigatória, mesmo quando há forte oscilação cambial."], "correta": 1, "comentario": "A alternativa correta decorre da regra do CPC 02: A transferência ao resultado depende da natureza da participação e da proporção baixada. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 148, "tema": "Hedge", "nivel": "Fácil", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre hedge.", "alternativas": ["A mudança da moeda funcional deve ser aplicada retrospectivamente.", "A moeda funcional pode ser escolhida livremente pela administração.", "A contabilização de hedge de itens em moeda estrangeira está no CPC 48, não no CPC 02.", "A taxa média é sempre obrigatória, mesmo quando há forte oscilação cambial.", "Operações de hedge são disciplinadas exclusivamente pelo CPC 02."], "correta": 2, "comentario": "A alternativa correta decorre da regra do CPC 02: A contabilização de hedge de itens em moeda estrangeira está no CPC 48, não no CPC 02. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 149, "tema": "Demonstração dos fluxos de caixa", "nivel": "Médio", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre demonstração dos fluxos de caixa.", "alternativas": ["A moeda de apresentação deve obrigatoriamente ser igual à moeda funcional.", "A baixa de investimento nunca afeta diferenças acumuladas de conversão.", "Todo item em moeda estrangeira é convertido sempre pela taxa de fechamento.", "O CPC 02 não disciplina a apresentação dos fluxos de caixa em moeda estrangeira; aplica-se o CPC 03.", "Itens não monetários ao custo histórico são atualizados pela taxa de fechamento."], "correta": 3, "comentario": "A alternativa correta decorre da regra do CPC 02: O CPC 02 não disciplina a apresentação dos fluxos de caixa em moeda estrangeira; aplica-se o CPC 03. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 150, "tema": "Economia hiperinflacionária", "nivel": "Difícil", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre economia hiperinflacionária.", "alternativas": ["A mudança da moeda funcional deve ser aplicada retrospectivamente.", "Operações de hedge são disciplinadas exclusivamente pelo CPC 02.", "A moeda de apresentação deve obrigatoriamente ser igual à moeda funcional.", "Toda variação cambial deve ser reconhecida exclusivamente no resultado.", "Antes da conversão, as demonstrações devem ser reelaboradas conforme o CPC 42."], "correta": 4, "comentario": "A alternativa correta decorre da regra do CPC 02: Antes da conversão, as demonstrações devem ser reelaboradas conforme o CPC 42. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}];let i=0,score=0,done={};function r(){let x=QUESTIONS[i];num.textContent=`Questão ${i+1} de ${QUESTIONS.length}`;q.textContent=x.enunciado;opts.innerHTML=x.alternativas.map((a,j)=>`<button onclick="ans(${j})">${String.fromCharCode(65+j)}) ${a}</button>`).join("");exp.classList.add("hidden");}function ans(j){let x=QUESTIONS[i];if(done[i]===undefined){done[i]=j;if(j===x.correta)score++;}exp.textContent=(j===x.correta?"✓ Correto. ":"✗ Incorreto. ")+x.comentario;exp.classList.remove("hidden");}prev.onclick=()=>{i=Math.max(0,i-1);r()};next.onclick=()=>{if(i<QUESTIONS.length-1){i++;r()}else{q.textContent=`Resultado: ${score} de ${QUESTIONS.length}`;opts.innerHTML="";exp.textContent="Revise os comentários e reinicie para tentar novamente.";exp.classList.remove("hidden");}};r();</script></main><footer>Curso de Contabilidade Professor Moreira • WhatsApp 61 985323574</footer></body></html>
