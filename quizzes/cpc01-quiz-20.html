<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 20 | Professor Moreira</title><link rel="stylesheet" href="../assets/cpc01.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>Quiz 20</h1><p>CPC 01 (R1) — Questões comentadas</p></div></header><nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc01-resumo.html">Resumo</a><a href="../mapas/cpc01-mapa.html">Mapa</a><a href="../casos/cpc01-casos.html">Casos</a><a href="../resumos/cpc01-flashcards.html">Flashcards</a><a href="../quizzes/cpc01-index.html">Quizzes</a><a href="../comentarios/cpc01-questoes.html">Questões</a><a href="../questoes/cpc01-banco.html">Banco</a></nav><main><section class="card" id="quiz"><p id="num"></p><h2 id="q"></h2><div id="opts"></div><div id="exp" class="tip hidden"></div><div class="toolbar"><button id="prev">← Voltar</button><button id="next">Avançar →</button></div></section></main><footer>Curso de Contabilidade Professor Moreira • WhatsApp 61 985323574</footer><script>const QUESTIONS=[{"id": 191, "tema": "Reversão no resultado", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre reversão no resultado.", "alternativas": ["Para ativo não reavaliado, a reversão é reconhecida imediatamente no resultado.", "O teste anual só ocorre quando há indício externo.", "O valor recuperável é sempre o menor entre valor em uso e valor justo.", "O valor contábil revisado não afeta a depreciação futura.", "A taxa de desconto do valor em uso deve ser após os impostos."], "correta": 0, "comentario": "A alternativa correta decorre da seguinte regra: Para ativo não reavaliado, a reversão é reconhecida imediatamente no resultado. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 192, "tema": "Divulgação", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre divulgação.", "alternativas": ["Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "O valor recuperável é sempre o menor entre valor em uso e valor justo.", "O teste anual só ocorre quando há indício externo.", "Devem ser divulgados valores de perdas e reversões, eventos, natureza do ativo, UGC, base do valor recuperável e premissas relevantes.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos."], "correta": 3, "comentario": "A alternativa correta decorre da seguinte regra: Devem ser divulgados valores de perdas e reversões, eventos, natureza do ativo, UGC, base do valor recuperável e premissas relevantes. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 193, "tema": "Ativo corporativo", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre ativo corporativo.", "alternativas": ["O valor recuperável é sempre o menor entre valor em uso e valor justo.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "Ativo corporativo contribui para várias UGCs e deve ser alocado em base razoável e consistente quando possível.", "A taxa de desconto do valor em uso deve ser após os impostos.", "O teste anual só ocorre quando há indício externo."], "correta": 2, "comentario": "A alternativa correta decorre da seguinte regra: Ativo corporativo contribui para várias UGCs e deve ser alocado em base razoável e consistente quando possível. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 194, "tema": "Consistência da UGC", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre consistência da ugc.", "alternativas": ["O teste anual só ocorre quando há indício externo.", "UGCs devem ser identificadas consistentemente entre períodos, salvo justificativa para mudança.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "O valor contábil revisado não afeta a depreciação futura."], "correta": 1, "comentario": "A alternativa correta decorre da seguinte regra: UGCs devem ser identificadas consistentemente entre períodos, salvo justificativa para mudança. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 195, "tema": "Mercado ativo interno", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre mercado ativo interno.", "alternativas": ["Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "O valor recuperável é sempre o menor entre valor em uso e valor justo.", "A taxa de desconto do valor em uso deve ser após os impostos.", "Mesmo produção usada internamente pode formar UGC separada se houver mercado ativo para o produto."], "correta": 4, "comentario": "A alternativa correta decorre da seguinte regra: Mesmo produção usada internamente pode formar UGC separada se houver mercado ativo para o produto. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 196, "tema": "Passivos na UGC", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre passivos na ugc.", "alternativas": ["O valor contábil revisado não afeta a depreciação futura.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "O teste anual só ocorre quando há indício externo.", "A taxa de desconto do valor em uso deve ser após os impostos.", "Passivo reconhecido só é incluído se o valor recuperável não puder ser determinado sem considerá-lo."], "correta": 4, "comentario": "A alternativa correta decorre da seguinte regra: Passivo reconhecido só é incluído se o valor recuperável não puder ser determinado sem considerá-lo. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 197, "tema": "Teste em momentos diferentes", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre teste em momentos diferentes.", "alternativas": ["A perda da UGC reduz primeiro os ativos circulantes.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "UGCs com goodwill podem ser testadas em épocas distintas, desde que anualmente e de forma consistente."], "correta": 4, "comentario": "A alternativa correta decorre da seguinte regra: UGCs com goodwill podem ser testadas em épocas distintas, desde que anualmente e de forma consistente. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 198, "tema": "Aquisição no período", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre aquisição no período.", "alternativas": ["A UGC é sempre definida como a entidade inteira.", "O teste anual só ocorre quando há indício externo.", "O valor recuperável é sempre o menor entre valor em uso e valor justo.", "Goodwill adquirido no período deve ser testado antes do encerramento desse período.", "O valor contábil revisado não afeta a depreciação futura."], "correta": 3, "comentario": "A alternativa correta decorre da seguinte regra: Goodwill adquirido no período deve ser testado antes do encerramento desse período. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 199, "tema": "Sequência de testes", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre sequência de testes.", "alternativas": ["A perda de goodwill deve ser revertida quando o mercado melhorar.", "O teste anual só ocorre quando há indício externo.", "A perda da UGC reduz primeiro os ativos circulantes.", "Quando ativos da UGC também exigem teste individual, eles são testados antes da UGC com goodwill.", "A taxa de desconto do valor em uso deve ser após os impostos."], "correta": 3, "comentario": "A alternativa correta decorre da seguinte regra: Quando ativos da UGC também exigem teste individual, eles são testados antes da UGC com goodwill. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 200, "tema": "Materialidade", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre materialidade.", "alternativas": ["Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "O teste anual só ocorre quando há indício externo.", "A perda da UGC reduz primeiro os ativos circulantes.", "A materialidade pode dispensar nova estimativa quando cálculos anteriores mostram ampla folga e não houve mudança relevante.", "A perda de goodwill deve ser revertida quando o mercado melhorar."], "correta": 3, "comentario": "A alternativa correta decorre da seguinte regra: A materialidade pode dispensar nova estimativa quando cálculos anteriores mostram ampla folga e não houve mudança relevante. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}]</script><script>const $=s=>document.querySelector(s);let i=0,score=0,answered=false;function draw(){const q=QUESTIONS[i];$('#num').textContent='Questão '+(i+1)+' de '+QUESTIONS.length;$('#q').textContent=q.enunciado;$('#opts').innerHTML=q.alternativas.map((a,j)=>`<button class="option" data-j="${j}">${String.fromCharCode(65+j)}) ${a}</button>`).join('');$('#exp').classList.add('hidden');answered=false;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(+b.dataset.j))}function answer(j){if(answered)return;answered=true;const q=QUESTIONS[i];if(j===q.correta)score++;document.querySelectorAll('.option').forEach((b,n)=>{if(n===q.correta)b.classList.add('correct');else if(n===j)b.classList.add('wrong')});$('#exp').textContent=q.comentario;$('#exp').classList.remove('hidden')}$('#next').onclick=()=>{if(i<QUESTIONS.length-1){i++;draw()}else{$('#quiz').innerHTML=`<section class="card"><h2>Resultado</h2><p>Você acertou ${score} de ${QUESTIONS.length} questões.</p><button onclick="location.reload()">Reiniciar</button></section>`}};$('#prev').onclick=()=>{if(i>0){i--;draw()}};draw();</script></body></html>
