ados.", "A depreciação começa apenas quando há produção.", "Item tangível mantido para produção, fornecimento, aluguel ou administração e esperado para uso por mais de um período.", "Impairment não se aplica ao imobilizado.", "Todo gasto com imobilizado deve ser capitalizado."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 27: Item tangível mantido para produção, fornecimento, aluguel ou administração e esperado para uso por mais de um período. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 79, "tema": "Reconhecimento", "nivel": "Fácil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre reconhecimento.", "alternativas": ["Impairment não se aplica ao imobilizado.", "Manutenção periódica aumenta o ativo.", "Ganho na baixa é receita de venda.", "O custo é reconhecido quando benefícios futuros são prováveis e o custo pode ser mensurado confiavelmente.", "Vida útil nunca é revisada."], "correta": 3, "comentario": "A alternativa correta decorre do CPC 27: O custo é reconhecido quando benefícios futuros são prováveis e o custo pode ser mensurado confiavelmente. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 80, "tema": "Sobressalentes", "nivel": "Médio", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre sobressalentes.", "alternativas": ["Todo gasto com imobilizado deve ser capitalizado.", "O método baseado em receita é recomendado.", "Treinamento sempre integra o custo.", "Terrenos sempre são depreciados.", "São imobilizado quando usados por mais de um período ou apenas em conexão com item do imobilizado."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 27: São imobilizado quando usados por mais de um período ou apenas em conexão com item do imobilizado. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}];let i=0,s=0,a=false;function r(){let x=D[i];num.tex
