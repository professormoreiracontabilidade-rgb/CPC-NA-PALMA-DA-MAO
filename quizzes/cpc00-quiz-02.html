<body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>Quiz 02 — CPC 00</h1>
<p>CPC 00 (R2) — Estrutura Conceitual para Relatório Financeiro</p></div></header>
<nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc00-resumo.html">Resumo</a><a href="../mapas/cpc00-mapa.html">Mapa</a><a href="../casos/cpc00-casos.html">Casos</a><a href="../quizzes/cpc00-index.html">Quizzes</a><a href="../comentarios/cpc00-questoes.html">Questões</a><a href="../ia/cpc00-ia.html">Pergunte</a></nav>
<main><section class="card"><div class="progress"><span id="bar"></span></div><p id="status"></p></section>
<section class="card" id="box"></section><div class="center"><button class="btn" id="back">← Voltar</button><button class="btn btn-primary" id="next">Avançar →</button><button class="btn" id="restart">Reiniciar</button></div></main><footer>Curso de Contabilidade Professor Moreira</footer><script>const qs=[{"n": 11, "q": "Dividendos são despesas.", "options": ["Certo", "Errado"], "answer": 1, "explanation": "Distribuições aos proprietários são excluídas da definição de despesa."}, {"n": 12, "q": "Patrimônio líquido é participação residual.", "options": ["Certo", "Errado"], "answer": 0, "explanation": "É o saldo dos ativos após a dedução de todos os passivos."}, {"n": 13, "q": "Reconhecimento depende de relevância e representação fidedigna.", "options": ["Certo", "Errado"], "answer": 0, "explanation": "A inclusão deve produzir informação útil."}, {"n": 14, "q": "Incerteza de mensuração sempre impede reconhecimento.", "options": ["Certo", "Errado"], "answer": 1, "explanation": "Pode afetar a decisão, mas estimativas podem fornecer informação útil."}, {"n": 15, "q": "Valor justo usa premissas de participantes do mercado.", "options": ["Certo", "Errado"], "answer": 0, "explanation": "É uma base de valor atual com perspectiva de mercado."}, {"n": 16, "q": "Valor em uso adota perspectiva específica da entidade.", "options": ["Certo", "Errado"], "answer": 0, "explanation": "Reflete fluxos esperados do uso e alienação final do ativo."}, {"n": 17, "q": "Valor de cumprimento aplica-se a passivos.", "options": ["Certo", "Errado"], "answer": 0, "explanation": "Reflete recursos que a entidade espera transferir para cumprir a obrigação."}, {"n": 18, "q": "Custo corrente é base de valor atual.", "options": ["Certo", "Errado"], "answer": 0, "explanation": "Reflete o custo corrente de item equivalente."}, {"n": 19, "q": "Comparabilidade significa uniformidade absoluta.", "options": ["Certo", "Errado"], "answer": 1, "explanation": "Itens semelhantes devem parecer semelhantes e diferentes devem parecer diferentes."}, {"n": 20, "q": "Tempestividade é disponibilizar informação a tempo de influenciar decisões.", "options": ["Certo", "Errado"], "answer": 0, "explanation": "Informação muito atrasada pode perder utilidade."}];let i=0,score=0,answered=false;
const box=document.querySelector('#box');function render(){answered=false;let q=qs[i];document.querySelector('#status').textContent=`Questão ${i+1} de ${qs.length} • Acertos: ${score}`;document.querySelector('#bar').style.width=((i+1)/qs.length*100)+'%';box.innerHTML=`<h2>Questão ${q.n}</h2><p class="question">${q.q}</p>${q.options.map((o,k)=>`<button class="option" data-k="${k}">${o}</button>`).join('')}<div class="feedback"></div>`;}
box.onclick=e=>{const b=e.target.closest('[data-k]');if(!b||answered)return;answered=true;const q=qs[i],k=+b.dataset.k;if(k===q.answer){score++;b.classList.add('correct')}else{b.classList.add('wrong');box.querySelector(`[data-k="${q.answer}"]`).classList.add('correct')}const f=box.querySelector('.feedback');f.style.display='block';f.innerHTML=`<b>Gabarito: ${q.options[q.answer]}</b><br>${q.explanation}`;}
document.querySelector('#next').onclick=()=>{if(i<qs.length-1){i++;render()}else{box.innerHTML=`<h2>Resultado</h2><p class="question">Você acertou ${score} de ${qs.length} questões.</p>`}};document.querySelector('#back').onclick=()=>{if(i>0){i--;render()}};document.querySelector('#restart').onclick=()=>{i=0;score=0;render()};render();</script></body></html>
