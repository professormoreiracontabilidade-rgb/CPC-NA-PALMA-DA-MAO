<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 09 | Professor Moreira</title><link rel="stylesheet" href="../assets/cpc04.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>Quiz 09</h1><p>CPC 04 (R1) — Ativo Intangível</p></div></header><nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc04-resumo.html">Resumo</a><a href="../mapas/cpc04-mapa.html">Mapa</a><a href="../casos/cpc04-casos.html">Casos</a><a href="../resumos/cpc04-flashcards.html">Flashcards</a><a href="../quizzes/cpc04-index.html">Quizzes</a><a href="../comentarios/cpc04-questoes.html">Questões</a><a href="../questoes/cpc04-banco.html">Banco</a></nav><main><section class="card"><p id="num"></p><h2 id="q"></h2><div id="opts" class="answers"></div><div id="exp" class="note hidden"></div><div class="toolbar"><button id="prev">← Voltar</button><button id="next">Avançar →</button></div></section></main><footer>Curso de Contabilidade Professor Moreira • WhatsApp 61 985323574</footer><script>const D=[{"id": 81, "tema": "Método de custo", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre método de custo.", "alternativas": ["Após o reconhecimento, apresenta-se custo menos amortização acumulada e perdas por desvalorização.", "Website promocional é sempre ativo.", "Goodwill gerado internamente deve ser reconhecido.", "Gasto reconhecido como despesa pode ser reintegrado depois.", "Valor residual é sempre elevado."], "correta": 0, "comentario": "A regra correta é: Após o reconhecimento, apresenta-se custo menos amortização acumulada e perdas por desvalorização. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 82, "tema": "Reavaliação", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre reavaliação.", "alternativas": ["Website promocional é sempre ativo.", "Somente se permitida legalmente e existir mercado ativo; no Brasil, a reavaliação é legalmente restringida.", "Gasto reconhecido como despesa pode ser reintegrado depois.", "A amortização começa na data do pagamento.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso."], "correta": 1, "comentario": "A regra correta é: Somente se permitida legalmente e existir mercado ativo; no Brasil, a reavaliação é legalmente restringida. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 83, "tema": "Vida útil definida", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre vida útil definida.", "alternativas": ["Goodwill gerado internamente deve ser reconhecido.", "Marca interna deve ser reconhecida pelo valor de mercado.", "É amortizada sistematicamente ao longo da vida útil e submetida ao teste de recuperabilidade quando houver indicação.", "Valor residual é sempre elevado.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso."], "correta": 2, "comentario": "A regra correta é: É amortizada sistematicamente ao longo da vida útil e submetida ao teste de recuperabilidade quando houver indicação. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 84, "tema": "Vida útil indefinida", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre vida útil indefinida.", "alternativas": ["A amortização começa na data do pagamento.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Vida útil indefinida deve ser amortizada em dez anos.", "Não é amortizada; deve ser testada anualmente por impairment e sempre que houver indicação.", "Marca interna deve ser reconhecida pelo valor de mercado."], "correta": 3, "comentario": "A regra correta é: Não é amortizada; deve ser testada anualmente por impairment e sempre que houver indicação. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 85, "tema": "Início da amortização", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre início da amortização.", "alternativas": ["Website promocional é sempre ativo.", "Vida útil indefinida deve ser amortizada em dez anos.", "Goodwill gerado internamente deve ser reconhecido.", "Valor residual é sempre elevado.", "A amortização começa quando o ativo está disponível para uso."], "correta": 4, "comentario": "A regra correta é: A amortização começa quando o ativo está disponível para uso. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 86, "tema": "Método de amortização", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre método de amortização.", "alternativas": ["Deve refletir o padrão de consumo dos benefícios; se não puder ser determinado, usa-se o método linear.", "Treinamento integra sempre o custo do ativo.", "Marca interna deve ser reconhecida pelo valor de mercado.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Todo gasto intangível deve ser ativado."], "correta": 0, "comentario": "A regra correta é: Deve refletir o padrão de consumo dos benefícios; se não puder ser determinado, usa-se o método linear. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 87, "tema": "Valor residual", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre valor residual.", "alternativas": ["A amortização começa na data do pagamento.", "Em regra é zero, salvo compromisso de compra por terceiro ou existência de mercado ativo.", "Vida útil indefinida deve ser amortizada em dez anos.", "Marca interna deve ser reconhecida pelo valor de mercado.", "Gasto reconhecido como despesa pode ser reintegrado depois."], "correta": 1, "comentario": "A regra correta é: Em regra é zero, salvo compromisso de compra por terceiro ou existência de mercado ativo. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 88, "tema": "Revisão de estimativas", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre revisão de estimativas.", "alternativas": ["Marca interna deve ser reconhecida pelo valor de mercado.", "Website promocional é sempre ativo.", "Vida útil, valor residual e método de amortização são revisados ao menos ao final de cada exercício.", "Vida útil indefinida deve ser amortizada em dez anos.", "Gasto reconhecido como despesa pode ser reintegrado depois."], "correta": 2, "comentario": "A regra correta é: Vida útil, valor residual e método de amortização são revisados ao menos ao final de cada exercício. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 89, "tema": "Baixa", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre baixa.", "alternativas": ["Todo gasto intangível deve ser ativado.", "Website promocional é sempre ativo.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "O ativo é baixado na alienação ou quando não se esperam benefícios econômicos futuros de uso ou alienação.", "A amortização começa na data do pagamento."], "correta": 3, "comentario": "A regra correta é: O ativo é baixado na alienação ou quando não se esperam benefícios econômicos futuros de uso ou alienação. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 90, "tema": "Website", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre website.", "alternativas": ["Marca interna deve ser reconhecida pelo valor de mercado.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Vida útil indefinida deve ser amortizada em dez anos.", "Valor residual é sempre elevado.", "Gastos de desenvolvimento de website podem ser ativados se os critérios forem atendidos; website meramente promocional é despesa."], "correta": 4, "comentario": "A regra correta é: Gastos de desenvolvimento de website podem ser ativados se os critérios forem atendidos; website meramente promocional é despesa. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}];let i=0,s=0,a=false;function r(){let x=D[i];num.textContent=`Questão ${i+1} de ${D.length}`;q.textContent=x.enunciado;opts.innerHTML=x.alternativas.map((t,j)=>`<button onclick="ans(${j})">${String.fromCharCode(65+j)}) ${t}</button>`).join('');exp.classList.add('hidden')}function ans(j){if(a)return;a=true;let x=D[i];if(j===x.correta)s++;exp.textContent=(j===x.correta?'✓ Correto. ':'✗ Incorreto. ')+x.comentario;exp.classList.remove('hidden')}next.onclick=()=>{if(i<D.length-1){i++;a=false;r()}else document.querySelector('main').innerHTML=`<section class="card"><h2>Resultado</h2><p>${s} acertos de ${D.length}.</p><button onclick="location.reload()">Reiniciar</button></section>`};prev.onclick=()=>{if(i>0){i--;a=false;r()}};r()</script></body></html>
