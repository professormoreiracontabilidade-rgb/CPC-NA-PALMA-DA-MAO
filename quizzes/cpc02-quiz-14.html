ção, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 132, "tema": "Itens monetários no fechamento", "nivel": "Difícil", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre itens monetários no fechamento.", "alternativas": ["A moeda de apresentação deve obrigatoriamente ser igual à moeda funcional.", "Devem ser convertidos pela taxa de câmbio de fechamento.", "Operações de hedge são disciplinadas exclusivamente pelo CPC 02.", "A mudança da moeda funcional deve ser aplicada retrospectivamente.", "Todo item em moeda estrangeira é convertido sempre pela taxa de fechamento."], "correta": 1, "comentario": "A alternativa correta decorre da regra do CPC 02: Devem ser convertidos pela taxa de câmbio de fechamento. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 133, "tema": "Itens não monetários ao custo histórico", "nivel": "Fácil", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre itens não monetários ao custo histórico.", "alternativas": ["A moeda de apresentação deve obrigatoriamente ser igual à moeda funcional.", "A mudança da moeda funcional deve ser aplicada retrospectivamente.", "Devem ser convertidos pela taxa da data da transação.", "A taxa média é sempre obrigatória, mesmo quando há forte oscilação cambial.", "Todo item em moeda estrangeira é convertido sempre pela taxa de fechamento."], "correta": 2, "comentario": "A alternativa correta decorre da regra do CPC 02: Devem ser convertidos pela taxa da data da transação. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 134, "tema": "Itens não monetários ao valor justo", "nivel": "Médio", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre itens não monetários ao valor justo.", "alternativas": ["A mudança da moeda funcional deve ser aplicada r muladas de conversão.", "A mudança da moeda funcional deve ser aplicada retrospectivamente.", "A taxa média é sempre obrigatória, mesmo quando há forte oscilação cambial."], "correta": 0, "comentario": "A alternativa correta decorre da regra do CPC 02: Quando o ganho ou perda do item não monetário é reconhecido em outros resultados abrangentes, a variação cambial correspondente também segue para ORA. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 137, "tema": "Moeda funcional - indicadores primários", "nivel": "Médio", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre moeda funcional - indicadores primários.", "alternativas": ["Goodwill adquirido no exterior é tratado como ativo da controladora e nunca da entidade no exterior.", "Devem ser priorizadas a moeda que influencia preços de venda e a moeda que influencia custos de mão de obra, materiais e outros insumos.", "Todo item em moeda estrangeira é convertido sempre pela taxa de fechamento.", "Itens não monetários ao custo histórico são atualizados pela taxa de fechamento.", "A moeda de apresentação deve obrigatoriamente ser igual à moeda funcional."], "correta": 1, "comentario": "A alternativa correta decorre da regra do CPC 02: Devem ser priorizadas a moeda que influencia preços de venda e a moeda que influencia custos de mão de obra, materiais e outros insumos. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 138, "tema": "Moeda funcional - indicadores adicionais", "nivel": "Difícil", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre moeda funcional - indicadores adicionais.", "alternativas": ["A mudança da moeda funcional deve ser aplicada retrospectivamente.", "Toda variação cambial deve ser reconhecida exclusivamente no resultado.", "Incluem a moeda dos financiamentos e aquela em que os recurs
