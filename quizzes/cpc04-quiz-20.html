<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 20 | Professor Moreira</title><link rel="stylesheet" href="../assets/cpc04.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>Quiz 20</h1><p>CPC 04 (R1) — Ativo Intangível</p></div></header><nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc04-resumo.html">Resumo</a><a href="../mapas/cpc04-mapa.html">Mapa</a><a href="../casos/cpc04-casos.html">Casos</a><a href="../resumos/cpc04-flashcards.html">Flashcards</a><a href="../quizzes/cpc04-index.html">Quizzes</a><a href="../comentarios/cpc04-questoes.html">Questões</a><a href="../questoes/cpc04-banco.html">Banco</a></nav><main><section class="card"><p id="num"></p><h2 id="q"></h2><div id="opts" class="answers"></div><div id="exp" class="note hidden"></div><div class="toolbar"><button id="prev">← Voltar</button><button id="next">Avançar →</button></div></section></main><footer>Curso de Contabilidade Professor Moreira • WhatsApp 61 985323574</footer><script>const D=[{"id": 191, "tema": "Subvenção governamental", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre subvenção governamental.", "alternativas": ["Pode ser reconhecido inicialmente ao valor justo ou ao valor nominal acrescido de custos diretamente atribuíveis.", "Website promocional é sempre ativo.", "Vida útil indefinida deve ser amortizada em dez anos.", "Valor residual é sempre elevado.", "Gasto reconhecido como despesa pode ser reintegrado depois."], "correta": 0, "comentario": "A regra correta é: Pode ser reconhecido inicialmente ao valor justo ou ao valor nominal acrescido de custos diretamente atribuíveis. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 192, "tema": "Permuta", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre permuta.", "alternativas": ["Website promocional é sempre ativo.", "É mensurada ao valor justo, salvo ausência de natureza comercial ou impossibilidade de mensuração confiável.", "Todo gasto intangível deve ser ativado.", "Goodwill gerado internamente deve ser reconhecido.", "Treinamento integra sempre o custo do ativo."], "correta": 1, "comentario": "A regra correta é: É mensurada ao valor justo, salvo ausência de natureza comercial ou impossibilidade de mensuração confiável. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 193, "tema": "Goodwill interno", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre goodwill interno.", "alternativas": ["Goodwill gerado internamente deve ser reconhecido.", "Treinamento integra sempre o custo do ativo.", "O goodwill gerado internamente não deve ser reconhecido como ativo.", "Gasto reconhecido como despesa pode ser reintegrado depois.", "A amortização começa na data do pagamento."], "correta": 2, "comentario": "A regra correta é: O goodwill gerado internamente não deve ser reconhecido como ativo. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 194, "tema": "Pesquisa", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre pesquisa.", "alternativas": ["Goodwill gerado internamente deve ser reconhecido.", "Valor residual é sempre elevado.", "Todo gasto intangível deve ser ativado.", "Gastos da fase de pesquisa são reconhecidos como despesa quando incorridos.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso."], "correta": 3, "comentario": "A regra correta é: Gastos da fase de pesquisa são reconhecidos como despesa quando incorridos. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 195, "tema": "Desenvolvimento", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre desenvolvimento.", "alternativas": ["Goodwill gerado internamente deve ser reconhecido.", "A amortização começa na data do pagamento.", "Todo gasto intangível deve ser ativado.", "Gasto reconhecido como despesa pode ser reintegrado depois.", "Somente é ativado quando todos os seis critérios do item 57 forem demonstrados."], "correta": 4, "comentario": "A regra correta é: Somente é ativado quando todos os seis critérios do item 57 forem demonstrados. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 196, "tema": "Seis critérios do desenvolvimento", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre seis critérios do desenvolvimento.", "alternativas": ["Viabilidade técnica; intenção; capacidade de usar ou vender; benefícios futuros; recursos disponíveis; mensuração confiável dos gastos.", "Marca interna deve ser reconhecida pelo valor de mercado.", "Valor residual é sempre elevado.", "Website promocional é sempre ativo.", "Todo gasto intangível deve ser ativado."], "correta": 0, "comentario": "A regra correta é: Viabilidade técnica; intenção; capacidade de usar ou vender; benefícios futuros; recursos disponíveis; mensuração confiável dos gastos. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 197, "tema": "Indistinção entre fases", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre indistinção entre fases.", "alternativas": ["Treinamento integra sempre o custo do ativo.", "Se não for possível separar pesquisa de desenvolvimento, todo o gasto é tratado como pesquisa e vai para despesa.", "A amortização começa na data do pagamento.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Valor residual é sempre elevado."], "correta": 1, "comentario": "A regra correta é: Se não for possível separar pesquisa de desenvolvimento, todo o gasto é tratado como pesquisa e vai para despesa. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 198, "tema": "Marcas internas", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre marcas internas.", "alternativas": ["A amortização começa na data do pagamento.", "Todo gasto intangível deve ser ativado.", "Marcas, títulos de publicações, listas de clientes e itens similares gerados internamente não são reconhecidos.", "Goodwill gerado internamente deve ser reconhecido.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso."], "correta": 2, "comentario": "A regra correta é: Marcas, títulos de publicações, listas de clientes e itens similares gerados internamente não são reconhecidos. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 199, "tema": "Início da capitalização", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre início da capitalização.", "alternativas": ["Treinamento integra sempre o custo do ativo.", "Vida útil indefinida deve ser amortizada em dez anos.", "Website promocional é sempre ativo.", "O custo gerado internamente inclui apenas gastos a partir da data em que os critérios de reconhecimento passam a ser atendidos.", "Marca interna deve ser reconhecida pelo valor de mercado."], "correta": 3, "comentario": "A regra correta é: O custo gerado internamente inclui apenas gastos a partir da data em que os critérios de reconhecimento passam a ser atendidos. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 200, "tema": "Despesa anterior", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre despesa anterior.", "alternativas": ["Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Website promocional é sempre ativo.", "Todo gasto intangível deve ser ativado.", "Gasto reconhecido como despesa pode ser reintegrado depois.", "Gasto anteriormente reconhecido como despesa não pode ser reintegrado ao ativo posteriormente."], "correta": 4, "comentario": "A regra correta é: Gasto anteriormente reconhecido como despesa não pode ser reintegrado ao ativo posteriormente. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}];let i=0,s=0,a=false;function r(){let x=D[i];num.textContent=`Questão ${i+1} de ${D.length}`;q.textContent=x.enunciado;opts.innerHTML=x.alternativas.map((t,j)=>`<button onclick="ans(${j})">${String.fromCharCode(65+j)}) ${t}</button>`).join('');exp.classList.add('hidden')}function ans(j){if(a)return;a=true;let x=D[i];if(j===x.correta)s++;exp.textContent=(j===x.correta?'✓ Correto. ':'✗ Incorreto. ')+x.comentario;exp.classList.remove('hidden')}next.onclick=()=>{if(i<D.length-1){i++;a=false;r()}else document.querySelector('main').innerHTML=`<section class="card"><h2>Resultado</h2><p>${s} acertos de ${D.length}.</p><button onclick="location.reload()">Reiniciar</button></section>`};prev.onclick=()=>{if(i>0){i--;a=false;r()}};r()</script></body></html>
