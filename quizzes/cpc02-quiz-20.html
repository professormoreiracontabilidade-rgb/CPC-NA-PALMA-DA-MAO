 de conversão.", "Devem ser divulgados natureza e efeitos, taxas utilizadas, processo de estimativa e riscos da moeda não conversível."], "correta": 4, "comentario": "A alternativa correta decorre da regra do CPC 02: Devem ser divulgados natureza e efeitos, taxas utilizadas, processo de estimativa e riscos da moeda não conversível. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}];let i=0,score=0,done={};function r(){let x=QUESTIONS[i];num.textContent=`Questão ${i+1} de ${QUESTIONS.length}`;q.textContent=x.enunciado;opts.innerHTML=x.alternativas.map((a,j)=>`<button onclick="ans(${j})">${String.fromCharCode(65+j)}) ${a}</button>`).join("");exp.classList.add("hidden");}function ans(j){let x=QUESTIONS[i];if(done[i]===undefined){done[i]=j;if(j===x.correta)score++;}exp.textContent=(j===x.correta?"✓ Correto. ":"✗ Incorreto. ")+x.comentario;exp.classList.remove("hidden");}prev.onclick=()=>{i=Math.max(0,i-1);r()};next.onclick=()=>{if(i<QUESTIONS.length-1){i++;r()}else{q.textContent=`Resultado: ${score} de ${QUESTIONS.length}`;opts.innerHTML="";exp.textContent="Revise os comentários e reinicie para tentar novamente.";exp.classList.remove("hidden");}};r();</script></main><footer>Curso de Contabilidade Professor Moreira • WhatsApp 61 985323574</footer></body></html>
