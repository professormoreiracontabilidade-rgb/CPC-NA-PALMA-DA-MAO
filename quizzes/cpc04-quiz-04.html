<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 04 | Professor Moreira</title><link rel="stylesheet" href="../assets/cpc04.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>Quiz 04</h1><p>CPC 04 (R1) — Ativo Intangível</p></div></header><nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc04-resumo.html">Resumo</a><a href="../mapas/cpc04-mapa.html">Mapa</a><a href="../casos/cpc04-casos.html">Casos</a><a href="../resumos/cpc04-flashcards.html">Flashcards</a><a href="../quizzes/cpc04-index.html">Quizzes</a><a href="../comentarios/cpc04-questoes.html">Questões</a><a href="../questoes/cpc04-banco.html">Banco</a></nav><main><section class="card"><p id="num"></p><h2 id="q"></h2><div id="opts" class="answers"></div><div id="exp" class="note hidden"></div><div class="toolbar"><button id="prev">← Voltar</button><button id="next">Avançar →</button></div></section></main><footer>Curso de Contabilidade Professor Moreira • WhatsApp 61 985323574</footer><script>const D=[{"id": 31, "tema": "Definição", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre definição.", "alternativas": ["Ativo intangível é um ativo não monetário identificável sem substância física.", "Website promocional é sempre ativo.", "Todo gasto intangível deve ser ativado.", "Marca interna deve ser reconhecida pelo valor de mercado.", "Valor residual é sempre elevado."], "correta": 0, "comentario": "A regra correta é: Ativo intangível é um ativo não monetário identificável sem substância física. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 32, "tema": "Identificação", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre identificação.", "alternativas": ["Gasto reconhecido como despesa pode ser reintegrado depois.", "O ativo é identificável quando é separável ou resulta de direitos contratuais ou outros direitos legais.", "Vida útil indefinida deve ser amortizada em dez anos.", "Marca interna deve ser reconhecida pelo valor de mercado.", "A amortização começa na data do pagamento."], "correta": 1, "comentario": "A regra correta é: O ativo é identificável quando é separável ou resulta de direitos contratuais ou outros direitos legais. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 33, "tema": "Controle", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre controle.", "alternativas": ["Marca interna deve ser reconhecida pelo valor de mercado.", "Goodwill gerado internamente deve ser reconhecido.", "A entidade deve controlar os benefícios econômicos futuros e restringir o acesso de terceiros.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Treinamento integra sempre o custo do ativo."], "correta": 2, "comentario": "A regra correta é: A entidade deve controlar os benefícios econômicos futuros e restringir o acesso de terceiros. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 34, "tema": "Benefícios futuros", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre benefícios futuros.", "alternativas": ["Treinamento integra sempre o custo do ativo.", "A amortização começa na data do pagamento.", "Website promocional é sempre ativo.", "Podem decorrer de receitas, redução de custos ou outros benefícios resultantes do uso do ativo.", "Todo gasto intangível deve ser ativado."], "correta": 3, "comentario": "A regra correta é: Podem decorrer de receitas, redução de custos ou outros benefícios resultantes do uso do ativo. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 35, "tema": "Reconhecimento", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre reconhecimento.", "alternativas": ["Todo gasto intangível deve ser ativado.", "Website promocional é sempre ativo.", "Valor residual é sempre elevado.", "Marca interna deve ser reconhecida pelo valor de mercado.", "Somente ocorre quando forem prováveis os benefícios econômicos futuros e o custo puder ser mensurado com confiabilidade."], "correta": 4, "comentario": "A regra correta é: Somente ocorre quando forem prováveis os benefícios econômicos futuros e o custo puder ser mensurado com confiabilidade. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 36, "tema": "Mensuração inicial", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre mensuração inicial.", "alternativas": ["O ativo intangível é reconhecido inicialmente ao custo.", "Vida útil indefinida deve ser amortizada em dez anos.", "Website promocional é sempre ativo.", "Todo gasto intangível deve ser ativado.", "Goodwill gerado internamente deve ser reconhecido."], "correta": 0, "comentario": "A regra correta é: O ativo intangível é reconhecido inicialmente ao custo. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 37, "tema": "Aquisição separada", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre aquisição separada.", "alternativas": ["Gasto reconhecido como despesa pode ser reintegrado depois.", "Inclui preço de compra, tributos não recuperáveis e custos diretamente atribuíveis à preparação do ativo.", "Treinamento integra sempre o custo do ativo.", "Marca interna deve ser reconhecida pelo valor de mercado.", "Todo gasto intangível deve ser ativado."], "correta": 1, "comentario": "A regra correta é: Inclui preço de compra, tributos não recuperáveis e custos diretamente atribuíveis à preparação do ativo. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 38, "tema": "Gastos excluídos do custo", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre gastos excluídos do custo.", "alternativas": ["Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Valor residual é sempre elevado.", "Propaganda, treinamento, custos administrativos, transferência e prejuízos operacionais iniciais são despesas.", "Goodwill gerado internamente deve ser reconhecido.", "A amortização começa na data do pagamento."], "correta": 2, "comentario": "A regra correta é: Propaganda, treinamento, custos administrativos, transferência e prejuízos operacionais iniciais são despesas. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 39, "tema": "Pagamento a prazo", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre pagamento a prazo.", "alternativas": ["A amortização começa na data do pagamento.", "Treinamento integra sempre o custo do ativo.", "Gasto reconhecido como despesa pode ser reintegrado depois.", "Se exceder os prazos normais de crédito, o custo é o equivalente ao preço à vista; a diferença é juros, salvo capitalização permitida.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso."], "correta": 3, "comentario": "A regra correta é: Se exceder os prazos normais de crédito, o custo é o equivalente ao preço à vista; a diferença é juros, salvo capitalização permitida. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 40, "tema": "Combinação de negócios", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre combinação de negócios.", "alternativas": ["Treinamento integra sempre o custo do ativo.", "Gasto reconhecido como despesa pode ser reintegrado depois.", "A amortização começa na data do pagamento.", "Website promocional é sempre ativo.", "Ativo intangível adquirido em combinação de negócios é reconhecido separadamente do goodwill pelo valor justo na data de aquisição."], "correta": 4, "comentario": "A regra correta é: Ativo intangível adquirido em combinação de negócios é reconhecido separadamente do goodwill pelo valor justo na data de aquisição. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}];let i=0,s=0,a=false;function r(){let x=D[i];num.textContent=`Questão ${i+1} de ${D.length}`;q.textContent=x.enunciado;opts.innerHTML=x.alternativas.map((t,j)=>`<button onclick="ans(${j})">${String.fromCharCode(65+j)}) ${t}</button>`).join('');exp.classList.add('hidden')}function ans(j){if(a)return;a=true;let x=D[i];if(j===x.correta)s++;exp.textContent=(j===x.correta?'✓ Correto. ':'✗ Incorreto. ')+x.comentario;exp.classList.remove('hidden')}next.onclick=()=>{if(i<D.length-1){i++;a=false;r()}else document.querySelector('main').innerHTML=`<section class="card"><h2>Resultado</h2><p>${s} acertos de ${D.length}.</p><button onclick="location.reload()">Reiniciar</button></section>`};prev.onclick=()=>{if(i>0){i--;a=false;r()}};r()</script></body></html>
