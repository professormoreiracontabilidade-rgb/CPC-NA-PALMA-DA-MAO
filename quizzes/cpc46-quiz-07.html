ermina o valor justo.", "Presume-se melhor uso, salvo evidência de uso alternativo que maximize valor.", "Nível 3 usa apenas preços cotados.", "Custos de transação reduzem sempre o valor justo.", "Grande quantidade permite desconto de bloco no Nível 1."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 46: Presume-se melhor uso, salvo evidência de uso alternativo que maximize valor. As demais opções confundem preço de saída, mercado, técnicas de avaliação ou hierarquia."}, {"id": 63, "tema": "Uso em combinação", "nivel": "Difícil", "enunciado": "De acordo com o CPC 46, assinale a alternativa correta sobre uso em combinação.", "alternativas": ["Melhor uso depende apenas da vontade da entidade.", "Mercado mais vantajoso prevalece sobre o mercado principal.", "Ativo não financeiro pode ter maior valor em conjunto com outros ativos e passivos.", "Valor justo é sempre preço de entrada.", "Custos de transação reduzem sempre o valor justo."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 46: Ativo não financeiro pode ter maior valor em conjunto com outros ativos e passivos. As demais opções confundem preço de saída, mercado, técnicas de avaliação ou hierarquia."}, {"id": 64, "tema": "Passivo transferido", "nivel": "Fácil", "enunciado": "De acordo com o CPC 46, assinale a alternativa correta sobre passivo transferido.", "alternativas": ["Mercado mais vantajoso prevalece sobre o mercado principal.", "A intenção da entidade determina o valor justo.", "Grande quantidade permite desconto de bloco no Nível 1.", "Presume-se que o passivo continue em aberto e seja assumido por participante do mercado.", "Passivo é mensurado como se fosse liquidado com o credor."], "correta": 3, "comentario": "A alternativa correta decorre do CPC 46: Presume-se que o passivo continue em aberto e seja assumido por participante do mercado. As demais opções confundem preço de saída, mercado, técnicas de avaliação ou hierarquia."}, {"id": 65, "tema": "Risco de desc
