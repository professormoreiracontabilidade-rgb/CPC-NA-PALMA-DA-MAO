sificação ou divulgação."}, {"id": 58, "tema": "Desvio extremamente raro", "nivel": "Fácil", "enunciado": "De acordo com o CPC 26 (R1), assinale a alternativa correta sobre desvio extremamente raro.", "alternativas": ["Política inadequada é corrigida apenas por nota.", "A DFC usa regime de competência.", "Pode ocorrer quando cumprir requisito geraria apresentação enganosa, observada a regulação.", "Notas não fazem parte do conjunto completo.", "Informação imaterial deve sempre ser separada."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 26: Pode ocorrer quando cumprir requisito geraria apresentação enganosa, observada a regulação. As demais opções contrariam os princípios de apresentação, classificação ou divulgação."}, {"id": 59, "tema": "Continuidade", "nivel": "Médio", "enunciado": "De acordo com o CPC 26 (R1), assinale a alternativa correta sobre continuidade.", "alternativas": ["Comparativos são dispensáveis.", "Impostos diferidos são sempre circulantes.", "Continuidade considera apenas três meses.", "Demonstrações usam continuidade, salvo intenção ou necessidade de liquidar ou encerrar.", "A DFC usa regime de competência."], "correta": 3, "comentario": "A alternativa correta decorre do CPC 26: Demonstrações usam continuidade, salvo intenção ou necessidade de liquidar ou encerrar. As demais opções contrariam os princípios de apresentação, classificação ou divulgação."}, {"id": 60, "tema": "Horizonte de continuidade", "nivel": "Difícil", "enunciado": "De acordo com o CPC 26 (R1), assinale a alternativa correta sobre horizonte de continuidade.", "alternativas": ["A DFC usa regime de competência.", "A declaração de conformidade pode ser parcial.", "Itens extraordinários são obrigatórios.", "Informação imaterial deve sempre ser separada.", "A avaliação considera, no mínimo, doze meses após a data do balanço."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 26: A avaliação considera, no mínimo, doze meses após a data do balanço. As demais opções contrariam os princípios de apresentação, classificação ou divulgação."}];let i=0,s=0,a=false;function r(){let x=D[i];num.textContent='Questão '+(i+1)+' de '+D.length;q.textContent=x.enunciado;opts.innerHTML=x.alternativas.map((t,j)=>'<button onclick="ans('+j+')">'+String.fromCharCode(65+j)+') '+t+'</button>').join('');exp.classList.add('hidden');}function ans(j){if(a)return;a=true;let x=D[i];if(j===x.correta)s++;exp.textContent=(j===x.correta?'✓ Correto. ':'✗ Incorreto. ')+x.comentario;exp.classList.remove('hidden');}next.onclick=()=>{if(i<D.length-1){i++;a=false;r()}else document.querySelector('main').innerHTML='<section class="card"><h2>Resultado</h2><p>'+s+' acertos de '+D.length+'.</p><button onclick="location.reload()">Reiniciar</button></section>'};prev.onclick=()=>{if(i>0){i--;a=false;r()}};r();</script></body></html>
