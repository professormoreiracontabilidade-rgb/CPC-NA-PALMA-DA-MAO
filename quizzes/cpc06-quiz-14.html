<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 14 | Professor Moreira</title><link rel="stylesheet" href="../assets/cpc06.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MAO - PROFESSOR MOREIRA</div><h1>Quiz 14</h1><p>CPC 06 (R2) - Arrendamentos</p></div></header><nav><a href="../index.html">Inicio</a><a href="../resumos/cpc06-resumo.html">Resumo</a><a href="../mapas/cpc06-mapa.html">Mapa</a><a href="../casos/cpc06-casos.html">Casos</a><a href="../resumos/cpc06-flashcards.html">Flashcards</a><a href="../quizzes/cpc06-index.html">Quizzes</a><a href="../comentarios/cpc06-questoes.html">Questoes</a><a href="../questoes/cpc06-banco.html">Banco</a></nav><main><section class="card"><p id="num"></p><h2 id="q"></h2><div id="opts" class="answers"></div><div id="exp" class="note hidden"></div><div class="toolbar"><button id="prev">Voltar</button><button id="next">Avancar</button></div></section></main><footer>Curso de Contabilidade Professor Moreira - WhatsApp 61 985323574</footer><script>const D=[{"id": 131, "tema": "Direito de uso", "nivel": "Medio", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre direito de uso.", "alternativas": ["O custo inclui passivo inicial, pagamentos antecipados liquidos de incentivos, custos diretos e restauracao.", "Variavel por vendas sempre entra no passivo.", "Direito de uso nao deprecia.", "Todo servico contem arrendamento.", "Curto prazo sempre tem opcao de compra."], "correta": 0, "comentario": "A regra correta e: O custo inclui passivo inicial, pagamentos antecipados liquidos de incentivos, custos diretos e restauracao. As demais alternativas contrariam o pronunciamento."}, {"id": 132, "tema": "Passivo inicial", "nivel": "Dificil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre passivo inicial.", "alternativas": ["Taxa incremental e proibida.", "E mensurado pelo valor presente dos pagamentos ainda nao efetuados.", "Direito de uso nao deprecia.", "Retroarrendamento sempre e venda.", "Todo servico contem arrendamento."], "correta": 1, "comentario": "A regra correta e: E mensurado pelo valor presente dos pagamentos ainda nao efetuados. As demais alternativas contrariam o pronunciamento."}, {"id": 133, "tema": "Taxa de desconto", "nivel": "Facil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre taxa de desconto.", "alternativas": ["Todo arrendamento e apenas despesa.", "Taxa incremental e proibida.", "Usa-se a taxa implicita se determinavel; caso contrario, a taxa incremental do arrendatario.", "O arrendador nao classifica arrendamentos.", "Variavel por vendas sempre entra no passivo."], "correta": 2, "comentario": "A regra correta e: Usa-se a taxa implicita se determinavel; caso contrario, a taxa incremental do arrendatario. As demais alternativas contrariam o pronunciamento."}, {"id": 134, "tema": "Pagamentos fixos", "nivel": "Medio", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre pagamentos fixos.", "alternativas": ["Todo servico contem arrendamento.", "Todo arrendamento e apenas despesa.", "Retroarrendamento sempre e venda.", "Pagamentos fixos e fixos em essencia, liquidos de incentivos, integram o passivo.", "Direito de uso nao deprecia."], "correta": 3, "comentario": "A regra correta e: Pagamentos fixos e fixos em essencia, liquidos de incentivos, integram o passivo. As demais alternativas contrariam o pronunciamento."}, {"id": 135, "tema": "Pagamentos por indice", "nivel": "Dificil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre pagamentos por indice.", "alternativas": ["Taxa incremental e proibida.", "Direito de uso nao deprecia.", "Curto prazo sempre tem opcao de compra.", "Principal e fluxo operacional.", "Pagamentos variaveis por indice ou taxa entram inicialmente pelo indice ou taxa da data de inicio."], "correta": 4, "comentario": "A regra correta e: Pagamentos variaveis por indice ou taxa entram inicialmente pelo indice ou taxa da data de inicio. As demais alternativas contrariam o pronunciamento."}, {"id": 136, "tema": "Opcao de compra", "nivel": "Facil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre opcao de compra.", "alternativas": ["O preco de exercicio integra o passivo quando o exercicio e razoavelmente certo.", "Todo arrendamento e apenas despesa.", "Variavel por vendas sempre entra no passivo.", "Todo servico contem arrendamento.", "Principal e fluxo operacional."], "correta": 0, "comentario": "A regra correta e: O preco de exercicio integra o passivo quando o exercicio e razoavelmente certo. As demais alternativas contrariam o pronunciamento."}, {"id": 137, "tema": "Depreciacao", "nivel": "Medio", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre depreciacao.", "alternativas": ["O arrendador nao classifica arrendamentos.", "Com transferencia ou compra provavel, usa-se a vida util; caso contrario, o menor entre vida util e prazo.", "Direito de uso nao deprecia.", "Todo servico contem arrendamento.", "O passivo e o valor nominal sem desconto."], "correta": 1, "comentario": "A regra correta e: Com transferencia ou compra provavel, usa-se a vida util; caso contrario, o menor entre vida util e prazo. As demais alternativas contrariam o pronunciamento."}, {"id": 138, "tema": "Passivo subsequente", "nivel": "Dificil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre passivo subsequente.", "alternativas": ["Direito de uso nao deprecia.", "Todo arrendamento e apenas despesa.", "Aumenta pelos juros, diminui pelos pagamentos e e remensurado quando aplicavel.", "Todo servico contem arrendamento.", "Variavel por vendas sempre entra no passivo."], "correta": 2, "comentario": "A regra correta e: Aumenta pelos juros, diminui pelos pagamentos e e remensurado quando aplicavel. As demais alternativas contrariam o pronunciamento."}, {"id": 139, "tema": "Remensuracao", "nivel": "Facil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre remensuracao.", "alternativas": ["Direito de uso nao deprecia.", "Variavel por vendas sempre entra no passivo.", "O arrendador nao classifica arrendamentos.", "Mudanca de prazo ou compra usa taxa revisada; alteracao de indice geralmente mantem a taxa.", "Taxa incremental e proibida."], "correta": 3, "comentario": "A regra correta e: Mudanca de prazo ou compra usa taxa revisada; alteracao de indice geralmente mantem a taxa. As demais alternativas contrariam o pronunciamento."}, {"id": 140, "tema": "Modificacao separada", "nivel": "Medio", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre modificacao separada.", "alternativas": ["Curto prazo sempre tem opcao de compra.", "Todo arrendamento e apenas despesa.", "O passivo e o valor nominal sem desconto.", "Principal e fluxo operacional.", "Ocorre quando aumenta o alcance e a contraprestacao cresce em preco individual compativel."], "correta": 4, "comentario": "A regra correta e: Ocorre quando aumenta o alcance e a contraprestacao cresce em preco individual compativel. As demais alternativas contrariam o pronunciamento."}];let i=0,s=0,a=false;function r(){let x=D[i];num.textContent="Questao "+(i+1)+" de "+D.length;q.textContent=x.enunciado;opts.innerHTML=x.alternativas.map((t,j)=>"<button onclick=ans("+j+")>"+String.fromCharCode(65+j)+") "+t+"</button>").join("");exp.classList.add("hidden")}function ans(j){if(a)return;a=true;let x=D[i];if(j===x.correta)s++;exp.textContent=(j===x.correta?"Correto. ":"Incorreto. ")+x.comentario;exp.classList.remove("hidden")}next.onclick=()=>{if(i<D.length-1){i++;a=false;r()}else document.querySelector("main").innerHTML="<section class=card><h2>Resultado</h2><p>"+s+" acertos de "+D.length+".</p><button onclick=location.reload()>Reiniciar</button></section>"};prev.onclick=()=>{if(i>0){i--;a=false;r()}};r()</script></body></html>
