correta sobre reavaliação.", "alternativas": ["Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Somente se permitida legalmente e existir mercado ativo; no Brasil, a reavaliação é legalmente restringida.", "Todo gasto intangível deve ser ativado.", "Treinamento integra sempre o custo do ativo.", "Vida útil indefinida deve ser amortizada em dez anos."], "correta": 1, "comentario": "A regra correta é: Somente se permitida legalmente e existir mercado ativo; no Brasil, a reavaliação é legalmente restringida. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 23, "tema": "Vida útil definida", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre vida útil definida.", "alternativas": ["Website promocional é sempre ativo.", "Treinamento integra sempre o custo do ativo.", "É amortizada sistematicamente ao longo da vida útil e submetida ao teste de recuperabilidade quando houver indicação.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Vida útil indefinida deve ser amortizada em dez anos."], "correta": 2, "comentario": "A regra correta é: É amortizada sistematicamente ao longo da vida útil e submetida ao teste de recuperabilidade quando houver indicação. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 24, "tema": "Vida útil indefinida", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre vida útil indefinida.", "alternativas": ["Vida útil indefinida deve ser amortizada em dez anos.", "Goodwill gerado internamente deve ser reconhecido.", "Gasto reconhecido como despesa pode ser reintegrado depois.", "Não é amortizada; deve ser testada anualmente por impairment e sempre que houver indicação.", "Todo gasto intangível deve ser ativado."], "correta": 3, "comentario": "A regra correta é: Não é amortizada; deve ser testada anualmente por impairment e sempre que houver indicação. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 25, "tema": "Início da amortização", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre início da amortização.", "alternativas": ["Todo gasto intangível deve ser ativado.", "Marca interna deve ser reconhecida pelo valor de mercado.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Vida útil indefinida deve ser amortizada em dez anos.", "A amortização começa quando o ativo está disponível para uso."], "correta": 4, "comentario": "A regra correta é: A amortização começa quando o ativo está disponível para uso. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 26, "tema": "Método de amortização", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre método de amortização.", "alternativas": ["Deve refletir o padrão de consumo dos benefícios; se não puder ser determinado, usa-se o método linear.", "Marca interna deve ser reconhecida pelo valor de mercado.", "Todo gasto intangível deve ser ativado.", "Website promocional é sempre ativo.", "Vida útil indefinida deve ser amortizada em dez anos."], "correta": 0, "comentario": "A regra correta é: Deve refletir o padrão de consumo dos benefícios; se não puder ser determinado, usa-se o método linear. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 27, "tema": "Valor residual", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre valor residual.", "alternativas": ["Marca interna deve ser reconhecida pelo valor de mercado.", "Em regra é zero, salvo compromisso de compra por terceiro ou existência de mercado ativo.", "Vida útil indefinida deve ser amortizada em dez anos.", "A amortização começa na data do pagamento.", "Gasto reconhecido como despesa pode ser reintegrado depois."], "correta": 1, "comentario": "A regra correta é: Em regra é zero, salvo compromisso de compra por terceiro ou existência de mercado ativo. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 28, "tema": "Revisão de estimativas", "nivel": "Fácil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre revisão de estimativas.", "alternativas": ["Website promocional é sempre ativo.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso.", "Vida útil, valor residual e método de amortização são revisados ao menos ao final de cada exercício.", "Goodwill gerado internamente deve ser reconhecido.", "Gasto reconhecido como despesa pode ser reintegrado depois."], "correta": 2, "comentario": "A regra correta é: Vida útil, valor residual e método de amortização são revisados ao menos ao final de cada exercício. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 29, "tema": "Baixa", "nivel": "Médio", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre baixa.", "alternativas": ["Treinamento integra sempre o custo do ativo.", "Gasto reconhecido como despesa pode ser reintegrado depois.", "Goodwill gerado internamente deve ser reconhecido.", "O ativo é baixado na alienação ou quando não se esperam benefícios econômicos futuros de uso ou alienação.", "Pesquisa deve ser capitalizada quando houver expectativa de sucesso."], "correta": 3, "comentario": "A regra correta é: O ativo é baixado na alienação ou quando não se esperam benefícios econômicos futuros de uso ou alienação. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}, {"id": 30, "tema": "Website", "nivel": "Difícil", "enunciado": "À luz do CPC 04 (R1), assinale a alternativa correta sobre website.", "alternativas": ["Goodwill gerado internamente deve ser reconhecido.", "A amortização começa na data do pagamento.", "Vida útil indefinida deve ser amortizada em dez anos.", "Gasto reconhecido como despesa pode ser reintegrado depois.", "Gastos de desenvolvimento de website podem ser ativados se os critérios forem atendidos; website meramente promocional é despesa."], "correta": 4, "comentario": "A regra correta é: Gastos de desenvolvimento de website podem ser ativados se os critérios forem atendidos; website meramente promocional é despesa. As demais alternativas contrariam os critérios de reconhecimento, mensuração, amortização ou divulgação do pronunciamento."}];let i=0,s=0,a=false;function r(){let x=D[i];num.textContent=`Questão ${i+1} de ${D.length}`;q.textContent=x.enunciado;opts.innerHTML=x.alternativas.map((t,j)=>`<button onclick="ans(${j})">${String.fromCharCode(65+j)}) ${t}</button>`).join('');exp.classList.add('hidden')}function ans(j){if(a)return;a=true;let x=D[i];if(j===x.correta)s++;exp.textContent=(j===x.correta?'✓ Correto. ':'✗ Incorreto. ')+x.comentario;exp.classList.remove('hidden')}next.onclick=()=>{if(i<D.length-1){i++;a=false;r()}else document.querySelector('main').innerHTML=`<section class="card"><h2>Resultado</h2><p>${s} acertos de ${D.length}.</p><button onclick="location.reload()">Reiniciar</button></section>`};prev.onclick=()=>{if(i>0){i--;a=false;r()}};r()</script></body></html>
