": 2, "tema": "Valor recuperável", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre valor recuperável.", "alternativas": ["O valor recuperável é sempre o menor entre valor em uso e valor justo.", "É o maior entre o valor justo líquido de despesas de alienação e o valor em uso.", "A perda da UGC reduz primeiro os ativos circulantes.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "A perda de goodwill deve ser revertida quando o mercado melhorar."], "correta": 1, "comentario": "A alternativa correta decorre da seguinte regra: É o maior entre o valor justo líquido de despesas de alienação e o valor em uso. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 3, "tema": "Perda por desvalorização", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre perda por desvalorização.", "alternativas": ["O teste anual só ocorre quando há indício externo.", "A taxa de desconto do valor em uso deve ser após os impostos.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "O valor contábil revisado não afeta a depreciação futura.", "É o excesso do valor contábil de um ativo ou UGC sobre seu valor recuperável."], "correta": 4, "comentario": "A alternativa correta decorre da seguinte regra: É o excesso do valor contábil de um ativo ou UGC sobre seu valor recuperável. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 4, "tema": "Valor em uso", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre valor em uso.", "alternativas": ["Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "A UGC é sempre definida como a entidade inteira.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "O teste anual só ocorre quando há indício externo.", "É o valor presente dos fluxos de caixa futuros esperados do ativo ou da UGC."], "correta": 4, "comentario": "A alternativa correta decorre da seguinte regra: É o valor presente dos fluxos de caixa futuros esperados do ativo ou da UGC. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 5, "tema": "UGC", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre ugc.", "alternativas": ["A perda da UGC reduz primeiro os ativos circulantes.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "É o menor grupo identificável de ativos que gera entradas de caixa em grande parte independentes.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "O teste anual só ocorre quando há indício externo."], "correta": 2, "comentario": "A alternativa correta decorre da seguinte regra: É o menor grupo identificável de ativos que gera entradas de caixa em grande parte independentes. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 6, "tema": "Teste por indicação", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre teste por indicação.", "alternativas": ["Ao final de cada período de reporte, a entidade avalia se há indicação de desvalorização.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "A UGC é sempre definida como a entidade inteira.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso."], "correta": 0, "comentario": "A alternativa correta decorre da seguinte regra: Ao final de cada período de reporte, a entidade avalia se há indicação de desvalorização. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 7, "tema": "Teste anual obrigatório", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre teste anual obrigatório.", "alternativas": ["Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "Goodwill, intangível de vida útil indefinida e intangível ainda não disponível para uso são testados pelo menos anualmente.", "A UGC é sempre definida como a entidade inteira.", "O valor contábil revisado não afeta a depreciação futura.", "O valor recuperável é sempre o menor entre valor em uso e valor justo."], "correta": 1, "comentario": "A alternativa correta decorre da seguinte regra: Goodwill, intangível de vida útil indefinida e intangível ainda não disponível para uso são testados pelo menos anualmente. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 8, "tema": "Fontes externas", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre fontes externas.", "alternativas": ["Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "O valor recuperável é sempre o menor entre valor em uso e valor justo.", "Queda relevante de valor, mudanças adversas, alta de juros e valor contábil do patrimônio superior ao valor de mercado são indícios externos.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "A perda da UGC reduz primeiro os ativos circulantes."], "correta": 2, "comentario": "A alternativa correta decorre da seguinte regra: Queda relevante de valor, mudanças adversas, alta de juros e valor contábil do patrimônio superior ao valor de mercado são indícios externos. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 9, "tema": "Fontes internas", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre fontes internas.", "alternativas": ["A UGC é sempre definida como a entidade inteira.", "A taxa de desconto do valor em uso deve ser após os impostos.", "O teste anual só ocorre quando há indício externo.", "Obsolescência, dano físico, ociosidade, reestruturação, baixa antecipada e desempenho pior que o esperado são indícios internos.", "A perda de goodwill deve ser revertida quando o mercado melhorar."], "correta": 3, "comentario": "A alternativa correta decorre da seguinte regra: Obsolescência, dano físico, ociosidade, reestruturação, baixa antecipada e desempenho pior que o esperado são indícios internos. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 10, "tema": "Ativo individual", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre ativo individual.", "alternativas": ["A perda da UGC reduz primeiro os ativos circulantes.", "O valor recuperável é apurado individualmente quando o ativo gera entradas independentes; caso contrário, usa-se a UGC.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "O valor recuperável é sempre o menor entre valor em uso e valor justo."], "correta": 1, "comentario": "A alternativa correta decorre da seguinte regra: O valor recuperável é apurado individualmente quando o ativo gera entradas independentes; caso contrário, usa-se a UGC. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 11, "tema": "Dois valores", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre dois valores.", "alternativas": ["O valor recuperável é sempre o menor entre valor em uso e valor justo.", "O teste anual só ocorre quando há indício externo.", "Se um dos componentes do valor recuperável já exceder o valor contábil, não é necessário calcular o outro.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "A taxa de desconto do valor em uso deve ser após os impostos."], "correta": 2, "comentario": "A alternativa correta decorre da seguinte regra: Se um dos componentes do valor recuperável já exceder o valor contábil, não é necessário calcular o outro. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 12, "tema": "Fluxos de caixa", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre fluxos de caixa.", "alternativas": ["O teste anual só ocorre quando há indício externo.", "A taxa de desconto do valor em uso deve ser após os impostos.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "O valor recuperável é sempre o menor entre valor em uso e valor justo.", "Devem refletir o ativo em sua condição atual e premissas razoáveis, fundamentadas e consistentes."], "correta": 4, "comentario": "A alternativa correta decorre da seguinte regra: Devem refletir o ativo em sua condição atual e premissas razoáveis, fundamentadas e consistentes. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 13, "tema": "Horizonte explícito", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre horizonte explícito.", "alternativas": ["O teste anual só ocorre quando há indício externo.", "A UGC é sempre definida como a entidade inteira.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "A perda da UGC reduz primeiro os ativos circulantes.", "As projeções detalhadas geralmente abrangem até cinco anos, salvo justificativa fundamentada."], "correta": 4, "comentario": "A alternativa correta decorre da seguinte regra: As projeções detalhadas geralmente abrangem até cinco anos, salvo justificativa fundamentada. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 14, "tema": "Extrapolação", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre extrapolação.", "alternativas": ["O valor contábil revisado não afeta a depreciação futura.", "A taxa de desconto do valor em uso d
