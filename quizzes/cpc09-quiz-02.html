<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 02</title><link rel="stylesheet" href="../assets/cpc09.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>Quiz 02</h1><p>CPC 09 (R1) — Demonstração do Valor Adicionado</p></div></header><nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc09-resumo.html">Resumo</a><a href="../mapas/cpc09-mapa.html">Mapa</a><a href="../casos/cpc09-casos.html">Casos</a><a href="../resumos/cpc09-flashcards.html">Flashcards</a><a href="../quizzes/cpc09-index.html">Quizzes</a><a href="../comentarios/cpc09-questoes.html">Questões</a><a href="../questoes/cpc09-banco.html">Banco</a></nav><main><section class="card"><p id="num"></p><h2 id="q"></h2><div id="opts" class="answers"></div><div id="exp" class="note hidden"></div><div class="toolbar"><button id="prev">← Voltar</button><button id="next">Avançar →</button></div></section></main><footer>Curso de Contabilidade Professor Moreira • WhatsApp 61 985323574</footer><script>const D=[{"id": 11, "tema": "Valor total a distribuir", "nivel": "Médio", "enunciado": "De acordo com o CPC 09 (R1), assinale a alternativa correta sobre valor total a distribuir.", "alternativas": ["É o valor adicionado líquido produzido somado ao valor adicionado recebido em transferência.", "Bancos usam Modelo I.", "A DVA mostra apenas caixa.", "Dividendos antigos entram no período atual.", "Total distribuído pode divergir do total a distribuir."], "correta": 0, "comentario": "A alternativa correta é a que reproduz o tratamento previsto no CPC 09: É o valor adicionado líquido produzido somado ao valor adicionado recebido em transferência."}, {"id": 12, "tema": "Distribuição ao pessoal", "nivel": "Difícil", "enunciado": "De acordo com o CPC 09 (R1), assinale a alternativa correta sobre distribuição ao pessoal.", "alternativas": ["A DVA mostra apenas caixa.", "Inclui remuneração direta, benefícios e FGTS.", "Seguradoras não têm modelo.", "Total distribuído pode divergir do total a distribuir.", "Dividendos antigos entram no período atual."], "correta": 1, "comentario": "A alternativa correta é a que reproduz o tratamento previsto no CPC 09: Inclui remuneração direta, benefícios e FGTS."}, {"id": 13, "tema": "Distribuição ao governo", "nivel": "Fácil", "enunciado": "De acordo com o CPC 09 (R1), assinale a alternativa correta sobre distribuição ao governo.", "alternativas": ["A DVA não usa a DRE.", "Depreciação aumenta o valor líquido.", "Inclui impostos, taxas e contribuições federais, estaduais e municipais.", "A DVA mostra apenas caixa.", "Receita financeira é riqueza própria."], "correta": 2, "comentario": "A alternativa correta é a que reproduz o tratamento previsto no CPC 09: Inclui impostos, taxas e contribuições federais, estaduais e municipais."}, {"id": 14, "tema": "Capitais de terceiros", "nivel": "Médio", "enunciado": "De acordo com o CPC 09 (R1), assinale a alternativa correta sobre capitais de terceiros.", "alternativas": ["Seguradoras não têm modelo.", "Receita financeira é riqueza própria.", "A DVA mostra apenas caixa.", "Inclui juros, aluguéis e outras remunerações pagas a financiadores externos.", "A DVA não usa a DRE."], "correta": 3, "comentario": "A alternativa correta é a que reproduz o tratamento previsto no CPC 09: Inclui juros, aluguéis e outras remunerações pagas a financiadores externos."}, {"id": 15, "tema": "Capitais próprios", "nivel": "Difícil", "enunciado": "De acordo com o CPC 09 (R1), assinale a alternativa correta sobre capitais próprios.", "alternativas": ["Total distribuído pode divergir do total a distribuir.", "Dividendos antigos entram no período atual.", "Pessoal próprio é insumo de terceiro.", "Depreciação aumenta o valor líquido.", "Inclui JCP, dividendos e lucros retidos ou prejuízo do exercício."], "correta": 4, "comentario": "A alternativa correta é a que reproduz o tratamento previsto no CPC 09: Inclui JCP, dividendos e lucros retidos ou prejuízo do exercício."}, {"id": 16, "tema": "Resultado de equivalência patrimonial", "nivel": "Fácil", "enunciado": "De acordo com o CPC 09 (R1), assinale a alternativa correta sobre resultado de equivalência patrimonial.", "alternativas": ["Pode ser positivo ou negativo e integra o valor adicionado recebido em transferência.", "A DVA mostra apenas caixa.", "Receita financeira é riqueza própria.", "Depreciação aumenta o valor líquido.", "Insumos são sempre líquidos de tributos."], "correta": 0, "comentario": "A alternativa correta é a que reproduz o tratamento previsto no CPC 09: Pode ser positivo ou negativo e integra o valor adicionado recebido em transferência."}, {"id": 17, "tema": "Receitas financeiras", "nivel": "Médio", "enunciado": "De acordo com o CPC 09 (R1), assinale a alternativa correta sobre receitas financeiras.", "alternativas": ["A DVA mostra apenas caixa.", "Integram o valor adicionado recebido em transferência.", "Pessoal próprio é insumo de terceiro.", "Receita financeira é riqueza própria.", "Insumos são sempre líquidos de tributos."], "correta": 1, "comentario": "A alternativa correta é a que reproduz o tratamento previsto no CPC 09: Integram o valor adicionado recebido em transferência."}, {"id": 18, "tema": "Ativo construído para uso próprio", "nivel": "Difícil", "enunciado": "De acordo com o CPC 09 (R1), assinale a alternativa correta sobre ativo construído para uso próprio.", "alternativas": ["A DVA não usa a DRE.", "Pessoal próprio é insumo de terceiro.", "Seu valor contábil integral é tratado como receita de construção de ativos próprios.", "Dividendos antigos entram no período atual.", "Total distribuído pode divergir do total a distribuir."], "correta": 2, "comentario": "A alternativa correta é a que reproduz o tratamento previsto no CPC 09: Seu valor contábil integral é tratado como receita de construção de ativos próprios."}, {"id": 19, "tema": "Juros capitalizados", "nivel": "Fácil", "enunciado": "De acordo com o CPC 09 (R1), assinale a alternativa correta sobre juros capitalizados.", "alternativas": ["Receita financeira é riqueza própria.", "Seguradoras não têm modelo.", "Dividendos antigos entram no período atual.", "São apresentados como remuneração de capitais de terceiros, conforme o momento aplicável.", "Bancos usam Modelo I."], "correta": 3, "comentario": "A alternativa correta é a que reproduz o tratamento previsto no CPC 09: São apresentados como remuneração de capitais de terceiros, conforme o momento aplicável."}, {"id": 20, "tema": "Dividendos de exercícios anteriores", "nivel": "Médio", "enunciado": "De acordo com o CPC 09 (R1), assinale a alternativa correta sobre dividendos de exercícios anteriores.", "alternativas": ["Receita financeira é riqueza própria.", "Depreciação aumenta o valor líquido.", "Pessoal próprio é insumo de terceiro.", "Insumos são sempre líquidos de tributos.", "Não integram a distribuição da riqueza do período corrente."], "correta": 4, "comentario": "A alternativa correta é a que reproduz o tratamento previsto no CPC 09: Não integram a distribuição da riqueza do período corrente."}];let i=0,s=0,a=false;function r(){let x=D[i];num.textContent='Questão '+(i+1)+' de '+D.length;q.textContent=x.enunciado;opts.innerHTML=x.alternativas.map((t,j)=>'<button onclick="ans('+j+')">'+String.fromCharCode(65+j)+') '+t+'</button>').join('');exp.classList.add('hidden')}function ans(j){if(a)return;a=true;let x=D[i];if(j===x.correta)s++;exp.textContent=(j===x.correta?'✓ Correto. ':'✗ Incorreto. ')+x.comentario;exp.classList.remove('hidden')}next.onclick=()=>{if(i<D.length-1){i++;a=false;r()}else document.querySelector('main').innerHTML='<section class="card"><h2>Resultado</h2><p>'+s+' acertos de '+D.length+'.</p><button onclick="location.reload()">Reiniciar</button></section>'};prev.onclick=()=>{if(i>0){i--;a=false;r()}};r()</script></body></html>
