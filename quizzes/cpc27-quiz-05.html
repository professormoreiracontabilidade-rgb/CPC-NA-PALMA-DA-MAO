<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 05 | Professor Moreira</title><link rel="stylesheet" href="../assets/cpc27.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>Quiz 05</h1><p>CPC 27 — Ativo Imobilizado</p></div></header><nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc27-resumo.html">Resumo</a><a href="../mapas/cpc27-mapa.html">Mapa</a><a href="../casos/cpc27-casos.html">Casos</a><a href="../resumos/cpc27-flashcards.html">Flashcards</a><a href="../quizzes/cpc27-index.html">Quizzes</a><a href="../comentarios/cpc27-questoes.html">Questões</a><a href="../questoes/cpc27-banco.html">Banco</a></nav><main><section class="card"><p id="num"></p><h2 id="q"></h2><div id="opts" class="answers"></div><div id="exp" class="note hidden"></div><div class="toolbar"><button id="prev">← Voltar</button><button id="next">Avançar →</button></div></section></main><footer>Curso de Contabilidade Professor Moreira • WhatsApp 61 985323574</footer><script>const D=[{"id": 41, "tema": "Reconhecimento", "nivel": "Médio", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre reconhecimento.", "alternativas": ["O custo é reconhecido quando benefícios futuros são prováveis e o custo pode ser mensurado confiavelmente.", "Ganho na baixa é receita de venda.", "Treinamento sempre integra o custo.", "Terrenos sempre são depreciados.", "Componentes significativos não podem ser separados."], "correta": 0, "comentario": "A alternativa correta decorre do CPC 27: O custo é reconhecido quando benefícios futuros são prováveis e o custo pode ser mensurado confiavelmente. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 42, "tema": "Sobressalentes", "nivel": "Difícil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre sobressalentes.", "alternativas": ["O método baseado em receita é recomendado.", "São imobilizado quando usados por mais de um período ou apenas em conexão com item do imobilizado.", "Manutenção periódica aumenta o ativo.", "Todo gasto com imobilizado deve ser capitalizado.", "Treinamento sempre integra o custo."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 27: São imobilizado quando usados por mais de um período ou apenas em conexão com item do imobilizado. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 43, "tema": "Manutenção periódica", "nivel": "Fácil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre manutenção periódica.", "alternativas": ["Treinamento sempre integra o custo.", "Vida útil nunca é revisada.", "É reconhecida no resultado quando incorrida.", "Componentes significativos não podem ser separados.", "A depreciação começa apenas quando há produção."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 27: É reconhecida no resultado quando incorrida. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 44, "tema": "Substituição de partes", "nivel": "Médio", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre substituição de partes.", "alternativas": ["Terrenos sempre são depreciados.", "A depreciação começa apenas quando há produção.", "Todo gasto com imobilizado deve ser capitalizado.", "É capitalizada se atender aos critérios, com baixa da parte substituída.", "Treinamento sempre integra o custo."], "correta": 3, "comentario": "A alternativa correta decorre do CPC 27: É capitalizada se atender aos critérios, com baixa da parte substituída. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 45, "tema": "Inspeção importante", "nivel": "Difícil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre inspeção importante.", "alternativas": ["Ganho na baixa é receita de venda.", "Todo gasto com imobilizado deve ser capitalizado.", "Componentes significativos não podem ser separados.", "Manutenção periódica aumenta o ativo.", "Seu custo pode ser capitalizado e a inspeção anterior deve ser baixada."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 27: Seu custo pode ser capitalizado e a inspeção anterior deve ser baixada. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 46, "tema": "Mensuração inicial", "nivel": "Fácil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre mensuração inicial.", "alternativas": ["O item reconhecido como ativo é mensurado pelo custo.", "Todo gasto com imobilizado deve ser capitalizado.", "Terrenos sempre são depreciados.", "Manutenção periódica aumenta o ativo.", "Ganho na baixa é receita de venda."], "correta": 0, "comentario": "A alternativa correta decorre do CPC 27: O item reconhecido como ativo é mensurado pelo custo. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 47, "tema": "Preço de aquisição", "nivel": "Médio", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre preço de aquisição.", "alternativas": ["Terrenos sempre são depreciados.", "Integra o custo, líquido de descontos, acrescido de tributos não recuperáveis.", "Treinamento sempre integra o custo.", "Ganho na baixa é receita de venda.", "A depreciação começa apenas quando há produção."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 27: Integra o custo, líquido de descontos, acrescido de tributos não recuperáveis. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 48, "tema": "Custos diretamente atribuíveis", "nivel": "Difícil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre custos diretamente atribuíveis.", "alternativas": ["O método baseado em receita é recomendado.", +String.fromCharCode(65+j)+') '+t+'</button>').join('');exp.classList.add('hidden');}function ans(j){if(a)return;a=true;let x=D[i];if(j===x.correta)s++;exp.textContent=(j===x.correta?'✓ Correto. ':'✗ Incorreto. ')+x.comentario;exp.classList.remove('hidden');}next.onclick=()=>{if(i<D.length-1){i++;a=false;r()}else document.querySelector('main').innerHTML='<section class="card"><h2>Resultado</h2><p>'+s+' acertos de '+D.length+'.</p><button onclick="location.reload()">Reiniciar</button></section>'};prev.onclick=()=>{if(i>0){i--;a=false;r()}};r();</script></body></html>
