ivo ou pago pela transferência de um passivo em transação não forçada na data de mensuração. As demais opções confundem preço de saída, mercado, técnicas de avaliação ou hierarquia."}];let i=0,s=0,a=false;function r(){let x=D[i];num.textContent='Questão '+(i+1)+' de '+D.length;q.textContent=x.enunciado;opts.innerHTML=x.alternativas.map((t,j)=>'<button onclick="ans('+j+')">'+String.fromCharCode(65+j)+') '+t+'</button>').join('');exp.classList.add('hidden');}function ans(j){if(a)return;a=true;let x=D[i];if(j===x.correta)s++;exp.textContent=(j===x.correta?'✓ Correto. ':'✗ Incorreto. ')+x.comentario;exp.classList.remove('hidden');}next.onclick=()=>{if(i<D.length-1){i++;a=false;r()}else document.querySelector('main').innerHTML='<section class="card"><h2>Resultado</h2><p>'+s+' acertos de '+D.length+'.</p><button onclick="location.reload()">Reiniciar</button></section>'};prev.onclick=()=>{if(i>0){i--;a=false;r()}};r();</script></body></html>
