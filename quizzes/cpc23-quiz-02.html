untária.", "alternativas": ["Política pode mudar apenas para reduzir tributos.", "Só é admitida se produzir informação confiável e mais relevante.", "Erro material é reconhecido no resultado corrente.", "Erro imaterial intencional é aceitável.", "É permitido usar percepção posterior."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 23: Só é admitida se produzir informação confiável e mais relevante. As demais opções confundem política, estimativa, erro ou forma de aplicação."}, {"id": 13, "tema": "Não é mudança de política", "nivel": "Fácil", "enunciado": "De acordo com o CPC 23, assinale a alternativa correta sobre não é mudança de política.", "alternativas": ["Erro material é reconhecido no resultado corrente.", "Erro imaterial intencional é aceitável.", "Política para transação nova ou materialmente diferente não é mudança de política.", "Impraticabilidade dispensa divulgação.", "Política pode mudar apenas para reduzir tributos."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 23: Política para transação nova ou materialmente diferente não é mudança de política. As demais opções confundem política, estimativa, erro ou forma de aplicação."}, {"id": 14, "tema": "Adoção antecipada", "nivel": "Médio", "enunciado": "De acordo com o CPC 23, assinale a alternativa correta sobre adoção antecipada.", "alternativas": ["Erro imaterial intencional é aceitável.", "Mudança de estimativa corrige erro anterior.", "Toda mudança é prospectiva.", "Não é considerada mudança voluntária.", "Toda mudança é retrospectiva."], "correta": 3, "comentario": "A alternativa correta decorre do CPC 23: Não é considerada mudança voluntária. As demais opções confundem política, estimativa, erro ou forma de aplicação."}, {"id": 15, "tema": "Regra retrospectiva", "nivel": "Difícil", "enunciado": "De acordo com o CPC 23, assinale a alternativa correta sobre regra retrospectiva.", "alternativas": ["Toda mudança é prospectiva.", "É permitido usar percepção posterior.", "Toda mudança é retrospectiva.", "Dividendos definem política contábil.", "Mudança de política é normalmente aplicada retrospectivamente."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 23: Mudança de política é normalmente aplicada retrospectivamente. As demais opções confundem política, estimativa, erro ou forma de aplicação."}, {"id": 16, "tema": "Disposição transitória", "nivel": "Fácil", "enunciado": "De acordo com o CPC 23, assinale a alternativa correta sobre disposição transitória.", "alternativas": ["Na adoção inicial, seguem-se as regras de transição da norma específica.", "Dividendos definem política contábil.", "Adoção antecipada é sempre mudança voluntária.", "Impraticabilidade dispensa divulgação.", "Toda mudança é retrospectiva."], "correta": 0, "comentario": "A alternativa correta decorre do CPC 23: Na adoção inicial, seguem-se as regras de transição da norma específica. As demais opções confundem política, estimativa, erro ou forma de aplicação."}, {"id": 17, "tema": "Limitação retrospectiva", "nivel": "Médio", "enunciado": "De acordo com o CPC 23, assinale a alternativa correta sobre limitação retrospectiva.", "alternativas": ["Impraticabilidade dispensa divulgação.", "Quando impraticável, aplica-se desde o período mais antigo praticável.", "Dividendos definem política contábil.", "Erro imaterial intencional é aceitável.", "É permitido usar percepção posterior."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 23: Quando impraticável, aplica-se desde o período mais antigo praticável. As demais opções confundem política, estimativa, erro ou forma de aplicação."}, {"id": 18, "tema": "Ajuste no patrimônio líquido", "nivel": "Difícil", "enunciado": "De acordo com o CPC 23, assinale a alternativa correta sobre ajuste no patrimônio líquido.", "alternativas": ["Política pode mudar apenas para reduzir tributos.", "Erro imaterial intencional é aceitável.", "Efeitos de períodos anteriores ajustam o saldo de aber
