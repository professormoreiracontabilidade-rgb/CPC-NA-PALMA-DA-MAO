<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 10 | Professor Moreira</title><link rel="stylesheet" href="../assets/cpc01.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>Quiz 10</h1><p>CPC 01 (R1) — Questões comentadas</p></div></header><nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc01-resumo.html">Resumo</a><a href="../mapas/cpc01-mapa.html">Mapa</a><a href="../casos/cpc01-casos.html">Casos</a><a href="../resumos/cpc01-flashcards.html">Flashcards</a><a href="../quizzes/cpc01-index.html">Quizzes</a><a href="../comentarios/cpc01-questoes.html">Questões</a><a href="../questoes/cpc01-banco.html">Banco</a></nav><main><section class="card" id="quiz"><p id="num"></p><h2 id="q"></h2><div id="opts"></div><div id="exp" class="tip hidden"></div><div class="toolbar"><button id="prev">← Voltar</button><button id="next">Avançar →</button></div></section></main><footer>Curso de Contabilidade Professor Moreira • WhatsApp 61 985323574</footer><script>const QUESTIONS=[{"id": 91, "tema": "Dois valores", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre dois valores.", "alternativas": ["O valor recuperável é sempre o menor entre valor em uso e valor justo.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "A perda da UGC reduz primeiro os ativos circulantes.", "Se um dos componentes do valor recuperável já exceder o valor contábil, não é necessário calcular o outro."], "correta": 4, "comentario": "A alternativa correta decorre da seguinte regra: Se um dos componentes do valor recuperável já exceder o valor contábil, não é necessário calcular o outro. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 92, "tema": "Fluxos de caixa", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre fluxos de caixa.", "alternativas": ["O valor contábil revisado não afeta a depreciação futura.", "A perda da UGC reduz primeiro os ativos circulantes.", "Devem refletir o ativo em sua condição atual e premissas razoáveis, fundamentadas e consistentes.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "O valor recuperável é sempre o menor entre valor em uso e valor justo."], "correta": 2, "comentario": "A alternativa correta decorre da seguinte regra: Devem refletir o ativo em sua condição atual e premissas razoáveis, fundamentadas e consistentes. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 93, "tema": "Horizonte explícito", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre horizonte explícito.", "alternativas": ["A perda de goodwill deve ser revertida quando o mercado melhorar.", "As projeções detalhadas geralmente abrangem até cinco anos, salvo justificativa fundamentada.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "O valor recuperável é sempre o menor entre valor em uso e valor justo.", "A UGC é sempre definida como a entidade inteira."], "correta": 1, "comentario": "A alternativa correta decorre da seguinte regra: As projeções detalhadas geralmente abrangem até cinco anos, salvo justificativa fundamentada. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 94, "tema": "Extrapolação", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre extrapolação.", "alternativas": ["Após o orçamento, utiliza-se taxa de crescimento estável ou decrescente, salvo justificativa para taxa crescente.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "O valor recuperável é sempre o menor entre valor em uso e valor justo.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "A UGC é sempre definida como a entidade inteira."], "correta": 0, "comentario": "A alternativa correta decorre da seguinte regra: Após o orçamento, utiliza-se taxa de crescimento estável ou decrescente, salvo justificativa para taxa crescente. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 95, "tema": "Itens excluídos", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre itens excluídos.", "alternativas": ["Fluxos de financiamento e tributos sobre a renda não integram o cálculo do valor em uso.", "A perda da UGC reduz primeiro os ativos circulantes.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "A taxa de desconto do valor em uso deve ser após os impostos.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso."], "correta": 0, "comentario": "A alternativa correta decorre da seguinte regra: Fluxos de financiamento e tributos sobre a renda não integram o cálculo do valor em uso. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 96, "tema": "Reestruturação futura", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre reestruturação futura.", "alternativas": ["Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "Fluxos de reestruturação ainda não compromissada e melhorias futuras do ativo são excluídos.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "A UGC é sempre definida como a entidade inteira.", "O valor contábil revisado não afeta a depreciação futura."], "correta": 1, "comentario": "A alternativa correta decorre da seguinte regra: Fluxos de reestruturação ainda não compromissada e melhorias futuras do ativo são excluídos. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 97, "tema": "Inflação", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre inflação.", "alternativas": ["Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "A perda da UGC reduz primeiro os ativos circulantes.", "A UGC é sempre definida como a entidade inteira.", "Fluxos nominais combinam com taxa nominal; fluxos reais combinam com taxa real.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso."], "correta": 3, "comentario": "A alternativa correta decorre da seguinte regra: Fluxos nominais combinam com taxa nominal; fluxos reais combinam com taxa real. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 98, "tema": "Moeda estrangeira", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre moeda estrangeira.", "alternativas": ["Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "Os fluxos são estimados e descontados na moeda em que são gerados e convertidos pela taxa à vista na data do cálculo.", "O valor contábil revisado não afeta a depreciação futura.", "A taxa de desconto do valor em uso deve ser após os impostos."], "correta": 2, "comentario": "A alternativa correta decorre da seguinte regra: Os fluxos são estimados e descontados na moeda em que são gerados e convertidos pela taxa à vista na data do cálculo. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 99, "tema": "Taxa de desconto", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre taxa de desconto.", "alternativas": ["É antes dos impostos e reflete valor do dinheiro no tempo e riscos não incorporados aos fluxos.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "O valor recuperável é sempre o menor entre valor em uso e valor justo.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "A perda da UGC reduz primeiro os ativos circulantes."], "correta": 0, "comentario": "A alternativa correta decorre da seguinte regra: É antes dos impostos e reflete valor do dinheiro no tempo e riscos não incorporados aos fluxos. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 100, "tema": "Reconhecimento", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre reconhecimento.", "alternativas": ["A UGC é sempre definida como a entidade inteira.", "O teste anual só ocorre quando há indício externo.", "A perda da UGC reduz primeiro os ativos circulantes.", "Se o valor recuperável for menor que o valor contábil, reduz-se o ativo ao valor recuperável.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos."], "correta": 3, "comentario": "A alternativa correta decorre da seguinte regra: Se o valor recuperável for menor que o valor contábil, reduz-se o ativo ao valor recuperável. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}]</script><script>const $=s=>document.querySelector(s);let i=0,score=0,answered=false;function draw(){const q=QUESTIONS[i];$('#num').textContent='Questão '+(i+1)+' de '+QUESTIONS.length;$('#q').textContent=q.enunciado;$('#opts').innerHTML=q.alternativas.map((a,j)=>`<button class="option" data-j="${j}">${String.fromCharCode(65+j)}) ${a}</button>`).join('');$('#exp').classList.add('hidden');answered=false;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(+b.dataset.j))}function answer(j){if(answered)return;answered=true;const q=QUESTIONS[i];if(j===q.correta)score++;document.querySelectorAll('.option').forEach((b,n)=>{if(n===q.correta)b.classList.add('correct');else if(n===j)b.classList.add('wrong')});$('#exp').textContent=q.comentario;$('#exp').classList.remove('hidden')}$('#next').onclick=()=>{if(i<QUESTIONS.length-1){i++;draw()}else{$('#quiz').innerHTML=`<section class="card"><h2>Resultado</h2><p>Você acertou ${score} de ${QUESTIONS.length} questões.</p><button onclick="location.reload()">Reiniciar</button></section>`}};$('#prev').onclick=()=>{if(i>0){i--;draw()}};draw();</script></body></html>
