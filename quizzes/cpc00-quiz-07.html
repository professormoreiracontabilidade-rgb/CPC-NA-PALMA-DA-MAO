<body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>Quiz 07 — CPC 00</h1>

<nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc00-resumo.html">Resumo</a><a href="../mapas/cpc00-mapa.html">Mapa</a><a href="../casos/cpc00-casos.html">Casos</a><a href="../quizzes/cpc00-index.html">Quizzes</a><a href="../comentarios/cpc00-questoes.html">Questões</a><a href="../ia/cpc00-ia.html">Pergunte</a></nav>
<main><section class="card"><div class="progress"><span id="bar"></span></div><p id="status"></p></section>
<section class="card" id="box"></section><div class="center"><button class="btn" id="back">← Voltar</button><button class="btn btn-primary" id="next">Avançar →</button><button class="btn" id="restart">Reiniciar</button></div></main><footer>Curso de Contabilidade Professor Moreira</footer><script>const qs=[{"n": 61, "q": "Em relação à Estrutura Conceitual, julgue: A Estrutura Conceitual se sobrepõe aos pronunciamentos específicos.", "options": ["Certo", "Errado"], "answer": 1, "explanation": "Ela não é pronunciamento e não se sobrepõe a requisitos específicos."}, {"n": 62, "q": "Em relação à Estrutura Conceitual, julgue: Os usuários primários incluem investidores e credores existentes e potenciais.", "options": ["Certo", "Errado"], "answer": 0, "explanation": "São os principais destinatários dos relatórios financeiros para fins gerais."}, {"n": 63, "q": "Em relação à Estrutura Conceitual, julgue: Relatórios financeiros têm como objetivo apresentar o valor exato da entidade.", "options": ["Certo", "Errado"], "answer": 1, "explanation": "Eles fornecem informações que auxiliam os usuários a estimar o valor."}, {"n": 64, "q": "Em relação à Estrutura Conceitual, julgue: Relevância e representação fidedigna são características fundamentais.", "options": ["Certo", "Errado"], "answer": 0, "explanation": "As demais características qualificam e melhoram a utilidade."}, {"n": 65, "q": "Em relação à Estrutura Conceitual, julgue: Materialidade é aspecto de relevância específico da entidade.", "options": ["Certo", "Errado"], "answer": 0, "explanation": "Depende da natureza ou magnitude, ou ambas, no contexto da entidade."}, {"n": 66, "q": "Em relação à Estrutura Conceitual, julgue: Prudência autoriza criar reservas ocultas.", "options": ["Certo", "Errado"], "answer": 1, "explanation": "Prudência é cautela sem viés e não permite subavaliação ou superavaliação deliberada."}, {"n": 67, "q": "Em relação à Estrutura Conceitual, julgue: Ativo é necessariamente um objeto físico.", "options": ["Certo", "Errado"], "answer": 1, "explanation": "Ativo é recurso econômico; o recurso é um direito."}, {"n": 68, "q": "Em relação à Estrutura Conceitual, julgue: Baixa probabilidade de benefício impede que um direito seja ativo.", "options": ["Certo", "Errado"], "answer": 1, "explanation": "O direito precisa ter potencial; a probabilidade afeta reconhecimento e mensuração."}, {"n": 69, "q": "Em relação à Estrutura Conceitual, julgue: Passivo exige obrigação presente de transferir recurso econômico.", "options": ["Certo", "Errado"], "answer": 0, "explanation": "A obrigação resulta de eventos passados."}, {"n": 70, "q": "Em relação à Estrutura Conceitual, julgue: Aporte dos sócios é receita.", "options": ["Certo", "Errado"], "answer": 1, "explanation": "Contribuições dos proprietários são excluídas da definição de receita."}];let i=0,score=0,answered=false;
const box=document.querySelector('#box');function render(){answered=false;let q=qs[i];document.querySelector('#status').textContent=`Questão ${i+1} de ${qs.length} • Acertos: ${score}`;document.querySelector('#bar').style.width=((i+1)/qs.length*100)+'%';box.innerHTML=`<h2>Questão ${q.n}</h2><p class="question">${q.q}</p>${q.options.map((o,k)=>`<button class="option" data-k="${k}">${o}</button>`).join('')}<div class="feedback"></div>`;}
box.onclick=e=>{const b=e.target.closest('[data-k]');if(!b||answered)return;answered=true;const q=qs[i],k=+b.dataset.k;if(k===q.answer){score++;b.classList.add('correct')}else{b.classList.add('wrong');box.querySelector(`[data-k="${q.answer}"]`).classList.add('correct')}const f=box.querySelector('.feedback');f.style.display='block';f.innerHTML=`<b>Gabarito: ${q.options[q.answer]}</b><br>${q.explanation}`;}
document.querySelector('#next').onclick=()=>{if(i<qs.length-1){i++;render()}else{box.innerHTML=`<h2>Resultado</h2><p class="question">Você acertou ${score} de ${qs.length} questões.</p>`}};document.querySelector('#back').onclick=()=>{if(i>0){i--;render()}};document.querySelector('#restart').onclick=()=>{i=0;score=0;render()};render();</script></body></html>
