<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 16 | Professor Moreira</title><link rel="stylesheet" href="../assets/cpc01.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>Quiz 16</h1><p>CPC 01 (R1) — Questões comentadas</p></div></header><nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc01-resumo.html">Resumo</a><a href="../mapas/cpc01-mapa.html">Mapa</a><a href="../casos/cpc01-casos.html">Casos</a><a href="../resumos/cpc01-flashcards.html">Flashcards</a><a href="../quizzes/cpc01-index.html">Quizzes</a><a href="../comentarios/cpc01-questoes.html">Questões</a><a href="../questoes/cpc01-banco.html">Banco</a></nav><main><section class="card" id="quiz"><p id="num"></p><h2 id="q"></h2><div id="opts"></div><div id="exp" class="tip hidden"></div><div class="toolbar"><button id="prev">← Voltar</button><button id="next">Avançar →</button></div></section></main><footer>Curso de Contabilidade Professor Moreira • WhatsApp 61 985323574</footer><script>const QUESTIONS=[{"id": 151, "tema": "Reversão no resultado", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre reversão no resultado.", "alternativas": ["A taxa de desconto do valor em uso deve ser após os impostos.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "Para ativo não reavaliado, a reversão é reconhecida imediatamente no resultado.", "O valor recuperável é sempre o menor entre valor em uso e valor justo.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos."], "correta": 2, "comentario": "A alternativa correta decorre da seguinte regra: Para ativo não reavaliado, a reversão é reconhecida imediatamente no resultado. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 152, "tema": "Divulgação", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre divulgação.", "alternativas": ["Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "A taxa de desconto do valor em uso deve ser após os impostos.", "Devem ser divulgados valores de perdas e reversões, eventos, natureza do ativo, UGC, base do valor recuperável e premissas relevantes.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "O teste anual só ocorre quando há indício externo."], "correta": 2, "comentario": "A alternativa correta decorre da seguinte regra: Devem ser divulgados valores de perdas e reversões, eventos, natureza do ativo, UGC, base do valor recuperável e premissas relevantes. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 153, "tema": "Ativo corporativo", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre ativo corporativo.", "alternativas": ["Ativo corporativo contribui para várias UGCs e deve ser alocado em base razoável e consistente quando possível.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "O valor recuperável é sempre o menor entre valor em uso e valor justo.", "A perda da UGC reduz primeiro os ativos circulantes.", "A taxa de desconto do valor em uso deve ser após os impostos."], "correta": 0, "comentario": "A alternativa correta decorre da seguinte regra: Ativo corporativo contribui para várias UGCs e deve ser alocado em base razoável e consistente quando possível. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 154, "tema": "Consistência da UGC", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre consistência da ugc.", "alternativas": ["O teste anual só ocorre quando há indício externo.", "UGCs devem ser identificadas consistentemente entre períodos, salvo justificativa para mudança.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "A perda da UGC reduz primeiro os ativos circulantes.", "O valor recuperável é sempre o menor entre valor em uso e valor justo."], "correta": 1, "comentario": "A alternativa correta decorre da seguinte regra: UGCs devem ser identificadas consistentemente entre períodos, salvo justificativa para mudança. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 155, "tema": "Mercado ativo interno", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre mercado ativo interno.", "alternativas": ["Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "A perda da UGC reduz primeiro os ativos circulantes.", "Mesmo produção usada internamente pode formar UGC separada se houver mercado ativo para o produto.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "O teste anual só ocorre quando há indício externo."], "correta": 2, "comentario": "A alternativa correta decorre da seguinte regra: Mesmo produção usada internamente pode formar UGC separada se houver mercado ativo para o produto. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 156, "tema": "Passivos na UGC", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre passivos na ugc.", "alternativas": ["Passivo reconhecido só é incluído se o valor recuperável não puder ser determinado sem considerá-lo.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "O valor contábil revisado não afeta a depreciação futura.", "A UGC é sempre definida como a entidade inteira."], "correta": 0, "comentario": "A alternativa correta decorre da seguinte regra: Passivo reconhecido só é incluído se o valor recuperável não puder ser determinado sem considerá-lo. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 157, "tema": "Teste em momentos diferentes", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre teste em momentos diferentes.", "alternativas": ["Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "A perda da UGC reduz primeiro os ativos circulantes.", "UGCs com goodwill podem ser testadas em épocas distintas, desde que anualmente e de forma consistente.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "O valor recuperável é sempre o menor entre valor em uso e valor justo."], "correta": 2, "comentario": "A alternativa correta decorre da seguinte regra: UGCs com goodwill podem ser testadas em épocas distintas, desde que anualmente e de forma consistente. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 158, "tema": "Aquisição no período", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre aquisição no período.", "alternativas": ["O valor recuperável é sempre o menor entre valor em uso e valor justo.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "Goodwill adquirido no período deve ser testado antes do encerramento desse período.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso."], "correta": 2, "comentario": "A alternativa correta decorre da seguinte regra: Goodwill adquirido no período deve ser testado antes do encerramento desse período. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 159, "tema": "Sequência de testes", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre sequência de testes.", "alternativas": ["A UGC é sempre definida como a entidade inteira.", "O valor contábil revisado não afeta a depreciação futura.", "Quando ativos da UGC também exigem teste individual, eles são testados antes da UGC com goodwill.", "A taxa de desconto do valor em uso deve ser após os impostos.", "A perda da UGC reduz primeiro os ativos circulantes."], "correta": 2, "comentario": "A alternativa correta decorre da seguinte regra: Quando ativos da UGC também exigem teste individual, eles são testados antes da UGC com goodwill. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 160, "tema": "Materialidade", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre materialidade.", "alternativas": ["A taxa de desconto do valor em uso deve ser após os impostos.", "A materialidade pode dispensar nova estimativa quando cálculos anteriores mostram ampla folga e não houve mudança relevante.", "A UGC é sempre definida como a entidade inteira.", "O valor recuperável é sempre o menor entre valor em uso e valor justo.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos."], "correta": 1, "comentario": "A alternativa correta decorre da seguinte regra: A materialidade pode dispensar nova estimativa quando cálculos anteriores mostram ampla folga e não houve mudança relevante. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}]</script><script>const $=s=>document.querySelector(s);let i=0,score=0,answered=false;function draw(){const q=QUESTIONS[i];$('#num').textContent='Questão '+(i+1)+' de '+QUESTIONS.length;$('#q').textContent=q.enunciado;$('#opts').innerHTML=q.alternativas.map((a,j)=>`<button class="option" data-j="${j}">${String.fromCharCode(65+j)}) ${a}</button>`).join('');$('#exp').classList.add('hidden');answered=false;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(+b.dataset.j))}function answer(j){if(answered)return;answered=true;const q=QUESTIONS[i];if(j===q.correta)score++;document.querySelectorAll('.option').forEach((b,n)=>{if(n===q.correta)b.classList.add('correct');else if(n===j)b.classList.add('wrong')});$('#exp').textContent=q.comentario;$('#exp').classList.remove('hidden')}$('#next').onclick=()=>{if(i<QUESTIONS.length-1){i++;draw()}else{$('#quiz').innerHTML=`<section class="card"><h2>Resultado</h2><p>Você acertou ${score} de ${QUESTIONS.length} questões.</p><button onclick="location.reload()">Reiniciar</button></section>`}};$('#prev').onclick=()=>{if(i>0){i--;draw()}};draw();</script></body></html>
