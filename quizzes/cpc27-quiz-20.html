<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 20 | Professor Moreira</title><link rel="stylesheet" href="../assets/cpc27.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>Quiz 20</h1><p>CPC 27 — Ativo Imobilizado</p></div></header><nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc27-resumo.html">Resumo</a><a href="../mapas/cpc27-mapa.html">Mapa</a><a href="../casos/cpc27-casos.html">Casos</a><a href="../resumos/cpc27-flashcards.html">Flashcards</a><a href="../quizzes/cpc27-index.html">Quizzes</a><a href="../comentarios/cpc27-questoes.html">Questões</a><a href="../questoes/cpc27-banco.html">Banco</a></nav><main><section class="card"><p id="num"></p><h2 id="q"></h2><div id="opts" class="answers"></div><div id="exp" class="note hidden"></div><div class="toolbar"><button id="prev">← Voltar</button><button id="next">Avançar →</button></div></section></main><footer>Curso de Contabilidade Professor Moreira • WhatsApp 61 985323574</footer><script>const D=[{"id": 191, "tema": "Objetivo", "nivel": "Médio", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre objetivo.", "alternativas": ["Estabelecer o tratamento contábil do ativo imobilizado, incluindo reconhecimento, mensuração, depreciação, impairment e baixa.", "Terrenos sempre são depreciados.", "Manutenção periódica aumenta o ativo.", "Vida útil nunca é revisada.", "Ganho na baixa é receita de venda."], "correta": 0, "comentario": "A alternativa correta decorre do CPC 27: Estabelecer o tratamento contábil do ativo imobilizado, incluindo reconhecimento, mensuração, depreciação, impairment e baixa. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 192, "tema": "Ativo imobilizado", "nivel": "Difícil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre ativo imobilizado.", "alternativas": ["Treinamento sempre integra o custo.", "Item tangível mantido para produção, fornecimento, aluguel ou administração e esperado para uso por mais de um período.", "Terrenos sempre são depreciados.", "Ganho na baixa é receita de venda.", "Vida útil nunca é revisada."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 27: Item tangível mantido para produção, fornecimento, aluguel ou administração e esperado para uso por mais de um período. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 193, "tema": "Reconhecimento", "nivel": "Fácil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre reconhecimento.", "alternativas": ["Treinamento sempre integra o custo.", "Vida útil nunca é revisada.", "O custo é reconhecido quando benefícios futuros são prováveis e o custo pode ser mensurado confiavelmente.", "Impairment não se aplica ao imobilizado.", "A depreciação começa apenas quando há produção."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 27: O custo é reconhecido quando benefícios futuros são prováveis e o custo pode ser mensurado confiavelmente. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 194, "tema": "Sobressalentes", "nivel": "Médio", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre sobressalentes.", "alternativas": ["Treinamento sempre integra o custo.", "Ganho na baixa é receita de venda.", "Vida útil nunca é revisada.", "São imobilizado quando usados por mais de um período ou apenas em conexão com item do imobilizado.", "Impairment não se aplica ao imobilizado."], "correta": 3, "comentario": "A alternativa correta decorre do CPC 27: São imobilizado quando usados por mais de um período ou apenas em conexão com item do imobilizado. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 195, "tema": "Manutenção periódica", "nivel": "Difícil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre manutenção periódica.", "alternativas": ["A depreciação começa apenas quando há produção.", "Impairment não se aplica ao imobilizado.", "Vida útil nunca é revisada.", "Manutenção periódica aumenta o ativo.", "É reconhecida no resultado quando incorrida."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 27: É reconhecida no resultado quando incorrida. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 196, "tema": "Substituição de partes", "nivel": "Fácil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre substituição de partes.", "alternativas": ["É capitalizada se atender aos critérios, com baixa da parte substituída.", "Terrenos sempre são depreciados.", "Componentes significativos não podem ser separados.", "Impairment não se aplica ao imobilizado.", "A depreciação começa apenas quando há produção."], "correta": 0, "comentario": "A alternativa correta decorre do CPC 27: É capitalizada se atender aos critérios, com baixa da parte substituída. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 197, "tema": "Inspeção importante", "nivel": "Médio", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre inspeção importante.", "alternativas": ["Manutenção periódica aumenta o ativo.", "Seu custo pode ser capitalizado e a inspeção anterior deve ser baixada.", "Terrenos sempre são depreciados.", "O método baseado em receita é recomendado.", "Impairment não se aplica ao imobilizado."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 27: Seu custo pode ser capitalizado e a inspeção anterior deve ser baixada. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 198, "tema": "Mensuração inicial", "nivel": "Difícil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre mensuração inicial.", "alternativas": ["A depreciação começa apenas quando há produção.", "Todo gasto com imobilizado deve ser capitalizado.", "O item reconhecido como ativo é mensurado pelo custo.", "O método baseado em receita é recomendado.", "Manutenção periódica aumenta o ativo."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 27: O item reconhecido como ativo é mensurado pelo custo. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 199, "tema": "Preço de aquisição", "nivel": "Fácil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre preço de aquisição.", "alternativas": ["A depreciação começa apenas quando há produção.", "Impairment não se aplica ao imobilizado.", "O método baseado em receita é recomendado.", "Integra o custo, líquido de descontos, acrescido de tributos não recuperáveis.", "Ganho na baixa é receita de venda."], "correta": 3, "comentario": "A alternativa correta decorre do CPC 27: Integra o custo, líquido de descontos, acrescido de tributos não recuperáveis. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 200, "tema": "Custos diretamente atribuíveis", "nivel": "Médio", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre custos diretamente atribuíveis.", "alternativas": ["Vida útil nunca é revisada.", "Treinamento sempre integra o custo.", "Ganho na baixa é receita de venda.", "Componentes significativos não podem ser separados.", "Incluem preparação do local, frete, instalação, testes e honorários profissionais."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 27: Incluem preparação do local, frete, instalação, testes e honorários profissionais. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}];let i=0,s=0,a=false;function r(){let x=D[i];num.textContent='Questão '+(i+1)+' de '+D.length;q.textContent=x.enunciado;opts.innerHTML=x.alternativas.map((t,j)=>'<button onclick="ans('+j+')">'+String.fromCharCode(65+j)+') '+t+'</button>').join('');exp.classList.add('hidden');}function ans(j){if(a)return;a=true;let x=D[i];if(j===x.correta)s++;exp.textContent=(j===x.correta?'✓ Correto. ':'✗ Incorreto. ')+x.comentario;exp.classList.remove('hidden');}next.onclick=()=>{if(i<D.length-1){i++;a=false;r()}else document.querySelector('main').innerHTML='<section class="card"><h2>Resultado</h2><p>'+s+' acertos de '+D.length+'.</p><button onclick="location.reload()">Reiniciar</button></section>'};prev.onclick=()=>{if(i>0){i--;a=false;r()}};r();</script></body></html>
