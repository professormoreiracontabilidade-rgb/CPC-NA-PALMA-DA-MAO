isão pode ser usada para qualquer gasto.", "Treinamento integra provisão de reestruturação.", "Perdas operacionais futuras devem ser provisionadas.", "Deixa de ser contingente e é reconhecido."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 25: Deixa de ser contingente e é reconhecido. As demais opções confundem reconhecimento, probabilidade, mensuração ou divulgação."}, {"id": 106, "tema": "Melhor estimativa", "nivel": "Fácil", "enunciado": "De acordo com o CPC 25, assinale a alternativa correta sobre melhor estimativa.", "alternativas": ["Valor que a entidade racionalmente pagaria para liquidar ou transferir a obrigação.", "A provisão pode ser usada para qualquer gasto.", "Passivo contingente remoto deve ser divulgado.", "Reembolso provável é sempre reconhecido.", "Perdas operacionais futuras devem ser provisionadas."], "correta": 0, "comentario": "A alternativa correta decorre do CPC 25: Valor que a entidade racionalmente pagaria para liquidar ou transferir a obrigação. As demais opções confundem reconhecimento, probabilidade, mensuração ou divulgação."}, {"id": 107, "tema": "Grande população", "nivel": "Médio", "enunciado": "De acordo com o CPC 25, assinale a alternativa correta sobre grande população.", "alternativas": ["Decisão interna cria automaticamente obrigação.", "Usa-se valor esperado ponderado pelas probabilidades.", "Ganhos na venda de ativos reduzem a provisão.", "Provisões nunca são descontadas.", "Ativo contingente provável deve ser reconhecido."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 25: Usa-se valor esperado ponderado pelas probabilidades. As demais opções confundem reconhecimento, probabilidade, mensuração ou divulgação."}, {"id": 108, "tema": "Obrigação única", "nivel": "Difícil", "enunciado": "De acordo com o CPC 25, assinale a alternativa correta sobre obrigação única.", "alternativas": ["Ganhos na venda de ativos reduzem a provisão.", "Treinamento integra provisão de reestruturação.", "O desf
