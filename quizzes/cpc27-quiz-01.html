ivo imobilizado.", "alternativas": ["Treinamento sempre integra o custo.", "Item tangível mantido para produção, fornecimento, aluguel ou administração e esperado para uso por mais de um período.", "Componentes significativos não podem ser separados.", "Manutenção periódica aumenta o ativo.", "Vida útil nunca é revisada."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 27: Item tangível mantido para produção, fornecimento, aluguel ou administração e esperado para uso por mais de um período. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 3, "tema": "Reconhecimento", "nivel": "Difícil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre reconhecimento.", "alternativas": ["Impairment não se aplica ao imobilizado.", "O método baseado em receita é recomendado.", "O custo é reconhecido quando benefícios futuros são prováveis e o custo pode ser mensurado confiavelmente.", "Manutenção periódica aumenta o ativo.", "A depreciação começa apenas quando há produção."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 27: O custo é reconhecido quando benefícios futuros são prováveis e o custo pode ser mensurado confiavelmente. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 4, "tema": "Sobressalentes", "nivel": "Fácil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre sobressalentes.", "alternativas": ["Vida útil nunca é revisada.", "A depreciação começa apenas quando há produção.", "Terrenos sempre são depreciados.", "São imobilizado quando usados por mais de um período ou apenas em conexão com item do imobilizado.", "Treinamento sempre integra o custo."], "correta": 3, "comentario": "A alternativa correta decorre do CPC 27: São imobilizado quando usados por mais de um período ou apenas em conexão com item do imobilizado. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 5, "tema": "Manutenção periódica", "nivel": "Médio", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre manutenção periódica.", "alternativas": ["Ganho na baixa é receita de venda.", "Treinamento sempre integra o custo.", "Impairment não se aplica ao imobilizado.", "Manutenção periódica aumenta o ativo.", "É reconhecida no resultado quando incorrida."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 27: É reconhecida no resultado quando incorrida. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 6, "tema": "Substituição de partes", "nivel": "Difícil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre substituição de partes.", "alternativas": ["É capitalizada se atender aos critérios, com baixa da parte substituída.", "Vida útil nunca é revisada.", "Componentes significativos não podem ser separados.", "Todo gasto com imobilizado deve ser capitalizado.", "O método baseado em receita é recomendado."], "correta": 0, "comentario": "A alternativa correta decorre do CPC 27: É capitalizada se atender aos critérios, com baixa da parte substituída. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 7, "tema": "Inspeção importante", "nivel": "Fácil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre inspeção importante.", "alternativas": ["Ganho na baixa é receita de venda.", "Seu custo pode ser capitalizado e a inspeção anterior deve ser baixada.", "O método baseado em receita é recomendado.", "Todo gasto com imobilizado deve ser capitalizado.", "Vida útil nunca é revisada."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 27: Seu custo pode ser capitalizado e a inspeção anterior deve ser baixada. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 8, "tema": "Mensuração inicial", "nivel": "Médio", "enunciado": "De acordo co
