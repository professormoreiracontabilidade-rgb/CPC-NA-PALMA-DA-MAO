<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 12 | Professor Moreira</title><link rel="stylesheet" href="../assets/cpc01.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>Quiz 12</h1><p>CPC 01 (R1) — Questões comentadas</p></div></header><nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc01-resumo.html">Resumo</a><a href="../mapas/cpc01-mapa.html">Mapa</a><a href="../casos/cpc01-casos.html">Casos</a><a href="../resumos/cpc01-flashcards.html">Flashcards</a><a href="../quizzes/cpc01-index.html">Quizzes</a><a href="../comentarios/cpc01-questoes.html">Questões</a><a href="../questoes/cpc01-banco.html">Banco</a></nav><main><section class="card" id="quiz"><p id="num"></p><h2 id="q"></h2><div id="opts"></div><div id="exp" class="tip hidden"></div><div class="toolbar"><button id="prev">← Voltar</button><button id="next">Avançar →</button></div></section></main><footer>Curso de Contabilidade Professor Moreira • WhatsApp 61 985323574</footer><script>const QUESTIONS=[{"id": 111, "tema": "Reversão no resultado", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre reversão no resultado.", "alternativas": ["A perda de goodwill deve ser revertida quando o mercado melhorar.", "Para ativo não reavaliado, a reversão é reconhecida imediatamente no resultado.", "O teste anual só ocorre quando há indício externo.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "A perda da UGC reduz primeiro os ativos circulantes."], "correta": 1, "comentario": "A alternativa correta decorre da seguinte regra: Para ativo não reavaliado, a reversão é reconhecida imediatamente no resultado. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 112, "tema": "Divulgação", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre divulgação.", "alternativas": ["A UGC é sempre definida como a entidade inteira.", "Devem ser divulgados valores de perdas e reversões, eventos, natureza do ativo, UGC, base do valor recuperável e premissas relevantes.", "A perda da UGC reduz primeiro os ativos circulantes.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "O valor contábil revisado não afeta a depreciação futura."], "correta": 1, "comentario": "A alternativa correta decorre da seguinte regra: Devem ser divulgados valores de perdas e reversões, eventos, natureza do ativo, UGC, base do valor recuperável e premissas relevantes. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 113, "tema": "Ativo corporativo", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre ativo corporativo.", "alternativas": ["Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "Ativo corporativo contribui para várias UGCs e deve ser alocado em base razoável e consistente quando possível.", "A perda da UGC reduz primeiro os ativos circulantes.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "A UGC é sempre definida como a entidade inteira."], "correta": 1, "comentario": "A alternativa correta decorre da seguinte regra: Ativo corporativo contribui para várias UGCs e deve ser alocado em base razoável e consistente quando possível. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 114, "tema": "Consistência da UGC", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre consistência da ugc.", "alternativas": ["A perda da UGC reduz primeiro os ativos circulantes.", "O valor recuperável é sempre o menor entre valor em uso e valor justo.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "UGCs devem ser identificadas consistentemente entre períodos, salvo justificativa para mudança."], "correta": 4, "comentario": "A alternativa correta decorre da seguinte regra: UGCs devem ser identificadas consistentemente entre períodos, salvo justificativa para mudança. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 115, "tema": "Mercado ativo interno", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre mercado ativo interno.", "alternativas": ["Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "Mesmo produção usada internamente pode formar UGC separada se houver mercado ativo para o produto.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "O valor contábil revisado não afeta a depreciação futura."], "correta": 1, "comentario": "A alternativa correta decorre da seguinte regra: Mesmo produção usada internamente pode formar UGC separada se houver mercado ativo para o produto. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 116, "tema": "Passivos na UGC", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre passivos na ugc.", "alternativas": ["Passivo reconhecido só é incluído se o valor recuperável não puder ser determinado sem considerá-lo.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "A UGC é sempre definida como a entidade inteira.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido."], "correta": 0, "comentario": "A alternativa correta decorre da seguinte regra: Passivo reconhecido só é incluído se o valor recuperável não puder ser determinado sem considerá-lo. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 117, "tema": "Teste em momentos diferentes", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre teste em momentos diferentes.", "alternativas": ["UGCs com goodwill podem ser testadas em épocas distintas, desde que anualmente e de forma consistente.", "O teste anual só ocorre quando há indício externo.", "O valor contábil revisado não afeta a depreciação futura.", "O valor recuperável é sempre o menor entre valor em uso e valor justo.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos."], "correta": 0, "comentario": "A alternativa correta decorre da seguinte regra: UGCs com goodwill podem ser testadas em épocas distintas, desde que anualmente e de forma consistente. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 118, "tema": "Aquisição no período", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre aquisição no período.", "alternativas": ["O valor recuperável é sempre o menor entre valor em uso e valor justo.", "Goodwill adquirido no período deve ser testado antes do encerramento desse período.", "A perda da UGC reduz primeiro os ativos circulantes.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "A UGC é sempre definida como a entidade inteira."], "correta": 1, "comentario": "A alternativa correta decorre da seguinte regra: Goodwill adquirido no período deve ser testado antes do encerramento desse período. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 119, "tema": "Sequência de testes", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre sequência de testes.", "alternativas": ["Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "O teste anual só ocorre quando há indício externo.", "Quando ativos da UGC também exigem teste individual, eles são testados antes da UGC com goodwill.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso."], "correta": 2, "comentario": "A alternativa correta decorre da seguinte regra: Quando ativos da UGC também exigem teste individual, eles são testados antes da UGC com goodwill. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 120, "tema": "Materialidade", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre materialidade.", "alternativas": ["Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "A materialidade pode dispensar nova estimativa quando cálculos anteriores mostram ampla folga e não houve mudança relevante.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "O teste anual só ocorre quando há indício externo.", "O valor recuperável é sempre o menor entre valor em uso e valor justo."], "correta": 1, "comentario": "A alternativa correta decorre da seguinte regra: A materialidade pode dispensar nova estimativa quando cálculos anteriores mostram ampla folga e não houve mudança relevante. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}]</script><script>const $=s=>document.querySelector(s);let i=0,score=0,answered=false;function draw(){const q=QUESTIONS[i];$('#num').textContent='Questão '+(i+1)+' de '+QUESTIONS.length;$('#q').textContent=q.enunciado;$('#opts').innerHTML=q.alternativas.map((a,j)=>`<button class="option" data-j="${j}">${String.fromCharCode(65+j)}) ${a}</button>`).join('');$('#exp').classList.add('hidden');answered=false;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(+b.dataset.j))}function answer(j){if(answered)return;answered=true;const q=QUESTIONS[i];if(j===q.correta)score++;document.querySelectorAll('.option').forEach((b,n)=>{if(n===q.correta)b.classList.add('correct');else if(n===j)b.classList.add('wrong')});$('#exp').textContent=q.comentario;$('#exp').classList.remove('hidden')}$('#next').onclick=()=>{if(i<QUESTIONS.length-1){i++;draw()}else{$('#quiz').innerHTML=`<section class="card"><h2>Resultado</h2><p>Você acertou ${score} de ${QUESTIONS.length} questões.</p><button onclick="location.reload()">Reiniciar</button></section>`}};$('#prev').onclick=()=>{if(i>0){i--;draw()}};draw();</script></body></html>
