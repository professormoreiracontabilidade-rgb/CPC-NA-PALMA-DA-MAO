ivo de divulgação, a natureza das participações ou os riscos associados."}, {"id": 15, "tema": "Não controladores materiais", "nivel": "Difícil", "enunciado": "De acordo com o CPC 45, assinale a alternativa correta sobre não controladores materiais.", "alternativas": ["Perdas não reconhecidas nunca são divulgadas.", "Informações podem ser agregadas sem limite.", "Mudança sem perda de controle não exige informação.", "Não é necessário divulgar julgamentos.", "Devem ser divulgadas informações específicas para cada controlada relevante."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 45: Devem ser divulgadas informações específicas para cada controlada relevante. As demais opções confundem o objetivo de divulgação, a natureza das participações ou os riscos associados."}, {"id": 16, "tema": "Informações resumidas da controlada", "nivel": "Fácil", "enunciado": "De acordo com o CPC 45, assinale a alternativa correta sobre informações resumidas da controlada.", "alternativas": ["Incluem ativos, passivos, resultado, resultado abrangente e fluxos de caixa.", "Informações podem ser agregadas sem limite.", "Joint ventures materiais dispensam informações resumidas.", "Suporte voluntário não precisa ser explicado.", "Não é necessário divulgar julgamentos."], "correta": 0, "comentario": "A alternativa correta decorre do CPC 45: Incluem ativos, passivos, resultado, resultado abrangente e fluxos de caixa. As demais opções confundem o objetivo de divulgação, a natureza das participações ou os riscos associados."}, {"id": 17, "tema": "Data diferente", "nivel": "Médio", "enunciado": "De acordo com o CPC 45, assinale a alternativa correta sobre data diferente.", "alternativas": ["Joint ventures materiais dispensam informações resumidas.", "Quando a controlada usa data diferente, divulgar a data e a razão.", "Perdas não reconhecidas nunca são divulgadas.", "Não é necessário divulgar julgamentos.", "Mudança sem perda de controle não exige informação."], "correta": 1,
