ações", "nivel": "Difícil", "enunciado": "De acordo com o CPC 45, assinale a alternativa correta sobre informações antes das eliminações.", "alternativas": ["Informações podem ser agregadas sem limite.", "Dados resumidos de controladas são apresentados antes das eliminações intragrupo.", "O CPC 45 trata do reconhecimento inicial de ativos.", "Joint ventures materiais dispensam informações resumidas.", "Não é necessário divulgar julgamentos."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 45: Dados resumidos de controladas são apresentados antes das eliminações intragrupo. As demais opções confundem o objetivo de divulgação, a natureza das participações ou os riscos associados."}, {"id": 43, "tema": "Conciliação", "nivel": "Fácil", "enunciado": "De acordo com o CPC 45, assinale a alternativa correta sobre conciliação.", "alternativas": ["Informações podem ser agregadas sem limite.", "O CPC 45 trata do reconhecimento inicial de ativos.", "Informações resumidas de joint ventures e coligadas devem ser conciliadas com o valor contábil do investimento.", "Não é necessário divulgar julgamentos.", "Entidades estruturadas não consolidadas não exigem divulgação."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 45: Informações resumidas de joint ventures e coligadas devem ser conciliadas com o valor contábil do investimento. As demais opções confundem o objetivo de divulgação, a natureza das participações ou os riscos associados."}, {"id": 44, "tema": "Mantidos para venda", "nivel": "Médio", "enunciado": "De acordo com o CPC 45, assinale a alternativa correta sobre mantidos para venda.", "alternativas": ["Mudança sem perda de controle não exige informação.", "Não é necessário divulgar julgamentos.", "Entidades estruturadas não consolidadas não exigem divulgação.", "Participações classificadas segundo o CPC 31 possuem dispensas específicas de informações resumidas.", "PNC material fica fora das notas."], "correta": 3, "comentario": "A alternativa correta decorre do CPC 45: Participações classificadas segundo o CPC 31 possuem dispensas específicas de informações resumidas. As demais opções confundem o objetivo de divulgação, a natureza das participações ou os riscos associados."}, {"id": 45, "tema": "Objetivo", "nivel": "Difícil", "enunciado": "De acordo com o CPC 45, assinale a alternativa correta sobre objetivo.", "alternativas": ["Exposição máxima à perda é irrelevante.", "PNC material fica fora das notas.", "O CPC 45 trata do reconhecimento inicial de ativos.", "Suporte voluntário não precisa ser explicado.", "Exigir divulgações que permitam avaliar a natureza, os riscos e os efeitos das participações em outras entidades."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 45: Exigir divulgações que permitam avaliar a natureza, os riscos e os efeitos das participações em outras entidades. As demais opções confundem o objetivo de divulgação, a natureza das participações ou os riscos associados."}, {"id": 46, "tema": "Participação em outra entidade", "nivel": "Fácil", "enunciado": "De acordo com o CPC 45, assinale a alternativa correta sobre participação em outra entidade.", "alternativas": ["Envolvimento contratual ou não contratual que expõe a entidade à variabilidade dos retornos da outra entidade.", "Exposição máxima à perda é irrelevante.", "Entidades estruturadas não consolidadas não exigem divulgação.", "Não é necessário divulgar julgamentos.", "Mudança sem perda de controle não exige informação."], "correta": 0, "comentario": "A alternativa correta decorre do CPC 45: Envolvimento contratual ou não contratual que expõe a entidade à variabilidade dos retornos da outra entidade. As demais opções confundem o objetivo de divulgação, a natureza das participações ou os riscos associados."}, {"id": 47, "tema": "Entidade estruturada", "nivel": "Médio", "enunciado": "De acordo com o CPC 45, assinale a alternativa correta sobre entidade estruturada.", "alternativas": ["Joint ventures va. As demais opções confundem o objetivo de divulgação, a natureza das participações ou os riscos associados."}, {"id": 50, "tema": "Mudança de julgamento", "nivel": "Médio", "enunciado": "De acordo com o CPC 45, assinale a alternativa correta sobre mudança de julgamento.", "alternativas": ["Suporte voluntário não precisa ser explicado.", "Entidades estruturadas não consolidadas não exigem divulgação.", "Exposição máxima à perda é irrelevante.", "PNC material fica fora das notas.", "Mudanças de fatos e circunstâncias que alterem conclusões devem ser divulgadas."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 45: Mudanças de fatos e circunstâncias que alterem conclusões devem ser divulgadas. As demais opções confundem o objetivo de divulgação, a natureza das participações ou os riscos associados."}];let i=0,s=0,a=false;function r(){let x=D[i];num.textContent='Questão '+(i+1)+' de '+D.length;q.textContent=x.enunciado;opts.innerHTML=x.alternativas.map((t,j)=>'<button onclick="ans('+j+')">'+String.fromCharCode(65+j)+') '+t+'</button>').join('');exp.classList.add('hidden');}function ans(j){if(a)return;a=true;let x=D[i];if(j===x.correta)s++;exp.textContent=(j===x.correta?'✓ Correto. ':'✗ Incorreto. ')+x.comentario;exp.classList.remove('hidden');}next.onclick=()=>{if(i<D.length-1){i++;a=false;r()}else document.querySelector('main').innerHTML='<section class="card"><h2>Resultado</h2><p>'+s+' acertos de '+D.length+'.</p><button onclick="location.reload()">Reiniciar</button></section>'};prev.onclick=()=>{if(i>0){i--;a=false;r()}};r();</script></body></html>
