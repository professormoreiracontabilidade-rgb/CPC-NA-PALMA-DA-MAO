reinamento sempre integra o custo.", "Receitas e custos de itens produzidos durante testes vão ao resultado.", "Terrenos sempre são depreciados.", "Componentes significativos não podem ser separados.", "Manutenção periódica aumenta o ativo."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 27: Receitas e custos de itens produzidos durante testes vão ao resultado. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 53, "tema": "Ativo construído internamente", "nivel": "Médio", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre ativo construído internamente.", "alternativas": ["Todo gasto com imobilizado deve ser capitalizado.", "A depreciação começa apenas quando há produção.", "Segue os mesmos princípios, sem lucro interno nem desperdício anormal.", "Componentes significativos não podem ser separados.", "Vida útil nunca é revisada."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 27: Segue os mesmos princípios, sem lucro interno nem desperdício anormal. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 54, "tema": "Pagamento a prazo", "nivel": "Difícil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre pagamento a prazo.", "alternativas": ["Componentes significativos não podem ser separados.", "Ganho na baixa é receita de venda.", "Treinamento sempre integra o custo.", "O custo é o equivalente à vista; diferença é juros, salvo capitalização permitida.", "Terrenos sempre são depreciados."], "correta": 3, "comentario": "A alternativa correta decorre do CPC 27: O custo é o equivalente à vista; diferença é juros, salvo capitalização permitida. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 55, "tema": "Permuta", "nivel": "Fácil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre permuta.", "alternativas": ["Treinamento sempre i
