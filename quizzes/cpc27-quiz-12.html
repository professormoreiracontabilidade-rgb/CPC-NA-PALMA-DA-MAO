<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 12 | Professor Moreira</title><link rel="stylesheet" href="../assets/cpc27.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>Quiz 12</h1><p>CPC 27 — Ativo Imobilizado</p></div></header><nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc27-resumo.html">Resumo</a><a href="../mapas/cpc27-mapa.html">Mapa</a><a href="../casos/cpc27-casos.html">Casos</a><a href="../resumos/cpc27-flashcards.html">Flashcards</a><a href="../quizzes/cpc27-index.html">Quizzes</a><a href="../comentarios/cpc27-questoes.html">Questões</a><a href="../questoes/cpc27-banco.html">Banco</a></nav><main><section class="card"><p id="num"></p><h2 id="q"></h2><div id="opts" class="answers"></div><div id="exp" class="note hidden"></div><div class="toolbar"><button id="prev">← Voltar</button><button id="next">Avançar →</button></div></section></main><footer>Curso de Contabilidade Professor Moreira • WhatsApp 61 985323574</footer><script>const D=[{"id": 111, "tema": "Baixa", "nivel": "Difícil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre baixa.", "alternativas": ["Ocorre na alienação ou quando não há benefícios futuros esperados.", "Impairment não se aplica ao imobilizado.", "A depreciação começa apenas quando há produção.", "Todo gasto com imobilizado deve ser capitalizado.", "Ganho na baixa é receita de venda."], "correta": 0, "comentario": "A alternativa correta decorre do CPC 27: Ocorre na alienação ou quando não há benefícios futuros esperados. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 112, "tema": "Ganho ou perda na baixa", "nivel": "Fácil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre ganho ou perda na baixa.", "alternativas": ["Treinamento sempre integra o custo.", "Diferença entre valor líquido da alienação e valor contábil.", "O método baseado em receita é recomendado.", "Ganho na baixa é receita de venda.", "Terrenos sempre são depreciados."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 27: Diferença entre valor líquido da alienação e valor contábil. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 113, "tema": "Venda de ativo alugado", "nivel": "Médio", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre venda de ativo alugado.", "alternativas": ["Impairment não se aplica ao imobilizado.", "Componentes significativos não podem ser separados.", "Pode haver transferência para estoque quando passa a ser mantido para venda na atividade normal.", "Ganho na baixa é receita de venda.", "Terrenos sempre são depreciados."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 27: Pode haver transferência para estoque quando passa a ser mantido para venda na atividade normal. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 114, "tema": "Divulgação", "nivel": "Difícil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre divulgação.", "alternativas": ["Terrenos sempre são depreciados.", "Vida útil nunca é revisada.", "A depreciação começa apenas quando há produção.", "Inclui critérios, métodos, vidas úteis, saldos, conciliações, restrições e compromissos.", "O método baseado em receita é recomendado."], "correta": 3, "comentario": "A alternativa correta decorre do CPC 27: Inclui critérios, métodos, vidas úteis, saldos, conciliações, restrições e compromissos. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 115, "tema": "Objetivo", "nivel": "Fácil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre objetivo.", "alternativas": ["Manutenção periódica aumenta o ativo.", "Treinamento sempre integra o custo.", "Ganho na baixa é receita de venda.", "O método baseado em receita é recomendado.", "Estabelecer o tratamento contábil do ativo imobilizado, incluindo reconhecimento, mensuração, depreciação, impairment e baixa."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 27: Estabelecer o tratamento contábil do ativo imobilizado, incluindo reconhecimento, mensuração, depreciação, impairment e baixa. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 116, "tema": "Ativo imobilizado", "nivel": "Médio", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre ativo imobilizado.", "alternativas": ["Item tangível mantido para produção, fornecimento, aluguel ou administração e esperado para uso por mais de um período.", "Manutenção periódica aumenta o ativo.", "Vida útil nunca é revisada.", "Ganho na baixa é receita de venda.", "O método baseado em receita é recomendado."], "correta": 0, "comentario": "A alternativa correta decorre do CPC 27: Item tangível mantido para produção, fornecimento, aluguel ou administração e esperado para uso por mais de um período. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 117, "tema": "Reconhecimento", "nivel": "Difícil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre reconhecimento.", "alternativas": ["Todo gasto com imobilizado deve ser capitalizado.", "O custo é reconhecido quando benefícios futuros são prováveis e o custo pode ser mensurado confiavelmente.", "Impairment não se aplica ao imobilizado.", "Componentes significativos não podem ser separados.", "Manutenção periódica aumenta o ativo."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 27: O custo é reconhecido quando benefícios futuros são prováveis e o custo pode ser mensurado confiavelmente. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 118, "tema": "Sobressalentes", "nivel": "Fácil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre sobressalentes.", "alternativas": ["Ganho na baixa é receita de venda.", "Todo gasto com imobilizado deve ser capitalizado.", "São imobilizado quando usados por mais de um período ou apenas em conexão com item do imobilizado.", "Componentes significativos não podem ser separados.", "Impairment não se aplica ao imobilizado."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 27: São imobilizado quando usados por mais de um período ou apenas em conexão com item do imobilizado. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 119, "tema": "Manutenção periódica", "nivel": "Médio", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre manutenção periódica.", "alternativas": ["Manutenção periódica aumenta o ativo.", "A depreciação começa apenas quando há produção.", "Impairment não se aplica ao imobilizado.", "É reconhecida no resultado quando incorrida.", "Ganho na baixa é receita de venda."], "correta": 3, "comentario": "A alternativa correta decorre do CPC 27: É reconhecida no resultado quando incorrida. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 120, "tema": "Substituição de partes", "nivel": "Difícil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre substituição de partes.", "alternativas": ["Componentes significativos não podem ser separados.", "Ganho na baixa é receita de venda.", "Impairment não se aplica ao imobilizado.", "O método baseado em receita é recomendado.", "É capitalizada se atender aos critérios, com baixa da parte substituída."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 27: É capitalizada se atender aos critérios, com baixa da parte substituída. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}];let i=0,s=0,a=false;function r(){let x=D[i];num.textContent='Questão '+(i+1)+' de '+D.length;q.textContent=x.enunciado;opts.innerHTML=x.alternativas.map((t,j)=>'<button onclick="ans('+j+')">'+String.fromCharCode(65+j)+') '+t+'</button>').join('');exp.classList.add('hidden');}function ans(j){if(a)return;a=true;let x=D[i];if(j===x.correta)s++;exp.textContent=(j===x.correta?'✓ Correto. ':'✗ Incorreto. ')+x.comentario;exp.classList.remove('hidden');}next.onclick=()=>{if(i<D.length-1){i++;a=false;r()}else document.querySelector('main').innerHTML='<section class="card"><h2>Resultado</h2><p>'+s+' acertos de '+D.length+'.</p><button onclick="location.reload()">Reiniciar</button></section>'};prev.onclick=()=>{if(i>0){i--;a=false;r()}};r();</script></body></html>
