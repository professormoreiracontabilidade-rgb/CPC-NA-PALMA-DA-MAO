ativa correta sobre transações upstream.", "alternativas": ["20% sempre significa controle.", "Transações upstream nunca exigem eliminação.", "Venda da investida para o investidor; elimina-se a parcela do investidor no resultado não realizado.", "O investimento não está sujeito a impairment.", "A defasagem entre datas pode ser ilimitada."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 18: Venda da investida para o investidor; elimina-se a parcela do investidor no resultado não realizado. As demais opções confundem influência significativa, MEP, dividendos, transações ou impairment."}, {"id": 109, "tema": "Transações downstream", "nivel": "Fácil", "enunciado": "De acordo com o CPC 18 (R3), assinale a alternativa correta sobre transações downstream.", "alternativas": ["Joint venture significa controle individual.", "Políticas contábeis diferentes não precisam de ajuste.", "O goodwill deve ser amortizado.", "Venda do investidor para a investida; elimina-se a parcela do investidor no resultado não realizado.", "20% sempre significa controle."], "correta": 3, "comentario": "A alternativa correta decorre do CPC 18: Venda do investidor para a investida; elimina-se a parcela do investidor no resultado não realizado. As demais opções confundem influência significativa, MEP, dividendos, transações ou impairment."}, {"id": 110, "tema": "Negócio em transação downstream", "nivel": "Médio", "enunciado": "De acordo com o CPC 18 (R3), assinale a alternativa correta sobre negócio em transação downstream.", "alternativas": ["O MEP reconhece somente dividendos.", "Prejuízos continuam indefinidamente abaixo de zero.", "A defasagem entre datas pode ser ilimitada.", "Joint venture significa controle individual.", "Se os ativos constituem negócio, o ganho ou perda pode ser reconhecido integralmente."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 18: Se os ativos constituem negócio, o ganho ou perda pode ser reconhecido integralmente. As demais op
