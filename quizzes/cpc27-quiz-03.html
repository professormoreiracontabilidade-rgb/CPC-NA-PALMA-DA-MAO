o sempre integra o custo.", "Manutenção periódica aumenta o ativo.", "Terrenos sempre são depreciados."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 27: Quando o ativo está disponível para uso. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 23, "tema": "Fim da depreciação", "nivel": "Médio", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre fim da depreciação.", "alternativas": ["Ganho na baixa é receita de venda.", "Manutenção periódica aumenta o ativo.", "Na classificação como mantido para venda ou baixa, o que ocorrer primeiro.", "Treinamento sempre integra o custo.", "Impairment não se aplica ao imobilizado."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 27: Na classificação como mantido para venda ou baixa, o que ocorrer primeiro. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 24, "tema": "Ociosidade", "nivel": "Difícil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre ociosidade.", "alternativas": ["Todo gasto com imobilizado deve ser capitalizado.", "Manutenção periódica aumenta o ativo.", "Terrenos sempre são depreciados.", "Não interrompe a depreciação, salvo método baseado em uso sem produção.", "Vida útil nunca é revisada."], "correta": 3, "comentario": "A alternativa correta decorre do CPC 27: Não interrompe a depreciação, salvo método baseado em uso sem produção. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 25, "tema": "Vida útil", "nivel": "Fácil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre vida útil.", "alternativas": ["Ganho na baixa é receita de venda.", "Impairment não se aplica ao imobilizado.", "Treinamento sempre integra o custo.", "Todo gasto com imobilizado deve ser capitalizado.", "Período de uso esperado ou unidades de produção esperadas."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 27: Período de uso esperado ou unidades de produção esperadas. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 26, "tema": "Valor residual", "nivel": "Médio", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre valor residual.", "alternativas": ["Estimativa líquida de venda ao fim da vida útil.", "Componentes significativos não podem ser separados.", "Todo gasto com imobilizado deve ser capitalizado.", "O método baseado em receita é recomendado.", "Vida útil nunca é revisada."], "correta": 0, "comentario": "A alternativa correta decorre do CPC 27: Estimativa líquida de venda ao fim da vida útil. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 27, "tema": "Revisão anual", "nivel": "Difícil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre revisão anual.", "alternativas": ["Terrenos sempre são depreciados.", "Vida útil, valor residual e método são revisados ao menos anualmente.", "Manutenção periódica aumenta o ativo.", "Treinamento sempre integra o custo.", "Todo gasto com imobilizado deve ser capitalizado."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 27: Vida útil, valor residual e método são revisados ao menos anualmente. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 28, "tema": "Método linear", "nivel": "Fácil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre método linear.", "alternativas": ["Impairment não se aplica ao imobilizado.", "Vida útil nunca é revisada.", "Gera despesa constante se o residual não mudar.", "Componentes significativos não podem ser separados.", "O método baseado em receita é recomendado."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 27: Gera despesa constante se o residual não mudar. As demais opções confundem reconhecimento, custo, depreciação, i
