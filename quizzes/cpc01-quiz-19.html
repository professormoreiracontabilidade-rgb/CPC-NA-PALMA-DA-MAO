<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 19 | Professor Moreira</title><link rel="stylesheet" href="../assets/cpc01.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>Quiz 19</h1><p>CPC 01 (R1) — Questões comentadas</p></div></header><nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc01-resumo.html">Resumo</a><a href="../mapas/cpc01-mapa.html">Mapa</a><a href="../casos/cpc01-casos.html">Casos</a><a href="../resumos/cpc01-flashcards.html">Flashcards</a><a href="../quizzes/cpc01-index.html">Quizzes</a><a href="../comentarios/cpc01-questoes.html">Questões</a><a href="../questoes/cpc01-banco.html">Banco</a></nav><main><section class="card" id="quiz"><p id="num"></p><h2 id="q"></h2><div id="opts"></div><div id="exp" class="tip hidden"></div><div class="toolbar"><button id="prev">← Voltar</button><button id="next">Avançar →</button></div></section></main><footer>Curso de Contabilidade Professor Moreira • WhatsApp 61 985323574</footer><script>const QUESTIONS=[{"id": 181, "tema": "Resultado", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre resultado.", "alternativas": ["A perda da UGC reduz primeiro os ativos circulantes.", "O teste anual só ocorre quando há indício externo.", "A perda de ativo não reavaliado é reconhecida imediatamente no resultado.", "A taxa de desconto do valor em uso deve ser após os impostos.", "A perda de goodwill deve ser revertida quando o mercado melhorar."], "correta": 2, "comentario": "A alternativa correta decorre da seguinte regra: A perda de ativo não reavaliado é reconhecida imediatamente no resultado. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 182, "tema": "Ativo reavaliado", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre ativo reavaliado.", "alternativas": ["A perda é tratada como redução da reavaliação, até o limite do saldo relacionado, e o excedente afeta o resultado.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "A UGC é sempre definida como a entidade inteira.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido."], "correta": 0, "comentario": "A alternativa correta decorre da seguinte regra: A perda é tratada como redução da reavaliação, até o limite do saldo relacionado, e o excedente afeta o resultado. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 183, "tema": "Depreciação posterior", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre depreciação posterior.", "alternativas": ["O valor contábil revisado não afeta a depreciação futura.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "Após a perda, depreciação, amortização ou exaustão é recalculada sobre o valor contábil revisado.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "A perda da UGC reduz primeiro os ativos circulantes."], "correta": 2, "comentario": "A alternativa correta decorre da seguinte regra: Após a perda, depreciação, amortização ou exaustão é recalculada sobre o valor contábil revisado. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 184, "tema": "Goodwill", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre goodwill.", "alternativas": ["A perda da UGC reduz primeiro os ativos circulantes.", "O teste anual só ocorre quando há indício externo.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "O goodwill adquirido é alocado às UGCs ou grupos de UGCs beneficiados pelas sinergias da combinação.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos."], "correta": 3, "comentario": "A alternativa correta decorre da seguinte regra: O goodwill adquirido é alocado às UGCs ou grupos de UGCs beneficiados pelas sinergias da combinação. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 185, "tema": "Limite da UGC com goodwill", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre limite da ugc com goodwill.", "alternativas": ["A taxa de desconto do valor em uso deve ser após os impostos.", "A UGC é sempre definida como a entidade inteira.", "Cada unidade ou grupo não pode ser maior que um segmento operacional antes da agregação.", "O valor recuperável é sempre o menor entre valor em uso e valor justo.", "A perda de goodwill deve ser revertida quando o mercado melhorar."], "correta": 2, "comentario": "A alternativa correta decorre da seguinte regra: Cada unidade ou grupo não pode ser maior que um segmento operacional antes da agregação. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 186, "tema": "Ordem na UGC", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre ordem na ugc.", "alternativas": ["Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "A perda da UGC reduz primeiro o goodwill e depois os demais ativos proporcionalmente.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "A taxa de desconto do valor em uso deve ser após os impostos.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido."], "correta": 1, "comentario": "A alternativa correta decorre da seguinte regra: A perda da UGC reduz primeiro o goodwill e depois os demais ativos proporcionalmente. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 187, "tema": "Piso de alocação", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre piso de alocação.", "alternativas": ["Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "A perda da UGC reduz primeiro os ativos circulantes.", "O teste anual só ocorre quando há indício externo.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "Nenhum ativo é reduzido abaixo do maior entre valor justo líquido de despesas de alienação, valor em uso determinável e zero."], "correta": 4, "comentario": "A alternativa correta decorre da seguinte regra: Nenhum ativo é reduzido abaixo do maior entre valor justo líquido de despesas de alienação, valor em uso determinável e zero. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 188, "tema": "Reversão", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre reversão.", "alternativas": ["A UGC é sempre definida como a entidade inteira.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "A entidade avalia em cada reporte se perdas anteriores, exceto goodwill, deixaram de existir ou diminuíram.", "O teste anual só ocorre quando há indício externo.", "A taxa de desconto do valor em uso deve ser após os impostos."], "correta": 2, "comentario": "A alternativa correta decorre da seguinte regra: A entidade avalia em cada reporte se perdas anteriores, exceto goodwill, deixaram de existir ou diminuíram. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 189, "tema": "Limite da reversão", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre limite da reversão.", "alternativas": ["A perda da UGC reduz primeiro os ativos circulantes.", "O teste anual só ocorre quando há indício externo.", "O valor contábil revisado não afeta a depreciação futura.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "A reversão não pode elevar o ativo acima do valor contábil que existiria sem a perda anterior."], "correta": 4, "comentario": "A alternativa correta decorre da seguinte regra: A reversão não pode elevar o ativo acima do valor contábil que existiria sem a perda anterior. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 190, "tema": "Goodwill sem reversão", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre goodwill sem reversão.", "alternativas": ["Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "A taxa de desconto do valor em uso deve ser após os impostos.", "O valor contábil revisado não afeta a depreciação futura.", "O teste anual só ocorre quando há indício externo.", "Perda por desvalorização reconhecida para goodwill não é revertida em período posterior."], "correta": 4, "comentario": "A alternativa correta decorre da seguinte regra: Perda por desvalorização reconhecida para goodwill não é revertida em período posterior. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}]</script><script>const $=s=>document.querySelector(s);let i=0,score=0,answered=false;function draw(){const q=QUESTIONS[i];$('#num').textContent='Questão '+(i+1)+' de '+QUESTIONS.length;$('#q').textContent=q.enunciado;$('#opts').innerHTML=q.alternativas.map((a,j)=>`<button class="option" data-j="${j}">${String.fromCharCode(65+j)}) ${a}</button>`).join('');$('#exp').classList.add('hidden');answered=false;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(+b.dataset.j))}function answer(j){if(answered)return;answered=true;const q=QUESTIONS[i];if(j===q.correta)score++;document.querySelectorAll('.option').forEach((b,n)=>{if(n===q.correta)b.classList.add('correct');else if(n===j)b.classList.add('wrong')});$('#exp').textContent=q.comentario;$('#exp').classList.remove('hidden')}$('#next').onclick=()=>{if(i<QUESTIONS.length-1){i++;draw()}else{$('#quiz').innerHTML=`<section class="card"><h2>Resultado</h2><p>Você acertou ${score} de ${QUESTIONS.length} questões.</p><button onclick="location.reload()">Reiniciar</button></section>`}};$('#prev').onclick=()=>{if(i>0){i--;draw()}};draw();</script></body></html>
