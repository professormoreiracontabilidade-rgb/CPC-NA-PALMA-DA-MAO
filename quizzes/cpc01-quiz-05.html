<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 05 | Professor Moreira</title><link rel="stylesheet" href="../assets/cpc01.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>Quiz 05</h1><p>CPC 01 (R1) — Questões comentadas</p></div></header><nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc01-resumo.html">Resumo</a><a href="../mapas/cpc01-mapa.html">Mapa</a><a href="../casos/cpc01-casos.html">Casos</a><a href="../resumos/cpc01-flashcards.html">Flashcards</a><a href="../quizzes/cpc01-index.html">Quizzes</a><a href="../comentarios/cpc01-questoes.html">Questões</a><a href="../questoes/cpc01-banco.html">Banco</a></nav><main><section class="card" id="quiz"><p id="num"></p><h2 id="q"></h2><div id="opts"></div><div id="exp" class="tip hidden"></div><div class="toolbar"><button id="prev">← Voltar</button><button id="next">Avançar →</button></div></section></main><footer>Curso de Contabilidade Professor Moreira • WhatsApp 61 985323574</footer><script>const QUESTIONS=[{"id": 41, "tema": "Objetivo", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre objetivo.", "alternativas": ["O valor contábil revisado não afeta a depreciação futura.", "A taxa de desconto do valor em uso deve ser após os impostos.", "O CPC 01 assegura que ativos não sejam registrados por valor superior ao montante recuperável pelo uso ou pela venda.", "O teste anual só ocorre quando há indício externo.", "A UGC é sempre definida como a entidade inteira."], "correta": 2, "comentario": "A alternativa correta decorre da seguinte regra: O CPC 01 assegura que ativos não sejam registrados por valor superior ao montante recuperável pelo uso ou pela venda. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 42, "tema": "Valor recuperável", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre valor recuperável.", "alternativas": ["O teste anual só ocorre quando há indício externo.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "O valor recuperável é sempre o menor entre valor em uso e valor justo.", "É o maior entre o valor justo líquido de despesas de alienação e o valor em uso."], "correta": 4, "comentario": "A alternativa correta decorre da seguinte regra: É o maior entre o valor justo líquido de despesas de alienação e o valor em uso. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 43, "tema": "Perda por desvalorização", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre perda por desvalorização.", "alternativas": ["A perda da UGC reduz primeiro os ativos circulantes.", "É o excesso do valor contábil de um ativo ou UGC sobre seu valor recuperável.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "O valor contábil revisado não afeta a depreciação futura."], "correta": 1, "comentario": "A alternativa correta decorre da seguinte regra: É o excesso do valor contábil de um ativo ou UGC sobre seu valor recuperável. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 44, "tema": "Valor em uso", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre valor em uso.", "alternativas": ["Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "É o valor presente dos fluxos de caixa futuros esperados do ativo ou da UGC.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "A taxa de desconto do valor em uso deve ser após os impostos.", "O teste anual só ocorre quando há indício externo."], "correta": 1, "comentario": "A alternativa correta decorre da seguinte regra: É o valor presente dos fluxos de caixa futuros esperados do ativo ou da UGC. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 45, "tema": "UGC", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre ugc.", "alternativas": ["A UGC é sempre definida como a entidade inteira.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "O valor contábil revisado não afeta a depreciação futura.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "É o menor grupo identificável de ativos que gera entradas de caixa em grande parte independentes."], "correta": 4, "comentario": "A alternativa correta decorre da seguinte regra: É o menor grupo identificável de ativos que gera entradas de caixa em grande parte independentes. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 46, "tema": "Teste por indicação", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre teste por indicação.", "alternativas": ["Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "A perda da UGC reduz primeiro os ativos circulantes.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "Ao final de cada período de reporte, a entidade avalia se há indicação de desvalorização."], "correta": 4, "comentario": "A alternativa correta decorre da seguinte regra: Ao final de cada período de reporte, a entidade avalia se há indicação de desvalorização. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 47, "tema": "Teste anual obrigatório", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre teste anual obrigatório.", "alternativas": ["O valor recuperável é sempre o menor entre valor em uso e valor justo.", "Goodwill, intangível de vida útil indefinida e intangível ainda não disponível para uso são testados pelo menos anualmente.", "A UGC é sempre definida como a entidade inteira.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos."], "correta": 1, "comentario": "A alternativa correta decorre da seguinte regra: Goodwill, intangível de vida útil indefinida e intangível ainda não disponível para uso são testados pelo menos anualmente. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 48, "tema": "Fontes externas", "nivel": "Difícil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre fontes externas.", "alternativas": ["Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "Fluxos de financiamento devem integrar obrigatoriamente o valor em uso.", "A perda de goodwill deve ser revertida quando o mercado melhorar.", "Queda relevante de valor, mudanças adversas, alta de juros e valor contábil do patrimônio superior ao valor de mercado são indícios externos."], "correta": 4, "comentario": "A alternativa correta decorre da seguinte regra: Queda relevante de valor, mudanças adversas, alta de juros e valor contábil do patrimônio superior ao valor de mercado são indícios externos. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 49, "tema": "Fontes internas", "nivel": "Fácil", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre fontes internas.", "alternativas": ["A taxa de desconto do valor em uso deve ser após os impostos.", "O teste anual só ocorre quando há indício externo.", "A perda da UGC reduz primeiro os ativos circulantes.", "Obsolescência, dano físico, ociosidade, reestruturação, baixa antecipada e desempenho pior que o esperado são indícios internos.", "O valor recuperável é sempre o menor entre valor em uso e valor justo."], "correta": 3, "comentario": "A alternativa correta decorre da seguinte regra: Obsolescência, dano físico, ociosidade, reestruturação, baixa antecipada e desempenho pior que o esperado são indícios internos. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}, {"id": 50, "tema": "Ativo individual", "nivel": "Médio", "enunciado": "Considerando o CPC 01 (R1), assinale a alternativa correta sobre ativo individual.", "alternativas": ["Reestruturações futuras não aprovadas devem sempre integrar os fluxos.", "O valor recuperável é sempre o menor entre valor em uso e valor justo.", "O valor contábil revisado não afeta a depreciação futura.", "Toda perda de impairment é reconhecida diretamente no patrimônio líquido.", "O valor recuperável é apurado individualmente quando o ativo gera entradas independentes; caso contrário, usa-se a UGC."], "correta": 4, "comentario": "A alternativa correta decorre da seguinte regra: O valor recuperável é apurado individualmente quando o ativo gera entradas independentes; caso contrário, usa-se a UGC. As demais contradizem o pronunciamento ou generalizam tratamento que não é permitido."}]</script><script>const $=s=>document.querySelector(s);let i=0,score=0,answered=false;function draw(){const q=QUESTIONS[i];$('#num').textContent='Questão '+(i+1)+' de '+QUESTIONS.length;$('#q').textContent=q.enunciado;$('#opts').innerHTML=q.alternativas.map((a,j)=>`<button class="option" data-j="${j}">${String.fromCharCode(65+j)}) ${a}</button>`).join('');$('#exp').classList.add('hidden');answered=false;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(+b.dataset.j))}function answer(j){if(answered)return;answered=true;const q=QUESTIONS[i];if(j===q.correta)score++;document.querySelectorAll('.option').forEach((b,n)=>{if(n===q.correta)b.classList.add('correct');else if(n===j)b.classList.add('wrong')});$('#exp').textContent=q.comentario;$('#exp').classList.remove('hidden')}$('#next').onclick=()=>{if(i<QUESTIONS.length-1){i++;draw()}else{$('#quiz').innerHTML=`<section class="card"><h2>Resultado</h2><p>Você acertou ${score} de ${QUESTIONS.length} questões.</p><button onclick="location.reload()">Reiniciar</button></section>`}};$('#prev').onclick=()=>{if(i>0){i--;draw()}};draw();</script></body></html>
