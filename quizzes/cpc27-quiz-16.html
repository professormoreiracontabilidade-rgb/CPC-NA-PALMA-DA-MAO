<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 16 | Professor Moreira</title><link rel="stylesheet" href="../assets/cpc27.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>Quiz 16</h1><p>CPC 27 — Ativo Imobilizado</p></div></header><nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc27-resumo.html">Resumo</a><a href="../mapas/cpc27-mapa.html">Mapa</a><a href="../casos/cpc27-casos.html">Casos</a><a href="../resumos/cpc27-flashcards.html">Flashcards</a><a href="../quizzes/cpc27-index.html">Quizzes</a><a href="../comentarios/cpc27-questoes.html">Questões</a><a href="../questoes/cpc27-banco.html">Banco</a></nav><main><section class="card"><p id="num"></p><h2 id="q"></h2><div id="opts" class="answers"></div><div id="exp" class="note hidden"></div><div class="toolbar"><button id="prev">← Voltar</button><button id="next">Avançar →</button></div></section></main><footer>Curso de Contabilidade Professor Moreira • WhatsApp 61 985323574</footer><script>const D=[{"id": 151, "tema": "Venda de ativo alugado", "nivel": "Fácil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre venda de ativo alugado.", "alternativas": ["Pode haver transferência para estoque quando passa a ser mantido para venda na atividade normal.", "A depreciação começa apenas quando há produção.", "Terrenos sempre são depreciados.", "Todo gasto com imobilizado deve ser capitalizado.", "Componentes significativos não podem ser separados."], "correta": 0, "comentario": "A alternativa correta decorre do CPC 27: Pode haver transferência para estoque quando passa a ser mantido para venda na atividade normal. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 152, "tema": "Divulgação", "nivel": "Médio", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre divulgação.", "alternativas": ["Todo gasto com imobilizado deve ser capitalizado.", "Inclui critérios, métodos, vidas úteis, saldos, conciliações, restrições e compromissos.", "Treinamento sempre integra o custo.", "Componentes significativos não podem ser separados.", "A depreciação começa apenas quando há produção."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 27: Inclui critérios, métodos, vidas úteis, saldos, conciliações, restrições e compromissos. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 153, "tema": "Objetivo", "nivel": "Difícil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre objetivo.", "alternativas": ["Manutenção periódica aumenta o ativo.", "Vida útil nunca é revisada.", "Estabelecer o tratamento contábil do ativo imobilizado, incluindo reconhecimento, mensuração, depreciação, impairment e baixa.", "Impairment não se aplica ao imobilizado.", "Treinamento sempre integra o custo."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 27: Estabelecer o tratamento contábil do ativo imobilizado, incluindo reconhecimento, mensuração, depreciação, impairment e baixa. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 154, "tema": "Ativo imobilizado", "nivel": "Fácil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre ativo imobilizado.", "alternativas": ["Ganho na baixa é receita de venda.", "O método baseado em receita é recomendado.", "Vida útil nunca é revisada.", "Item tangível mantido para produção, fornecimento, aluguel ou administração e esperado para uso por mais de um período.", "Terrenos sempre são depreciados."], "correta": 3, "comentario": "A alternativa correta decorre do CPC 27: Item tangível mantido para produção, fornecimento, aluguel ou administração e esperado para uso por mais de um período. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 155, "tema": "Reconhecimento", "nivel": "Médio", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre reconhecimento.", "alternativas": ["Manutenção periódica aumenta o ativo.", "Vida útil nunca é revisada.", "Impairment não se aplica ao imobilizado.", "Treinamento sempre integra o custo.", "O custo é reconhecido quando benefícios futuros são prováveis e o custo pode ser mensurado confiavelmente."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 27: O custo é reconhecido quando benefícios futuros são prováveis e o custo pode ser mensurado confiavelmente. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 156, "tema": "Sobressalentes", "nivel": "Difícil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre sobressalentes.", "alternativas": ["São imobilizado quando usados por mais de um período ou apenas em conexão com item do imobilizado.", "Vida útil nunca é revisada.", "Todo gasto com imobilizado deve ser capitalizado.", "Impairment não se aplica ao imobilizado.", "Terrenos sempre são depreciados."], "correta": 0, "comentario": "A alternativa correta decorre do CPC 27: São imobilizado quando usados por mais de um período ou apenas em conexão com item do imobilizado. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"id": 157, "tema": "Manutenção periódica", "nivel": "Fácil", "enunciado": "De acordo com o CPC 27, assinale a alternativa correta sobre manutenção periódica.", "alternativas": ["Manutenção periódica aumenta o ativo.", "É reconhecida no resultado quando incorrida.", "Terrenos sempre são depreciados.", "A depreciação começa apenas quando há produção.", "Treinamento sempre integra o custo."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 27: É reconhecida no resultado quando incorrida. As demais opções confundem reconhecimento, custo, depreciação, impairment ou baixa."}, {"i
