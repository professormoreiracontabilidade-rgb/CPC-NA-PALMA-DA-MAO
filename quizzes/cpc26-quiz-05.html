empre circulantes.", "Dividendo proposto ou declarado antes da autorização e não reconhecido deve ser divulgado.", "Comparativos são dispensáveis.", "A DFC usa regime de competência.", "Continuidade considera apenas três meses."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 26: Dividendo proposto ou declarado antes da autorização e não reconhecido deve ser divulgado. As demais opções contrariam os princípios de apresentação, classificação ou divulgação."}, {"id": 43, "tema": "Domicílio", "nivel": "Fácil", "enunciado": "De acordo com o CPC 26 (R1), assinale a alternativa correta sobre domicílio.", "alternativas": ["Itens extraordinários são obrigatórios.", "Política inadequada é corrigida apenas por nota.", "Devem ser divulgados domicílio, forma jurídica, país e endereço da sede.", "A DFC usa regime de competência.", "A declaração de conformidade pode ser parcial."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 26: Devem ser divulgados domicílio, forma jurídica, país e endereço da sede. As demais opções contrariam os princípios de apresentação, classificação ou divulgação."}, {"id": 44, "tema": "Prazo de duração", "nivel": "Médio", "enunciado": "De acordo com o CPC 26 (R1), assinale a alternativa correta sobre prazo de duração.", "alternativas": ["Comparativos são dispensáveis.", "Itens extraordinários são obrigatórios.", "A compensação é sempre permitida.", "Deve ser divulgado quando a entidade tiver prazo de duração limitado.", "Continuidade considera apenas três meses."], "correta": 3, "comentario": "A alternativa correta decorre do CPC 26: Deve ser divulgado quando a entidade tiver prazo de duração limitado. As demais opções contrariam os princípios de apresentação, classificação ou divulgação."}, {"id": 45, "tema": "Objetivo", "nivel": "Difícil", "enunciado": "De acordo com o CPC 26 (R1), assinale a alternativa correta sobre objetivo.", "alternativas": ["A compensação é sempre permitida.", "A DFC usa regime de competência.", "Política inadequada é corrigida apenas por nota.", "Informação imaterial deve sempre ser separada.", "Definir a base de apresentação para assegurar comparabilidade entre períodos e entre entidades."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 26: Definir a base de apresentação para assegurar comparabilidade entre períodos e entre entidades. As demais opções contrariam os princípios de apresentação, classificação ou divulgação."}, {"id": 46, "tema": "Demonstrações de propósito geral", "nivel": "Fácil", "enunciado": "De acordo com o CPC 26 (R1), assinale a alternativa correta sobre demonstrações de propósito geral.", "alternativas": ["Atendem usuários externos que não podem exigir relatórios personalizados.", "A compensação é sempre permitida.", "A declaração de conformidade pode ser parcial.", "A DFC usa regime de competência.", "Impostos diferidos são sempre circulantes."], "correta": 0, "comentario": "A alternativa correta decorre do CPC 26: Atendem usuários externos que não podem exigir relatórios personalizados. As demais opções contrariam os princípios de apresentação, classificação ou divulgação."}, {"id": 47, "tema": "Materialidade", "nivel": "Médio", "enunciado": "De acordo com o CPC 26 (R1), assinale a alternativa correta sobre materialidade.", "alternativas": ["Informação imaterial deve sempre ser separada.", "Informação é material quando sua omissão, distorção ou obscuridade pode influenciar decisões.", "Impostos diferidos são sempre circulantes.", "Itens extraordinários são obrigatórios.", "Comparativos são dispensáveis."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 26: Informação é material quando sua omissão, distorção ou obscuridade pode influenciar decisões. As demais opções contrariam os princípios de apresentação, classificação ou divulgação."}, {"id": 48, "tema": "Notas explicativas", "nivel": "Difícil", "enunciado": "De acordo com o CPC 26 (R1), assinale a alternativa correta sobre notas explicativas.", "alternativas": ["Comparativos são dispensáveis.", "Notas não fazem parte do conjunto completo.", "Trazem descrições, desagregações e informações sobre itens não reconhecidos nas demonstrações.", "A compensação é sempre permitida.", "Itens extraordinários são obrigatórios."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 26: Trazem descrições, desagregações e informações sobre itens não reconhecidos nas demonstrações. As demais opções contrariam os princípios de apresentação, classificação ou divulgação."}, {"id": 49, "tema": "Resultado do período", "nivel": "Fácil", "enunciado": "De acordo com o CPC 26 (R1), assinale a alternativa correta sobre resultado do período.", "alternativas": ["A DFC usa regime de competência.", "A declaração de conformidade pode ser parcial.", "Política inadequada é corrigida apenas por nota.", "Total das receitas menos despesas, exceto itens reconhecidos em outros resultados abrangentes.", "A compensação é sempre permitida."], "correta": 3, "comentario": "A alternativa correta decorre do CPC 26: Total das receitas menos despesas, exceto itens reconhecidos em outros resultados abrangentes. As demais opções contrariam os princípios de apresentação, classificação ou divulgação."}, {"id": 50, "tema": "Outros resultados abrangentes", "nivel": "Médio", "enunciado": "De acordo com o CPC 26 (R1), assinale a alternativa correta sobre outros resultados abrangentes.", "alternativas": ["Continuidade considera apenas três meses.", "Informação imaterial deve sempre ser separada.", "Comparativos são dispensáveis.", "Notas não fazem parte do conjunto completo.", "Receitas e despesas não reconhecidas no resultado conforme exigido ou permitido pelos CPCs."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 26: Receitas e despesas não reconhecidas no resultado conforme exigido ou permitido pelos CPCs. As demais opções contrariam os princípios de apresentação, classificação ou divulgação."}];let i=0,s=0,a=false;function r(){let x=D[i];num.textContent='Questão '+(i+1)+' de '+D.length;q.textContent=x.enunciado;opts.innerHTML=x.alternativas.map((t,j)=>'<button onclick="ans('+j+')">'+String.fromCharCode(65+j)+') '+t+'</button>').join('');exp.classList.add('hidden');}function ans(j){if(a)return;a=true;let x=D[i];if(j===x.correta)s++;exp.textContent=(j===x.correta?'✓ Correto. ':'✗ Incorreto. ')+x.comentario;exp.classList.remove('hidden');}next.onclick=()=>{if(i<D.length-1){i++;a=false;r()}else document.querySelector('main').innerHTML='<section class="card"><h2>Resultado</h2><p>'+s+' acertos de '+D.length+'.</p><button onclick="location.reload()">Reiniciar</button></section>'};prev.onclick=()=>{if(i>0){i--;a=false;r()}};r();</script></body></html>
