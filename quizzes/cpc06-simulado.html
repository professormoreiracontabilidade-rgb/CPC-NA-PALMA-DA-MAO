assivo e o valor nominal sem desconto.", "Retroarrendamento sempre e venda.", "Arrendamento de 12 meses ou menos na data de inicio e sem opcao de compra."], "correta": 4, "comentario": "A regra correta e: Arrendamento de 12 meses ou menos na data de inicio e sem opcao de compra. As demais alternativas contrariam o pronunciamento."}, {"id": 6, "tema": "Baixo valor", "nivel": "Dificil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre baixo valor.", "alternativas": ["A isencao pode ser aplicada arrendamento por arrendamento a ativos subjacentes de baixo valor.", "Todo servico contem arrendamento.", "Taxa incremental e proibida.", "Direito de uso nao deprecia.", "Variavel por vendas sempre entra no passivo."], "correta": 0, "comentario": "A regra correta e: A isencao pode ser aplicada arrendamento por arrendamento a ativos subjacentes de baixo valor. As demais alternativas contrariam o pronunciamento."}, {"id": 7, "tema": "Isencao", "nivel": "Facil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre isencao.", "alternativas": ["Todo servico contem arrendamento.", "Pagamentos de curto prazo ou baixo valor podem ser reconhecidos como despesa linear ou em base sistematica apropriada.", "O passivo e o valor nominal sem desconto.", "Principal e fluxo operacional.", "Curto prazo sempre tem opcao de compra."], "correta": 1, "comentario": "A regra correta e: Pagamentos de curto prazo ou baixo valor podem ser reconhecidos como despesa linear ou em base sistematica apropriada. As demais alternativas contrariam o pronunciamento."}, {"id": 8, "tema": "Componentes", "nivel": "Medio", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre componentes.", "alternativas": ["O passivo e o valor nominal sem desconto.", "Variavel por vendas sempre entra no passivo.", "Componentes de arrendamento sao separados dos componentes de nao arrendamento, salvo expediente pratico.", "Principal e fluxo operacional.", "Retroarrendamento vos, custos diretos e restauracao. As demais alternativas contrariam o pronunciamento."}, {"id": 12, "tema": "Passivo inicial", "nivel": "Dificil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre passivo inicial.", "alternativas": ["O arrendador nao classifica arrendamentos.", "E mensurado pelo valor presente dos pagamentos ainda nao efetuados.", "Taxa incremental e proibida.", "Todo arrendamento e apenas despesa.", "Variavel por vendas sempre entra no passivo."], "correta": 1, "comentario": "A regra correta e: E mensurado pelo valor presente dos pagamentos ainda nao efetuados. As demais alternativas contrariam o pronunciamento."}, {"id": 13, "tema": "Taxa de desconto", "nivel": "Facil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre taxa de desconto.", "alternativas": ["Variavel por vendas sempre entra no passivo.", "O arrendador nao classifica arrendamentos.", "Usa-se a taxa implicita se determinavel; caso contrario, a taxa incremental do arrendatario.", "Principal e fluxo operacional.", "Curto prazo sempre tem opcao de compra."], "correta": 2, "comentario": "A regra correta e: Usa-se a taxa implicita se determinavel; caso contrario, a taxa incremental do arrendatario. As demais alternativas contrariam o pronunciamento."}, {"id": 14, "tema": "Pagamentos fixos", "nivel": "Medio", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre pagamentos fixos.", "alternativas": ["Variavel por vendas sempre entra no passivo.", "O passivo e o valor nominal sem desconto.", "Taxa incremental e proibida.", "Pagamentos fixos e fixos em essencia, liquidos de incentivos, integram o passivo.", "Direito de uso nao deprecia."], "correta": 3, "comentario": "A regra correta e: Pagamentos fixos e fixos em essencia, liquidos de incentivos, integram o passivo. As demais alternativas contrariam o pronunciamento."}, {"id": 15, "tema": "Pagamentos por indice", "nivel": "Dificil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre pagamentos por indice.", "alternativas": ["Taxa incremental e proibida.", "O arrendador nao classifica arrendamentos.", "O passivo e o valor nominal sem desconto.", "Direito de uso nao deprecia.", "Pagamentos variaveis por indice ou taxa entram inicialmente pelo indice ou taxa da data de inicio."], "correta": 4, "comentario": "A regra correta e: Pagamentos variaveis por indice ou taxa entram inicialmente pelo indice ou taxa da data de inicio. As demais alternativas contrariam o pronunciamento."}, {"id": 16, "tema": "Opcao de compra", "nivel": "Facil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre opcao de compra.", "alternativas": ["O preco de exercicio integra o passivo quando o exercicio e razoavelmente certo.", "Direito de uso nao deprecia.", "Todo servico contem arrendamento.", "O arrendador nao classifica arrendamentos.", "Retroarrendamento sempre e venda."], "correta": 0, "comentario": "A regra correta e: O preco de exercicio integra o passivo quando o exercicio e razoavelmente certo. As demais alternativas contrariam o pronunciamento."}, {"id": 17, "tema": "Depreciacao", "nivel": "Medio", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre depreciacao.", "alternativas": ["Retroarrendamento sempre e venda.", "Com transferencia ou compra provavel, usa-se a vida util; caso contrario, o menor entre vida util e prazo.", "O arrendador nao classifica arrendamentos.", "Curto prazo sempre tem opcao de compra.", "Direito de uso nao deprecia."], "correta": 1, "comentario": "A regra correta e: Com transferencia ou compra provavel, usa-se a vida util; caso contrario, o menor entre vida util e prazo. As demais alternativas contrariam o pronunciamento."}, {"id": 18, "tema": "Passivo subsequente", "nivel": "Dificil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre passivo subsequente.", "alternativas": ["O arrendador nao classifica arrendamentos.", "Taxa incremental e proibida.", "Aumenta pelos juros, diminui pelos pagamentos e e remensurado quando aplicavel.", "Todo arrendamento e apenas despesa.", "O passivo e o valor nominal sem desconto."], "correta": 2, "comentario": "A regra correta e: Aumenta pelos juros, diminui pelos pagamentos e e remensurado quando aplicavel. As demais alternativas contrariam o pronunciamento."}, {"id": 19, "tema": "Remensuracao", "nivel": "Facil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre remensuracao.", "alternativas": ["Curto prazo sempre tem opcao de compra.", "Todo arrendamento e apenas despesa.", "Variavel por vendas sempre entra no passivo.", "Mudanca de prazo ou compra usa taxa revisada; alteracao de indice geralmente mantem a taxa.", "Direito de uso nao deprecia."], "correta": 3, "comentario": "A regra correta e: Mudanca de prazo ou compra usa taxa revisada; alteracao de indice geralmente mantem a taxa. As demais alternativas contrariam o pronunciamento."}, {"id": 20, "tema": "Modificacao separada", "nivel": "Medio", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre modificacao separada.", "alternativas": ["Todo servico contem arrendamento.", "Direito de uso nao deprecia.", "Variavel por vendas sempre entra no passivo.", "O arrendador nao classifica arrendamentos.", "Ocorre quando aumenta o alcance e a contraprestacao cresce em preco individual compativel."], "correta": 4, "comentario": "A regra correta e: Ocorre quando aumenta o alcance e a contraprestacao cresce em preco individual compativel. As demais alternativas contrariam o pronunciamento."}, {"id": 21, "tema": "Balanco", "nivel": "Dificil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre balanco.", "alternativas": ["Direitos de uso e passivos sao apresentados separadamente ou com indicacao clara das rubricas.", "Taxa incremental e proibida.", "Principal e fluxo operacional.", "Direito de uso nao deprecia.", "O passivo e o valor nominal sem desconto."], "correta": 0, "comentario": "A regra correta e: Direitos de uso e passivos sao apresentados separadamente ou com indicacao clara das rubricas. As demais alternativas contrariam o pronunciamento."}, {"id": 22, "tema": "DFC", "nivel": "Facil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre dfc.", "alternativas": ["Retroarrendamento sempre e venda.", "Principal e financiamento; juros seguem CPC 03; curto prazo, baixo valor e variaveis fora do passivo sao operacionais.", "Todo arrendamento e apenas despesa.", "Curto prazo sempre tem opcao de compra.", "O arrendador nao classifica arrendamentos."], "correta": 1, "comentario": "A regra correta e: Principal e financiamento; juros seguem CPC 03; curto prazo, baixo valor e variaveis fora do passivo sao operacionais. As demais alternativas contrariam o pronunciamento."}, {"id": 23, "tema": "Arrendador financeiro", "nivel": "Medio", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre arrendador financeiro.", "alternativas": ["Todo servico contem arrendamento.", "Principal e fluxo operacional.", "Transfere substancialmente riscos e beneficios e reconhece investimento liquido a receber.", "O passivo e o valor nominal sem desconto.", "O arrendador nao classifica arrendamentos."], "correta": 2, "comentario": "A regra correta e: Transfere substancialmente riscos e beneficios e reconhece investimento liquido a receber. As demais alternativas contrariam o pronunciamento."}, {"id": 24, "tema": "Arrendador operacional", "nivel": "Dificil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre arrendador operacional.", "alternativas": ["O arrendador nao classifica arrendamentos.", "O passivo e o valor nominal sem desconto.", "Retroarrendamento sempre e venda.", "Nao transfere substancialmente riscos e beneficios e mantem o ativo no balanco.", "Todo servico contem arrendamento."], "correta": 3, "comentario": "A regra correta e: Nao transfere substancialmente riscos e beneficios e mantem o ativo no balanco. As demais alternativas contrariam o pronunciamento."}, {"id": 25, "tema": "Investimento liquido", "nivel": "Facil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre investimento liquido.", "alternativas": ["Principal e fluxo operacional.", "O passivo e o valor nominal sem desconto.", "Todo servico contem arrendamento.", "O arrendador nao classifica arrendamentos.", "E o investimento bruto descontado pela taxa implicita."], "correta": 4, "comentario": "A regra correta e: E o investimento bruto descontado pela taxa implicita. As demais alternativas contrariam o pronunciamento."}, {"id": 26, "tema": "Receita financeira", "nivel": "Medio", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre receita financeira.", "alternativas": ["E reconhecida com taxa de retorno periodica constante sobre o investimento liquido.", "Direito de uso nao deprecia.", "Principal e fluxo operacional.", "O passivo e o valor nominal sem desconto.", "Retroarrendamento sempre e venda."], "correta": 0, "comentario": "A regra correta e: E reconhecida com taxa de retorno periodica constante sobre o investimento liquido. As demais alternativas contrariam o pronunciamento."}, {"id": 27, "tema": "Venda e retroarrendamento", "nivel": "Dificil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre venda e retroarrendamento.", "alternativas": ["Direito de uso nao deprecia.", "A transferencia e avaliada pelo CPC 47 para determinar se e uma venda.", "Retroarrendamento sempre e venda.", "Taxa incremental e proibida.", "Variavel por vendas sempre entra no passivo."], "correta": 1, "comentario": "A regra correta e: A transferencia e avaliada pelo CPC 47 para determinar se e uma venda. As demais alternativas contrariam o pronunciamento."}, {"id": 28, "tema": "Transferencia e venda", "nivel": "Facil", "enunciado": "A luz do CPC 06 (R2), assinale a alternativa correta sobre transferencia e venda.", "alternativas": ["Curto prazo
