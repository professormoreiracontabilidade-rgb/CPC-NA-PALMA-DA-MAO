<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 02 | Professor Moreira</title><link rel="stylesheet" href="../assets/cpc02.css"></head><body><header><div class="wrap"><div class="brand">CPC NA PALMA DA MÃO • PROFESSOR MOREIRA</div><h1>Quiz 02</h1><p>CPC 02 (R2) — Efeitos das Mudanças nas Taxas de Câmbio e Conversão de Demonstrações Contábeis</p></div></header><nav><a href="../index.html">⌂ Aplicativo</a><a href="../resumos/cpc02-resumo.html">Resumo</a><a href="../mapas/cpc02-mapa.html">Mapa</a><a href="../casos/cpc02-casos.html">Casos</a><a href="../resumos/cpc02-flashcards.html">Flashcards</a><a href="../quizzes/cpc02-index.html">Quizzes</a><a href="../comentarios/cpc02-questoes.html">Questões</a><a href="../questoes/cpc02-banco.html">Banco</a></nav><main><section class="card"><p id="num"></p><h2 id="q"></h2><div id="opts"></div><div id="exp" class="tip hidden"></div><div class="toolbar"><button id="prev">← Voltar</button><button id="next">Avançar →</button></div></section><script>const QUESTIONS=[{"id": 11, "tema": "Taxa média", "nivel": "Médio", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre taxa média.", "alternativas": ["Pode ser usada por praticidade quando se aproxima da taxa das datas das transações; não é apropriada se houver flutuação significativa.", "A moeda funcional pode ser escolhida livremente pela administração.", "A baixa de investimento nunca afeta diferenças acumuladas de conversão.", "Itens não monetários ao custo histórico são atualizados pela taxa de fechamento.", "Toda variação cambial deve ser reconhecida exclusivamente no resultado."], "correta": 0, "comentario": "A alternativa correta decorre da regra do CPC 02: Pode ser usada por praticidade quando se aproxima da taxa das datas das transações; não é apropriada se houver flutuação significativa. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 12, "tema": "Itens monetários no fechamento", "nivel": "Difícil", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre itens monetários no fechamento.", "alternativas": ["A taxa média é sempre obrigatória, mesmo quando há forte oscilação cambial.", "Devem ser convertidos pela taxa de câmbio de fechamento.", "Itens não monetários ao custo histórico são atualizados pela taxa de fechamento.", "A mudança da moeda funcional deve ser aplicada retrospectivamente.", "Todo item em moeda estrangeira é convertido sempre pela taxa de fechamento."], "correta": 1, "comentario": "A alternativa correta decorre da regra do CPC 02: Devem ser convertidos pela taxa de câmbio de fechamento. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 13, "tema": "Itens não monetários ao custo histórico", "nivel": "Fácil", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre itens não monetários ao custo histórico.", "alternativas": ["Toda variação cambial deve ser reconhecida exclusivamente no resultado.", "A mudança da moeda funcional deve ser aplicada retrospectivamente.", "Devem ser convertidos pela taxa da data da transação.", "Itens não monetários ao custo histórico são atualizados pela taxa de fechamento.", "A moeda de apresentação deve obrigatoriamente ser igual à moeda funcional."], "correta": 2, "comentario": "A alternativa correta decorre da regra do CPC 02: Devem ser convertidos pela taxa da data da transação. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 14, "tema": "Itens não monetários ao valor justo", "nivel": "Médio", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre itens não monetários ao valor justo.", "alternativas": ["A baixa de investimento nunca afeta diferenças acumuladas de conversão.", "A moeda de apresentação deve obrigatoriamente ser igual à moeda funcional.", "Goodwill adquirido no exterior é tratado como ativo da controladora e nunca da entidade no exterior.", "Devem ser convertidos pela taxa da data em que o valor justo foi mensurado.", "A mudança da moeda funcional deve ser aplicada retrospectivamente."], "correta": 3, "comentario": "A alternativa correta decorre da regra do CPC 02: Devem ser convertidos pela taxa da data em que o valor justo foi mensurado. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 15, "tema": "Variação cambial no resultado", "nivel": "Difícil", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre variação cambial no resultado.", "alternativas": ["A moeda funcional pode ser escolhida livremente pela administração.", "Toda variação cambial deve ser reconhecida exclusivamente no resultado.", "A baixa de investimento nunca afeta diferenças acumuladas de conversão.", "Operações de hedge são disciplinadas exclusivamente pelo CPC 02.", "Em regra, diferenças de itens monetários são reconhecidas no resultado do período."], "correta": 4, "comentario": "A alternativa correta decorre da regra do CPC 02: Em regra, diferenças de itens monetários são reconhecidas no resultado do período. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 16, "tema": "Variação cambial em ORA", "nivel": "Fácil", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre variação cambial em ora.", "alternativas": ["Quando o ganho ou perda do item não monetário é reconhecido em outros resultados abrangentes, a variação cambial correspondente também segue para ORA.", "A baixa de investimento nunca afeta diferenças acumuladas de conversão.", "A taxa média é sempre obrigatória, mesmo quando há forte oscilação cambial.", "A mudança da moeda funcional deve ser aplicada retrospectivamente.", "Goodwill adquirido no exterior é tratado como ativo da controladora e nunca da entidade no exterior."], "correta": 0, "comentario": "A alternativa correta decorre da regra do CPC 02: Quando o ganho ou perda do item não monetário é reconhecido em outros resultados abrangentes, a variação cambial correspondente também segue para ORA. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 17, "tema": "Moeda funcional - indicadores primários", "nivel": "Médio", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre moeda funcional - indicadores primários.", "alternativas": ["Operações de hedge são disciplinadas exclusivamente pelo CPC 02.", "Devem ser priorizadas a moeda que influencia preços de venda e a moeda que influencia custos de mão de obra, materiais e outros insumos.", "A moeda funcional pode ser escolhida livremente pela administração.", "Goodwill adquirido no exterior é tratado como ativo da controladora e nunca da entidade no exterior.", "Itens não monetários ao custo histórico são atualizados pela taxa de fechamento."], "correta": 1, "comentario": "A alternativa correta decorre da regra do CPC 02: Devem ser priorizadas a moeda que influencia preços de venda e a moeda que influencia custos de mão de obra, materiais e outros insumos. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 18, "tema": "Moeda funcional - indicadores adicionais", "nivel": "Difícil", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre moeda funcional - indicadores adicionais.", "alternativas": ["Itens não monetários ao custo histórico são atualizados pela taxa de fechamento.", "Operações de hedge são disciplinadas exclusivamente pelo CPC 02.", "Incluem a moeda dos financiamentos e aquela em que os recursos das atividades operacionais são mantidos.", "Goodwill adquirido no exterior é tratado como ativo da controladora e nunca da entidade no exterior.", "A taxa média é sempre obrigatória, mesmo quando há forte oscilação cambial."], "correta": 2, "comentario": "A alternativa correta decorre da regra do CPC 02: Incluem a moeda dos financiamentos e aquela em que os recursos das atividades operacionais são mantidos. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 19, "tema": "Alteração da moeda funcional", "nivel": "Fácil", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre alteração da moeda funcional.", "alternativas": ["A mudança da moeda funcional deve ser aplicada retrospectivamente.", "Toda variação cambial deve ser reconhecida exclusivamente no resultado.", "Itens não monetários ao custo histórico são atualizados pela taxa de fechamento.", "Somente ocorre quando mudam as transações, eventos e condições subjacentes; a aplicação é prospectiva.", "Todo item em moeda estrangeira é convertido sempre pela taxa de fechamento."], "correta": 3, "comentario": "A alternativa correta decorre da regra do CPC 02: Somente ocorre quando mudam as transações, eventos e condições subjacentes; a aplicação é prospectiva. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}, {"id": 20, "tema": "Entidade no exterior", "nivel": "Médio", "enunciado": "Considerando o CPC 02 (R2), assinale a alternativa correta sobre entidade no exterior.", "alternativas": ["Operações de hedge são disciplinadas exclusivamente pelo CPC 02.", "A moeda funcional pode ser escolhida livremente pela administração.", "Goodwill adquirido no exterior é tratado como ativo da controladora e nunca da entidade no exterior.", "Todo item em moeda estrangeira é convertido sempre pela taxa de fechamento.", "É controlada, coligada, negócio em conjunto, filial, sucursal ou agência com atividades em país ou moeda diferente."], "correta": 4, "comentario": "A alternativa correta decorre da regra do CPC 02: É controlada, coligada, negócio em conjunto, filial, sucursal ou agência com atividades em país ou moeda diferente. As demais opções contrariam a classificação, a taxa aplicável ou a forma de reconhecimento prevista no pronunciamento."}];let i=0,score=0,done={};function r(){let x=QUESTIONS[i];num.textContent=`Questão ${i+1} de ${QUESTIONS.length}`;q.textContent=x.enunciado;opts.innerHTML=x.alternativas.map((a,j)=>`<button onclick="ans(${j})">${String.fromCharCode(65+j)}) ${a}</button>`).join("");exp.classList.add("hidden");}function ans(j){let x=QUESTIONS[i];if(done[i]===undefined){done[i]=j;if(j===x.correta)score++;}exp.textContent=(j===x.correta?"✓ Correto. ":"✗ Incorreto. ")+x.comentario;exp.classList.remove("hidden");}prev.onclick=()=>{i=Math.max(0,i-1);r()};next.onclick=()=>{if(i<QUESTIONS.length-1){i++;r()}else{q.textContent=`Resultado: ${score} de ${QUESTIONS.length}`;opts.innerHTML="";exp.textContent="Revise os comentários e reinicie para tentar novamente.";exp.classList.remove("hidden");}};r();</script></main><footer>Curso de Contabilidade Professor Moreira • WhatsApp 61 985323574</footer></body></html>
