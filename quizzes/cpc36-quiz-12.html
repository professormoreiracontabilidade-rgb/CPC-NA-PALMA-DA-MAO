ança sem perda de controle gera ganho no resultado.", "Na perda de controle, reconhece-se o ganho ou perda correspondente.", "A consolidação começa na aquisição das ações, mesmo sem controle.", "Participação não controladora fica no passivo.", "Dependência econômica sempre significa controle."], "correta": 1, "comentario": "A alternativa correta decorre do CPC 36: Na perda de controle, reconhece-se o ganho ou perda correspondente. As demais opções confundem controle, poder, consolidação, não controladores ou perda de controle."}, {"id": 113, "tema": "Entidade de investimento", "nivel": "Médio", "enunciado": "De acordo com o CPC 36 (R3), assinale a alternativa correta sobre entidade de investimento.", "alternativas": ["Entidade de investimento sempre consolida todas as controladas.", "Mudança sem perda de controle gera ganho no resultado.", "Obtém recursos de investidores, investe para retorno e avalia substancialmente pelo valor justo.", "Participação não controladora fica no passivo.", "Perda de controle não exige remensuração."], "correta": 2, "comentario": "A alternativa correta decorre do CPC 36: Obtém recursos de investidores, investe para retorno e avalia substancialmente pelo valor justo. As demais opções confundem controle, poder, consolidação, não controladores ou perda de controle."}, {"id": 114, "tema": "Exceção de entidade de investimento", "nivel": "Difícil", "enunciado": "De acordo com o CPC 36 (R3), assinale a alternativa correta sobre exceção de entidade de investimento.", "alternativas": ["Perda de controle não exige remensuração.", "Dependência econômica sempre significa controle.", "A consolidação começa na aquisição das ações, mesmo sem controle.", "Em regra, mensura controladas ao valor justo por meio do resultado.", "Direitos de proteção conferem poder."], "correta": 3, "comentario": "A alternativa correta decorre do CPC 36: Em regra, mensura controladas ao valor justo por meio do resultado. As demais opções confundem controle, poder, consolidação, não controladores ou perda de controle."}, {"id": 115, "tema": "Controlada prestadora de serviços", "nivel": "Fácil", "enunciado": "De acordo com o CPC 36 (R3), assinale a alternativa correta sobre controlada prestadora de serviços.", "alternativas": ["Agente sempre controla a investida.", "Entidade de investimento sempre consolida todas as controladas.", "A consolidação começa na aquisição das ações, mesmo sem controle.", "Controle depende apenas da maioria dos votos.", "Entidade de investimento consolida controlada que presta serviços relacionados às atividades de investimento."], "correta": 4, "comentario": "A alternativa correta decorre do CPC 36: Entidade de investimento consolida controlada que presta serviços relacionados às atividades de investimento. As demais opções confundem controle, poder, consolidação, não controladores ou perda de controle."}, {"id": 116, "tema": "Reavaliação da condição", "nivel": "Médio", "enunciado": "De acordo com o CPC 36 (R3), assinale a alternativa correta sobre reavaliação da condição.", "alternativas": ["Mudanças nos fatos exigem reavaliar se a entidade é entidade de investimento.", "A consolidação começa na aquisição das ações, mesmo sem controle.", "Transações intragrupo não são eliminadas.", "Controle depende apenas da maioria dos votos.", "Participação não controladora fica no passivo."], "correta": 0, "comentario": "A alternativa correta decorre do CPC 36: Mudanças nos fatos exigem reavaliar se a entidade é entidade de investimento. As demais opções confundem controle, poder, consolidação, não controladores ou perda de controle."}, {"id": 117, "tema": "Divulgação", "nivel": "Difícil", "enunciado": "De acordo com o CPC 36 (R3), assinale a alternativa correta sobre divulgação.", "alternativas": ["Participação não controladora fica no passivo.", "As divulgações sobre participações em outras entidades seguem também o CPC 45.", "Dependência econômica sempre significa controle.", "Agente sempre controla a investida.", "A
